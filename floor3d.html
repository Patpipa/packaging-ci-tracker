<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A1322">
<!-- Live Factory View — hosted next to the CI Tracker (index.html). Same Firebase project and sign-in; read-only. -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>3D Floor · CI Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one slim top bar, the 3D floor filling the screen, live machine cards docked at the bottom.
   Deliberately dark only, in the CI Tracker's own colours, so the two feel like one app. */
:root{
  --bg:#181B1E; --panel:#22262A; --panel2:#2B3034; --line:#383E43;
  --text:#EDEFF1; --muted:#9AA1A6; --muted2:#6D7377;
  --amber:#E0A030; --amber-ink:#1b1408;
  --run:#3FA35B; --wait:#D6534A; --change:#D98F2B; --planned:#B8A06A; --brk:#4A90D9; --nowork:#7C848A;
  --scene:#15181B;
  --display:Oswald,"Arial Narrow",Arial,sans-serif;
  --body:Inter,system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);overflow:hidden}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column}

/* top bar */
header{display:flex;align-items:center;gap:10px;padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.04em;margin:0;text-transform:uppercase;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);background:var(--panel2);border-radius:20px;padding:4px 10px;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--nowork)}
.pill[data-s="live"] i{background:var(--run);box-shadow:0 0 0 3px rgba(63,163,91,.25)} .pill[data-s="off"] i{background:var(--wait)} .pill[data-s="demo"] i{background:var(--amber)}
.total{flex:1;min-width:0;font-family:var(--mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.total b{color:var(--text);font-weight:600}
.tools{display:flex;gap:6px}
.ibtn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:38px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;padding:0}
.ibtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ibtn .badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--amber);color:var(--amber-ink);font:700 11px/18px var(--body);text-align:center;padding:0 4px}
button:focus-visible,input:focus-visible,.card:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
@media (max-width:520px){h1{display:none}}

/* 3D floor */
#stage{position:relative;flex:1 1 auto;min-height:55vh;background:var(--scene)}
#stage canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}
.banner{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:10px;font-size:12px;line-height:1.4;color:var(--text);background:rgba(34,38,42,.94);border:1px solid var(--line);border-left:4px solid var(--amber);padding:7px 10px;border-radius:8px;max-width:520px}

/* machine cards */
#cards{display:none!important}
.alarmbar{position:absolute;left:50%;transform:translateX(-50%);top:10px;z-index:5;max-width:calc(100% - 24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:700 13px var(--body);color:#fff;background:var(--wait);border:0;border-radius:20px;padding:8px 16px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35);animation:alarmPulse 1.2s ease-in-out infinite}
.alarmbar span{opacity:.8;font-weight:600}
.mstate{display:flex;align-items:center;gap:8px;font:600 18px var(--body);margin:6px 0 2px;color:var(--st)} .mstate .dot{width:10px;height:10px;border-radius:50%;background:var(--st)}
.mreason{font-size:15px;color:var(--st);margin:2px 0 6px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
.mgrid div{background:var(--panel2);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:3px;min-width:0}
.mgrid b{font-size:14px;font-weight:600;overflow-wrap:anywhere} .mgrid .people svg{width:9px;height:13px;fill:var(--text)}
.runlist .dtr{color:var(--muted);text-align:right;font-family:var(--body);font-size:12.5px;max-width:60%}
.note.foot{border-left:3px solid var(--amber);padding:6px 8px;background:var(--panel2);border-radius:6px;margin-top:6px}
.total sup{color:var(--amber)}
#cards{flex:0 0 auto;align-items:stretch;display:flex;gap:10px;overflow-x:auto;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--bg);border-top:1px solid var(--line);scroll-snap-type:x mandatory;scrollbar-width:none}
#cards::-webkit-scrollbar{display:none}
.card{flex:1 0 210px;max-width:300px;scroll-snap-align:start;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--st);border-radius:12px;
  padding:9px 12px;display:flex;flex-direction:column;gap:5px;cursor:pointer;--st:var(--nowork);transition:background .15s}
.card:active{background:var(--panel2)}
.card[data-tone="run"]{--st:var(--run)} .card[data-tone="wait"]{--st:var(--wait)} .card[data-tone="change"]{--st:var(--change)}
.card[data-tone="planned"]{--st:var(--planned)} .card[data-tone="brk"]{--st:var(--brk)}
.ctop{display:flex;align-items:center;gap:8px}
.cname{font-family:var(--display);font-weight:600;font-size:18px;text-transform:uppercase;letter-spacing:.04em}
.chip{margin-left:auto;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--st);background:color-mix(in srgb,var(--st) 16%,transparent);border-radius:20px;padding:3px 8px;white-space:nowrap}
.prod{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dim{color:var(--muted2)}
.why{font-size:12.5px;color:var(--st);line-height:1.3}
.meta{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);min-height:18px}
.meta b{font-family:var(--mono);color:var(--text);font-weight:600}
.people{display:inline-flex;gap:2px}
.people svg{width:10px;height:14px;fill:var(--st)}
.timer{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.timer.hot{color:var(--st);font-weight:600}
.card.alarm{animation:alarmPulse 1.2s ease-in-out infinite;background:color-mix(in srgb,var(--wait) 14%,var(--panel))}
@keyframes alarmPulse{0%,100%{box-shadow:0 0 0 0 rgba(214,83,74,.0)}50%{box-shadow:0 0 0 3px rgba(214,83,74,.75)}}
.alarmline{font-size:12px;font-weight:700;letter-spacing:.03em;color:#fff;background:var(--wait);border-radius:6px;padding:3px 8px;align-self:flex-start}
.ibtn[aria-pressed="true"]{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.tourchip{display:none;position:absolute;left:50%;transform:translateX(-50%);bottom:12px;font:600 12px var(--body);color:var(--text);background:rgba(24,27,30,.85);border:1px solid var(--line);border-radius:20px;padding:6px 14px;cursor:pointer}
.display .tourchip{display:block}
.plh{font-family:var(--mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.plh b{font-size:17px;color:var(--text);font-weight:600}

/* Other stations panel */
#sideSheet{position:fixed;inset:0;z-index:41;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.state{font-size:15px;margin:6px 0 2px;color:var(--muted)} .state.on{color:var(--run);font-weight:600}
.bigact{font:600 18px var(--display);letter-spacing:.05em;text-transform:uppercase;border:0;border-radius:12px;padding:16px;cursor:pointer;width:100%}
.bigact.go{background:var(--run);color:#0e1a12} .bigact.stop{background:var(--wait);color:#fff} .bigact:disabled{opacity:.6}
.ppl{display:flex;align-items:center;gap:8px;margin:4px 0 6px;font-size:14px;color:var(--muted)} .ppl span{flex:1}
.pp{font:600 18px var(--body);width:52px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer}
.pp.on{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
h3.sub{font-family:var(--display);text-transform:uppercase;letter-spacing:.05em;font-size:14px;color:var(--muted);margin:10px 0 0}
.runlist{display:flex;flex-direction:column;font-family:var(--mono);font-size:13px} .runlist div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.sidecard{cursor:default;flex-basis:250px;gap:2px}
.sidebtn{font:inherit;color:var(--text);background:none;border:0;border-top:1px solid var(--line);padding:6px 0;cursor:pointer;text-align:left;width:100%}
.sidebtn .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--st);margin-right:7px}
.sidebtn .sline{font-size:11.5px;color:var(--muted);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:58%}
.crewchip{--st:var(--amber)}
.timerow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0 8px;font-size:14px;color:var(--muted)}
.timerow label{flex:1;min-width:140px}
.timerow input{font:600 18px var(--mono);padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text)}
.hbtn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.toggle{font:700 14px var(--body);min-width:64px;height:40px;border-radius:20px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);cursor:pointer}
.toggle.on{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
#sheetBody .helperrow{border-bottom:1px solid var(--line)}
.helperline{font-size:13px;padding:5px 0;border-top:1px solid var(--line);--st:var(--amber)} .helperline .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--amber);margin-right:7px}
.helperline .sline{font-size:11.5px;color:var(--muted)}
.crewrow .lbl{font-weight:600} .crewrow{border-bottom:2px solid var(--line)!important;padding-bottom:10px!important}
#sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sheetbox{background:var(--panel);color:var(--text);width:100%;max-width:520px;max-height:85%;overflow-y:auto;border-radius:16px 16px 0 0;border:1px solid var(--line);
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sheethead h2{font-family:var(--display);text-transform:uppercase;letter-spacing:.04em;font-size:22px;margin:0}
.hbtn{font:600 13px var(--body);background:var(--amber);color:var(--amber-ink);border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
.srow{display:flex;align-items:center;justify-content:space-between;gap:8px}
#sheetBody .srow{padding-block:7px;border-bottom:1px solid var(--line);font-size:15px}
.staff{display:flex;align-items:center;gap:8px}
.staff b{font-family:var(--mono);font-size:18px;min-width:24px;text-align:center}
button.big{font:600 22px var(--body);width:48px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer}
.note{font-size:12px;color:var(--muted);line-height:1.4;margin:0}

/* sign in */
#login{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(24,27,30,.85);padding:16px}
#login form{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;width:100%;max-width:330px;display:flex;flex-direction:column;gap:10px}
#login h2{font-family:var(--display);text-transform:uppercase;letter-spacing:.04em;margin:0;font-size:22px}
#login p{margin:0;font-size:13px;color:var(--muted)}
#login input{font:inherit;font-size:16px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text)}
#login button{font:600 15px var(--body);padding:11px;border-radius:8px;border:0;background:var(--amber);color:var(--amber-ink);cursor:pointer}
#loginErr{color:var(--wait);font-size:12.5px}

/* shown inside the CI Tracker Dashboard (floor3d.html?embed=1): only the 3D floor, filling the frame */
.embed .topbar,.embed .rail,.embed .tabbar,.embed #photo,.embed #modeBtn,.embed .backbtn{display:none!important}
.embed #app{min-height:0}
.embed .mainarea{display:block!important;padding:0!important;flex:1 1 auto;min-height:0;height:100%}
.embed #stage{height:100%!important;min-height:0!important;border:0;border-radius:0;aspect-ratio:auto!important}
.embed body,.embed{overflow:hidden}
.embed header{padding-block:6px;background:var(--bg)}
.embed #banner,.embed h1{display:none}
.embed #stage{min-height:0}
.embed #cards{padding-block:8px;gap:8px}
.embed .card{flex-basis:190px;padding:8px 10px}
.embed .cname{font-size:16px}.embed .plh b{font-size:15px}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card.alarm{animation:none;box-shadow:0 0 0 3px rgba(214,83,74,.75)}}

/* ===== Live Factory View layer =====
   Layout: header with brand + efficiency tiles, the 3D floor as the hero, status panels in a right rail
   (stacked under the floor on a phone), tab bar at the bottom. Committed single dark look in navy;
   the status colours are the CI Tracker's own and are not changed here. */
:root{
  --bg:#0A1322; --panel:#0F1D33; --panel2:#152744; --line:#203A60;
  --text:#E6EDF7; --muted:#93A5C2; --muted2:#62748F;
  --amber:#3BA7E6; --amber-ink:#04111E;
  --accent:#3BA7E6; --accent-dim:#123150;
  --up:#C77DD6; --int:#4FB3C2;
  --scene:#0D1A2D;
  color-scheme:dark;
}
html,body{height:auto;background:var(--bg);color:var(--text)}
body{overflow-x:hidden;overflow-y:auto}
#app{height:auto;min-height:100%;display:flex;flex-direction:column}

/* header */
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(180deg,#10223C,#0C192D);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
.brand svg{width:34px;height:34px;flex:none;fill:var(--accent)}
.brand h1{display:block;font-family:var(--display);font-weight:600;font-size:21px;letter-spacing:.02em;text-transform:none;margin:0;line-height:1.1;white-space:nowrap}
.brand .sub{display:block;font-size:13px;font-weight:600;color:var(--accent);letter-spacing:.02em}
.clock{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.clock .pill{background:var(--panel2)}
.kpis{display:flex;gap:8px;flex-wrap:wrap;order:3;width:100%}
.kpi{flex:1 1 150px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.kpi .k{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--mono);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .v small{font-size:11.5px;color:var(--muted);font-weight:500;margin-left:4px}
.effrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:4px}
.effrow div{display:flex;flex-direction:column;align-items:flex-start}
.effrow span{font-size:10.5px;color:var(--muted);white-space:nowrap}
.effrow b{font-family:var(--mono);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
@media (min-width:900px){.kpis{order:0;width:auto;flex:1 1 auto;max-width:720px}}

/* main area */
.mainarea{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;padding-block:12px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));flex:1 1 auto}
#stage{flex:none;height:72vh;min-height:380px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--scene)}
.rail{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;align-content:start;min-width:0}
@media (min-width:640px) and (max-width:899px){.rail{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:900px){
  html,body{height:100%;overflow:hidden}
  #app{height:100%}
  .mainarea{grid-template-columns:minmax(0,1fr) 340px;min-height:0}
  #stage{height:auto;min-height:0}
  .rail{overflow-y:auto;padding-right:2px;scrollbar-width:thin}
}

/* floating floor controls */
.stagetools{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;z-index:4}
.stagetools .ibtn{background:rgba(15,29,51,.88);border-color:var(--line);backdrop-filter:blur(4px)}
.banner{border-left-color:var(--accent);background:rgba(15,29,51,.94)}
.alarmbar{top:auto;bottom:58px}

/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.panel h2{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.05em;text-transform:uppercase;margin:0 0 6px;color:var(--text)}
.panel h2 svg{width:17px;height:17px;flex:none;fill:none;stroke:var(--accent);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.panel h2 .cap{margin-left:auto;font-family:var(--body);font-size:11px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted2)}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px;min-width:0}
.row:first-child{border-top:0}
.row .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .val{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.row.sub .lbl{padding-left:18px;color:var(--muted)}
.row.sub .lbl::before{content:"";display:inline-block;width:9px;height:1px;background:var(--muted2);vertical-align:middle;margin:0 7px 0 -16px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--st,var(--nowork))}
.mrow{cursor:pointer;border-radius:8px;background:none;border:0;border-top:1px solid var(--line);color:inherit;font:inherit;width:100%;text-align:left}
.mrow:first-child{border-top:0}
.mrow .name{font-weight:600}
.mrow .why{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stchip{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--st);background:color-mix(in srgb,var(--st) 16%,transparent);border-radius:20px;padding:3px 8px;white-space:nowrap}
.mins{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.hotmin{color:#fff;background:var(--wait);border-radius:6px;padding:2px 6px;font-weight:600}
.alarmpanel{border-color:color-mix(in srgb,var(--wait) 70%,var(--line));background:color-mix(in srgb,var(--wait) 12%,var(--panel))}
.alarmpanel h2{color:var(--wait)} .alarmpanel h2 svg{stroke:var(--wait)}
.alarmitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font:inherit;color:inherit;background:color-mix(in srgb,var(--wait) 16%,transparent);border:1px solid color-mix(in srgb,var(--wait) 55%,transparent);border-radius:8px;padding:8px 10px;cursor:pointer;margin-top:6px}
.alarmitem .t{flex:1;min-width:0}
.alarmitem b{display:block;font-size:13.5px}
.alarmitem span{font-size:12px;color:var(--wait)}
.okline{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.okline i{width:10px;height:10px;border-radius:50%;background:var(--run)}
.tag{font-size:10.5px;font-weight:600;border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:1px}
.tag.up{color:var(--up);background:color-mix(in srgb,var(--up) 16%,transparent)}
.tag.int{color:var(--int);background:color-mix(in srgb,var(--int) 16%,transparent)}
.sample{font-size:11px;color:var(--muted2);margin:6px 0 0}

/* tab bar */
.tabbar{position:sticky;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;
  padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));
  background:#0C182A;border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font:600 11.5px var(--body);color:var(--muted);background:none;border:0;border-radius:10px;padding:7px 2px;cursor:pointer}
.tab svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:#fff;background:linear-gradient(180deg,#1D74C2,#155A9A)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.alarmbar{animation:none}}

/* photo floor (2D) with live overlays */
.photo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;container-type:size;background:#0D1A2D;z-index:1}
.photoinner{position:relative;width:min(100cqw,150cqh);aspect-ratio:3/2}
.photoinner img{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:6px;user-select:none;-webkit-user-drag:none}
.pzone{position:absolute;border:2px solid var(--st);border-radius:10px;background:color-mix(in srgb,var(--st) 10%,transparent);box-shadow:0 0 18px color-mix(in srgb,var(--st) 55%,transparent);cursor:pointer;transition:border-color .3s,box-shadow .3s}
.pzone.alarm{animation:zonePulse 1.2s ease-in-out infinite}
@keyframes zonePulse{0%,100%{box-shadow:0 0 6px rgba(214,83,74,.4)}50%{box-shadow:0 0 26px rgba(214,83,74,.95)}}
.ptag{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;gap:2px;min-width:max-content;background:rgba(8,17,31,.9);border:1px solid color-mix(in srgb,var(--st) 60%,var(--line));border-radius:8px;padding:5px 8px;font-size:12px;line-height:1.25;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.ptag.below{transform:translate(-50%,0)}
.ptag.rt{transform:translate(-100%,0)}
.ptag b{font-weight:700;color:#fff;font-size:12.5px}
.ptag .s{display:flex;align-items:center;gap:6px;color:var(--st);font-weight:600}
.ptag .s i{width:8px;height:8px;border-radius:50%;background:var(--st)}
.ptag .m{font-family:var(--mono);font-size:11px;color:#fff;background:var(--wait);border-radius:4px;padding:0 5px;margin-left:4px}
.ptag .r{color:var(--muted);font-size:11px;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptag .st{font-size:11px;color:var(--muted)}
@media (max-width:640px){.ptag{padding:3px 6px;font-size:10px}.ptag b{font-size:10.5px}.ptag .r{display:none}.ptag .m{font-size:9.5px}.ptag .st{display:none}}
.modebtn{width:auto!important;padding:0 12px!important;font:700 13px var(--body)!important;letter-spacing:.04em}
#stage.is-photo .only3d{display:none}
@media (max-width:899px){#stage.is-photo{height:auto;min-height:0;aspect-ratio:3/2}}
@media (prefers-reduced-motion:reduce){.pzone.alarm{animation:none}}

/* v3: mockup-style machine cards + live conveyor trays */
.photoinner{container-type:inline-size}
.ptag{background:linear-gradient(180deg,rgba(10,20,38,.94),rgba(6,13,26,.94));border:1px solid rgba(120,160,220,.28);border-radius:9px;padding:6px 10px 7px;gap:3px;
  box-shadow:0 6px 18px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06)}
.ptag .nm{display:flex;align-items:center;gap:6px;font-weight:700;color:#fff;font-size:13px;letter-spacing:.01em}
.ptag .nm i{width:7px;height:7px;border-radius:50%;background:var(--st);box-shadow:0 0 6px var(--st)}
.ptag .s{font-size:13.5px;gap:7px}
.ptag .s i{width:13px;height:13px;box-shadow:0 0 8px var(--st);animation:beacon 2.4s ease-in-out infinite}
.ptag .ft{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.ptag .ft b{color:var(--text);font-family:var(--mono);font-weight:600}
.ptag .m{display:inline-flex;align-items:center;gap:3px;font-family:var(--mono);font-size:11.5px;font-weight:600;color:#fff;background:var(--wait);border-radius:5px;padding:1px 6px;margin-left:0}
.ptag .m.calm{background:rgba(255,255,255,.1)}
.ptag .m svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2.2}
@keyframes beacon{0%,100%{opacity:1}50%{opacity:.55}}
@media (max-width:640px){.ptag{padding:3px 6px;gap:1px}.ptag .nm{font-size:10px}.ptag .s{font-size:10px}.ptag .s i{width:8px;height:8px}.ptag .ft{font-size:9px;gap:4px}.ptag .m{font-size:9px;padding:0 4px}}
.belts{position:absolute;inset:0;pointer-events:none}
.belt{position:absolute;height:1.15cqw;transform-origin:0 50%;overflow:visible}
.belt i{position:absolute;top:0;left:0;width:1.45cqw;height:1.05cqw;border-radius:2px;background:linear-gradient(180deg,#F6C2CB,#E58E9F);border:1px solid rgba(255,255,255,.85);box-shadow:0 1px 2px rgba(0,0,0,.35);
  opacity:0;animation:slide var(--d,6s) linear infinite}
.belt.v{height:1.45cqw}.belt.v i{width:1.05cqw;height:1.45cqw}
@keyframes slide{0%{left:0;opacity:0}8%{opacity:1}92%{opacity:1}100%{left:100%;opacity:0}}
.belt.stop i{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){.belt i{animation:none;opacity:1}.ptag .s i{animation:none}}

/* machine window copied from the CI Tracker dashboard ("Today" card) */
:root{--run-dim:#1D3323;--change-dim:#3A2A14;--wait-dim:#3A1E1C;--brk-dim:#1C2A3A;--nowork-dim:#26292C;--planned-dim:#302A1E}
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.machine-card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:18px 10px;text-align:left;min-width:0;position:relative;cursor:pointer;color:var(--text);font:inherit}
@keyframes breathingGlow{0%,100%{box-shadow:0 0 3px 0px var(--glow-color)}50%{box-shadow:0 0 9px 2px var(--glow-color)}}
.machine-card.glow-running{animation:breathingGlow 2.8s ease-in-out infinite}
@keyframes alarmFlash{0%,100%{box-shadow:0 0 6px 1px var(--wait);background:var(--panel2)}50%{box-shadow:0 0 18px 5px var(--wait);background:rgba(224,90,80,0.14)}}
.machine-card.alarm-flash{animation:alarmFlash 1s ease-in-out infinite;border-width:2px}
@media (prefers-reduced-motion:reduce){.machine-card.glow-running{animation:none;box-shadow:0 0 4px 0px var(--glow-color)}.machine-card.alarm-flash{animation:none;box-shadow:0 0 10px 2px var(--wait);background:rgba(224,90,80,0.12)}}
.machine-card .mname{font-family:var(--display);font-size:15px;color:var(--text);letter-spacing:0.05em}
.machine-card .mono{font-family:var(--mono)}
.mc-badge{display:inline-flex;align-items:center;gap:5px;border-radius:20px;margin-top:8px;font-size:9px;padding:3px 8px;font-weight:800;letter-spacing:0.04em}

/* ===== 3D floor only (CI Tracker link "Open 3D floor view") =====
   Header, side panels, tab bar, photo mode, alarm banner and the other-stations button are hidden;
   the 3D floor fills the screen. Tapping a machine still opens its detail panel. */
.topbar,.rail,.tabbar,#modeBtn,#stationsBtn,#photo,.alarmbar{display:none!important}
html,body{height:100%;overflow:hidden}
#app{height:100vh;height:100dvh;min-height:0}
.mainarea{display:block!important;padding:0!important;height:100%}
#stage{height:100%!important;min-height:0!important;border:0!important;border-radius:0!important;aspect-ratio:auto!important}
.stagetools{left:max(10px,env(safe-area-inset-left,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.backbtn{position:absolute;z-index:6;top:calc(10px + env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));
  display:inline-flex;align-items:center;gap:6px;font:600 13px var(--body);color:var(--text);text-decoration:none;
  background:rgba(15,29,51,.88);border:1px solid var(--line);border-radius:10px;padding:8px 12px;backdrop-filter:blur(4px)}
.backbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.conn3d{position:absolute;z-index:6;top:calc(10px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));background:rgba(15,29,51,.88)!important;border:1px solid var(--line)}
</style>

<script>
(function(){
"use strict";
const EMBED=/[?&]embed=1/.test(location.search);if(EMBED){document.documentElement.dataset.theme="dark";document.body.classList.add("embed")}
/* ---------- three setup ---------- */

const fill=new THREE.DirectionalLight(0xcfdcff,0.28);fill.position.set(-20,25,-18);scene.add(fill);

  pallet:M(0x9c7a4c), box:M(0xc9a36d), meat:M(0xb5414a), skin:M(0xe2b08f), skin2:M(0x9b6a4a), smock:M(0xf7f8f8), pants:M(0x3a4650), boot:M(0xf0f0f0)
};

/* ---------- label sprites ----------

const LABELS=[];
const ROOM_LABELS=/^(Warehouse 1|Debox room|In & Out|Burger Room|Washdown|Exit)$/;
const MAJOR_LABELS=/^(Manual Pack|Marel|Mandy)$/;
function drawLabel(L){
  const c=L.canvas,g=c.getContext("2d");g.clearRect(0,0,c.width,c.height);
  const txt=L.text.toUpperCase();

  else{const major=L.kind==="major";g.font=(major?"700 66px":"600 56px")+" Oswald, 'Arial Narrow', Arial";
    const w=Math.min(500,g.measureText(txt).width+(major?48:36));const x0=(512-w)/2,h=major?84:70,y0=(112-h)/2;
    g.fillStyle=major?"rgba(24,27,30,.9)":"rgba(34,38,42,.78)";g.beginPath();if(g.roundRect)g.roundRect(x0,y0,w,h,h/2);else g.rect(x0,y0,w,h);g.fill();
    if(major){g.fillStyle="#E0A030";g.fillRect(x0+h/2-6,y0+h-6,w-h+12,4)}
    g.fillStyle=major?"#EDEFF1":"#C9CFD3";g.textAlign="center";g.textBaseline="middle";g.fillText(txt,256,58)}

}
function label(text,x,y,z,scale=1,parent){
  const c=document.createElement("canvas");c.width=512;c.height=112;
  const t=new THREE.CanvasTexture(c);t.anisotropy=4;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthWrite:false,transparent:true}));
  const kind=ROOM_LABELS.test(text)?"room":MAJOR_LABELS.test(text)?"major":"minor";
  const L={text,canvas:c,tex:t,s,kind};LABELS.push(L);drawLabel(L);
  const k=kind==="minor"?0.85:1;s.scale.set(5.2*scale*k,1.14*scale*k,1);s.position.set(x,y,z);(parent||scene).add(s);return s;
}
document.fonts&&document.fonts.ready.then(()=>LABELS.forEach(drawLabel)); // redraw once the fonts have loaded

/* ---------- equipment ---------- */
function table(w,d,x,z,rotY=0,mat=mats.steel){
  const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rotY;scene.add(g);

  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([a,b])=>box(0.08,0.85,0.08,mats.steel,a*(w/2-0.15),0.42,b*(d/2-0.15),g));
  return g;
}
function scale(x,z,w=1.2,d=1){const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
  box(0.14,0.9,0.14,mats.steel,0,0.45,0,g);box(w,0.1,d,mats.steel,0,0.95,0,g);
  box(0.5,0.38,0.12,mats.darkSteel,0,1.3,-d/2+0.06,g);
  const scr=box(0.38,0.22,0.02,M(0x6fd2ff,{emissive:0x3aa9e0,emissiveIntensity:.7}),0,1.32,-d/2+0.125,g);
  return g}

// Variovac: local +x is the product flow direction
const vv={};
function variovac(id,len,w,x,z,rotY){

  box(len*0.22,0.9,w*1.02,mats.steel,len*0.12,1.33,0,g);  // sealing station
  const hood=box(len*0.22,0.25,w*1.06,mats.darkSteel,len*0.12,1.9,0,g);
  const roll=new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.42,w*0.9,20),mats.film);roll.rotation.x=Math.PI/2;roll.position.set(-len/2+0.6,1.35,0);g.add(roll);
  const roll2=new THREE.Mesh(new THREE.CylinderGeometry(0.34,0.34,w*0.9,20),mats.film);roll2.rotation.x=Math.PI/2;roll2.position.set(len*0.25,2.25,0);g.add(roll2);
  box(0.6,1.0,0.4,mats.darkSteel,len*0.32,1.2,w/2+0.25,g);  // HMI
  const hmi=box(0.44,0.3,0.03,M(0x6fd2ff,{emissive:0x3aa9e0,emissiveIntensity:.7}),len*0.32,1.45,w/2+0.46,g);
  box(0.08,1.4,0.08,mats.steel,len/2-0.3,1.6,-w/2+0.2,g); // beacon pole
  const beaconMat=new THREE.MeshStandardMaterial({color:0x1f9d55,emissive:0x1f9d55,emissiveIntensity:1});
  const beacon=new THREE.Mesh(new THREE.CylinderGeometry(0.17,0.17,0.32,16),beaconMat);beacon.position.set(len/2-0.3,2.45,-w/2+0.2);g.add(beacon);
  const glow=new THREE.PointLight(0x1f9d55,0.9,6);glow.position.copy(beacon.position);g.add(glow);
  // trays travelling along the chain
  const trays=[];for(let i=0;i<7;i++){const t=new THREE.Group();
    box(0.62,0.12,w*0.55,mats.film,0,0,0,t);box(0.5,0.1,w*0.42,mats.meat,0,0.03,0,t);
    t.position.set(-len/2+0.4+i*(len/7),1.0,0);g.add(t);trays.push(t)}
  vv[id]={g,len,w,beacon,beaconMat,glow,trays,hood};
}
/* ---------- layout from Walter's second sketch ----------
   Plan coordinates come straight from the drawing (pixels), 40 px = 1 unit. */
const PX=(px,py)=>[(px-750)/40,(py-1000)/40];
const OBST=[]; // rectangles people walk around: [x1,z1,x2,z2]
function solidPx(x1,y1,x2,y2){const a=PX(x1,y1),b=PX(x2,y2);OBST.push([a[0],a[1],b[0],b[1]]);return {x:(a[0]+b[0])/2,z:(a[1]+b[1])/2,w:b[0]-a[0],d:b[1]-a[1]}}
function blockPx(x1,y1,x2,y2,h,mat){const r=solidPx(x1,y1,x2,y2);box(r.w,h,r.d,mat,r.x,h/2,r.z);return r}
function tablePx(x1,y1,x2,y2){const r=solidPx(x1,y1,x2,y2);table(r.w,r.d,r.x,r.z);return r}
function scalePx(x1,y1,x2,y2){const r=solidPx(x1,y1,x2,y2);scale(r.x,r.z,r.w,r.d);return r}
function convPx(x1,y1,x2,y2){const r=solidPx(x1,y1,x2,y2);if(r.w>=r.d)conveyor(r.w,r.x,r.z,0);else conveyor(r.d,r.x,r.z,Math.PI/2);return r}
function floorPx(x1,y1,x2,y2,mat,y=0.01){const a=PX(x1,y1),b=PX(x2,y2);const m=new THREE.Mesh(new THREE.PlaneGeometry(b[0]-a[0],b[1]-a[1]),mat);m.rotation.x=-Math.PI/2;m.position.set((a[0]+b[0])/2,y,(a[1]+b[1])/2);m.receiveShadow=true;scene.add(m)}

// floors
// rooms we don't work in are kept as thin strips so the packaging floor gets the space
function floorU(x1,z1,x2,z2,mat,y=0.01){const m=new THREE.Mesh(new THREE.PlaneGeometry(x2-x1,z2-z1),mat);m.rotation.x=-Math.PI/2;m.position.set((x1+x2)/2,y,(z1+z2)/2);m.receiveShadow=true;scene.add(m)}
floorU(-18.75,-24,4,24,mats.floor,0);floorU(4,-12.5,18.5,24,mats.floor,0);

floorU(4,-24,10.9,-12.5,mats.burger);floorU(14,5.8,18.5,22.75,mats.burger); // debox room, burger room
floorPx(0,60,370,180,mats.burger);  // washdown
floorPx(0,1640,170,1960,M(0x7d878e)); // walled-off area, pushed into the corner to free up floor space

// walls (with door gaps)
const WALL_H=2.6;
function wallPx(x1,y1,x2,y2){const a=PX(x1,y1),b=PX(x2,y2);const t=0.15;const r=[Math.min(a[0],b[0])-t,Math.min(a[1],b[1])-t,Math.max(a[0],b[0])+t,Math.max(a[1],b[1])+t];
  OBST.push(r);box(r[2]-r[0],WALL_H,r[3]-r[1],mats.wall,(r[0]+r[2])/2,WALL_H/2,(r[1]+r[3])/2)}

  OBST.push(r);box(r[2]-r[0],WALL_H,r[3]-r[1],mats.wall,(r[0]+r[2])/2,WALL_H/2,(r[1]+r[3])/2)}

// big wall sign above the rebox table: REBOX / MANUAL PACK (painted on the Burger Room wall, facing the floor)
(function(){const c=document.createElement("canvas");c.width=1600;c.height=260;const t=new THREE.CanvasTexture(c);t.anisotropy=8;
  function draw(){const g=c.getContext("2d");g.clearRect(0,0,1600,260);
    g.fillStyle="#0F2A4A";g.fillRect(0,0,1600,260);
    g.fillStyle="#F2C21B";g.fillRect(0,0,1600,22);g.fillRect(0,238,1600,22);
    g.fillStyle="#FFFFFF";g.textAlign="center";g.textBaseline="middle";g.font="700 150px Oswald, 'Arial Narrow', Arial, sans-serif";
    g.fillText("REBOX / MANUAL PACK",800,136);t.needsUpdate=true}
  draw();document.fonts&&document.fonts.ready.then(draw);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(6.4,1.04),new THREE.MeshBasicMaterial({map:t}));
  m.rotation.y=-Math.PI/2;m.position.set(13.83,1.95,10.5);scene.add(m)})();
// same style of wall sign for the other areas: text, centre x/z on the wall face, which way it faces, width
function wallSign(text,x,z,rotY,w){const H=1.04,c=document.createElement("canvas");c.height=260;c.width=Math.round(260*w/H);const t=new THREE.CanvasTexture(c);t.anisotropy=8;
  function draw(){const g=c.getContext("2d"),W=c.width;g.clearRect(0,0,W,260);g.fillStyle="#0F2A4A";g.fillRect(0,0,W,260);
    g.fillStyle="#F2C21B";g.fillRect(0,0,W,22);g.fillRect(0,238,W,22);g.fillStyle="#FFFFFF";g.textAlign="center";g.textBaseline="middle";
    let fs=150;g.font=`700 ${fs}px Oswald, 'Arial Narrow', Arial, sans-serif`;while(g.measureText(text).width>W-80&&fs>60){fs-=6;g.font=`700 ${fs}px Oswald, 'Arial Narrow', Arial, sans-serif`}
    g.fillText(text,W/2,136);t.needsUpdate=true}

wallSign("CHICKEN / TURKEY",-14.33,18.6,Math.PI/2,4.4);   // walled-off section wall, above the chicken table
wallSign("DEBOX ROOM",7.45,-12.33,0,4.6);              // Debox Room wall facing the Burger Room side

function curbU(x1,z1,x2,z2){const t=0.15;const r=[Math.min(x1,x2)-t,Math.min(z1,z2)-t,Math.max(x1,x2)+t,Math.max(z1,z2)+t];OBST.push(r);box(r[2]-r[0],0.5,r[3]-r[1],mats.wall,(r[0]+r[2])/2,0.25,(r[1]+r[3])/2)}
wallPx(15,180,150,180);wallPx(230,180,365,180);wallPx(370,60,370,180); // Washdown area + door

box(0.6,0.35,0.12,exitMat,PX(170,1885)[0]+0.4,2.4,PX(170,1885)[1]);box(0.12,0.35,0.6,exitMat,13.75,2.4,21.75);

/* ---------- walking grid: people find their own way around equipment ---------- */
const G={x0:-19,z0:-24,cell:0.5,nx:76,nz:98};G.blk=new Uint8Array(G.nx*G.nz);
function buildGrid(){G.blk.fill(0);const pad=0.3;
  OBST.forEach(r=>{const x1=Math.floor((r[0]-pad-G.x0)/G.cell),x2=Math.floor((r[2]+pad-G.x0)/G.cell),z1=Math.floor((r[1]-pad-G.z0)/G.cell),z2=Math.floor((r[3]+pad-G.z0)/G.cell);
    for(let i=Math.max(0,x1);i<=Math.min(G.nx-1,x2);i++)for(let j=Math.max(0,z1);j<=Math.min(G.nz-1,z2);j++)G.blk[j*G.nx+i]=1});
  // outside the building edge
  for(let i=0;i<G.nx;i++)for(let j=0;j<G.nz;j++){const x=G.x0+(i+0.5)*G.cell,z=G.z0+(j+0.5)*G.cell;
    const inMain=x>-18.5&&x<18.4&&z>-23.4&&z<23.9;if(!inMain)G.blk[j*G.nx+i]=1}
  // the walled-off area is not walkable
  for(let i=0;i<G.nx;i++)for(let j=0;j<G.nz;j++){const x=G.x0+(i+0.5)*G.cell,z=G.z0+(j+0.5)*G.cell;if(x<-14.6&&z>15.9)G.blk[j*G.nx+i]=1}
}
const cellOf=(x,z)=>[Math.max(0,Math.min(G.nx-1,Math.floor((x-G.x0)/G.cell))),Math.max(0,Math.min(G.nz-1,Math.floor((z-G.z0)/G.cell)))];
const ctr=(i,j)=>[G.x0+(i+0.5)*G.cell,G.z0+(j+0.5)*G.cell];
function freeNear(i,j){if(!G.blk[j*G.nx+i])return [i,j];for(let r=1;r<8;r++)for(let di=-r;di<=r;di++)for(let dj=-r;dj<=r;dj++){const a=i+di,b=j+dj;if(a>=0&&b>=0&&a<G.nx&&b<G.nz&&!G.blk[b*G.nx+a])return [a,b]}return [i,j]}
function los(a,b){const d=Math.hypot(b[0]-a[0],b[1]-a[1]);const n=Math.ceil(d/(G.cell*0.5));for(let k=0;k<=n;k++){const x=a[0]+(b[0]-a[0])*k/n,z=a[1]+(b[1]-a[1])*k/n;const c=cellOf(x,z);if(G.blk[c[1]*G.nx+c[0]])return false}return true}
function findPath(from,to){
  const s=freeNear(...cellOf(from[0],from[1])),e=freeNear(...cellOf(to[0],to[1]));
  const N=G.nx*G.nz,gs=new Float32Array(N).fill(1e9),came=new Int32Array(N).fill(-1),closed=new Uint8Array(N);
  const si=s[1]*G.nx+s[0],ei=e[1]*G.nx+e[0];gs[si]=0;const open=[[0,si]];
  const h=(i)=>{const x=i%G.nx,z=(i/G.nx)|0;return Math.hypot(x-e[0],z-e[1])};
  let found=false,guard=0;
  while(open.length&&guard++<20000){
    let bi=0;for(let k=1;k<open.length;k++)if(open[k][0]<open[bi][0])bi=k;
    const cur=open.splice(bi,1)[0][1];if(cur===ei){found=true;break}if(closed[cur])continue;closed[cur]=1;
    const cx=cur%G.nx,cz=(cur/G.nx)|0;
    for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++){if(!dx&&!dz)continue;const nx=cx+dx,nz=cz+dz;
      if(nx<0||nz<0||nx>=G.nx||nz>=G.nz)continue;const ni=nz*G.nx+nx;if(G.blk[ni]||closed[ni])continue;
      if(dx&&dz&&(G.blk[cz*G.nx+nx]||G.blk[nz*G.nx+cx]))continue;
      const g=gs[cur]+(dx&&dz?1.414:1);if(g<gs[ni]){gs[ni]=g;came[ni]=cur;open.push([g+h(ni),ni])}}
  }
  if(!found)return [to.slice()];
  const cells=[];for(let c=ei;c!==-1;c=came[c])cells.push(ctr(c%G.nx,(c/G.nx)|0));cells.reverse();
  // smooth: keep only turning points that are needed
  const pts=[from.slice()];let anchor=from.slice();
  for(let k=1;k<cells.length;k++){if(!los(anchor,cells[k])){anchor=cells[k-1];pts.push(anchor)}}
  pts.push(to.slice());pts.shift();return pts;
}

function toneOf(v){
  if(!v)return "nowork";
  if(v.state==="run")return "run";
  if(v.state==="break")return "brk";

/* ---------- side machines (Fajita, Cutlet, Slicer) + Marel cutting + crew on shift ----------
   Read-only from the CI Tracker's Crew Board (tracker/dayLog) — the same entries the tracker's reports use.
   Nothing is entered here, so this screen and the reports always show the same numbers. */
const SHIFT_END="16:30";
const SIDE=[
  {key:"fajita",name:"Fajita machine",maxPeople:2,defPeople:2,rect:[-13.9,7.33,-11.9,8.58]},
  {key:"cutlet",name:"Cutlet machine",maxPeople:1,defPeople:1,rect:[-9.08,7.45,-7.33,8.45]},
  {key:"marel",name:"Marel",marel:true,rect:[-8.75,-7.5,-2.25,1.0]}
];
let floorLog={days:{}};
let fsCol=null;                         // set once signed in
const nowHM=()=>{const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
const dateKey=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function today(log=floorLog){const k=dateKey();return log.days[k]||{crew:null,runs:[]}}
/* Converts the tracker's day log into the shape this screen draws from.
   Crew Board side machines → fajita / cutlet / slicer runs (packaging + trimmer helpers), MAREL start/finish → marel run,
   lead hand / yield operator "on line" entries → lead / yield runs, crew changes → crewLog (latest number = crew). */
const SIDE_KEY={Fajita:"fajita",Cutlet:"cutlet",Slicer:"slicer"},ROLE_KEY={"Lead Hand":"lead","Yield Operator":"yield"};
function floorFromDayLog(dl){const days={};
  Object.keys(dl||{}).forEach(k=>{const d=dl[k]||{},runs=[];
    (d.side||[]).forEach(x=>{const m=SIDE_KEY[x.machine];if(m)runs.push({m,on:x.start,off:x.end||null,people:x.pack||0,trim:x.trim||0})});
    if(d.marelStart||d.marelEnd)runs.push({m:"marel",on:d.marelStart||d.marelEnd,off:d.marelEnd||null});
    (d.offline||[]).forEach(o=>{const m=ROLE_KEY[o.role];if(m)runs.push({m,on:o.start,off:o.end||null,where:o.where})});
    const cl=(Array.isArray(d.crewLog)&&d.crewLog.length)?d.crewLog.slice().sort((a,b)=>String(a.at).localeCompare(String(b.at))):(d.crew!=null?[{at:d.crewAt||"08:00",n:d.crew}]:[]);
    days[k]={crew:cl.length?cl[cl.length-1].n:null,crewLog:cl,roles:d.roles||{},runs}});
  return {days}}
function crewNote(){const cl=today().crewLog||[];if(cl.length<2)return "";const p=cl[cl.length-2],l=cl[cl.length-1];return "was "+p.n+" until "+t12(l.at)+(l.reason?" ("+String(l.reason).toLowerCase()+")":"")}
function roleOff(key){const r=today().roles||{};return r[key==="lead"?"Lead Hand":"Yield Operator"]==="off"}
// the run that's still open for a machine — today only, same as the tracker (entries left on from an earlier day are closed there)
function openRun(key,log=floorLog){const ks=[dateKey()];
  for(const k of ks){const r=((log.days[k]||{}).runs||[]).slice().reverse().find(x=>x.m===key&&!x.off);if(r)return {r,day:k}}return null}
function lastRunToday(key){return (today().runs||[]).filter(x=>x.m===key&&x.off).slice(-1)[0]||null}
function sideState(key){const o=openRun(key);return o?{on:true,since:o.r.on,people:o.r.people||0,trim:o.r.trim||0,where:o.r.where||"",day:o.day}:{on:false,last:lastRunToday(key)}}

async function saveLog(mutate){
  if(!fsCol){mutate(floorLog);afterLogChange();return true} // preview: keep it on this page
  return false; // live: view-only — crew, side machines, MAREL and lead hand / yield are entered on the CI Tracker's Crew Board
  try{
    const ref=fsCol.doc("floorLog");
    await firebase.firestore().runTransaction(async tx=>{
      const snap=await tx.get(ref);let d={days:{}};try{if(snap.exists&&snap.data().data)d=JSON.parse(snap.data().data)}catch(e){}
      if(!d.days)d.days={};mutate(d);
      const keep=Object.keys(d.days).sort().slice(-120);const pruned={};keep.forEach(k=>pruned[k]=d.days[k]);d.days=pruned; // about 4 months of history
      tx.set(ref,{data:JSON.stringify(d),updatedAt:Date.now()});
    });
    return true;

  if(d&&!d.end&&d.status==="WAITING"&&isMarelReason(d.reason))out.push({m:m.name,reason:(typeof REASON_RENAMES!=="undefined"&&REASON_RENAMES[d.reason])||d.reason,mins:minsSince(d.start)||0})});return out}

  MACHINES.forEach(m=>{const live=liveRuns[m.name];if(!live||(live.date&&live.date!==td))return;
    (live.downtimeSegments||[]).forEach(d=>{if(d.status==="WAITING"&&isMarelReason(d.reason))min+=d.end?hmDiff(d.start,d.end):(minsSince(d.start)||0)})});return min}

const MACHINES=[{key:"v1",name:"Variovac 1"},{key:"v2",name:"Variovac 2"},{key:"v3",name:"Variovac 3"},{key:"mp",name:"Manual Pack",sub:"Rebox table"}];
const OTHER=[{key:"marel",name:"Marel",def:2},{key:"trimmer",name:"Trim table (main)",def:5},{key:"trim",name:"Trim table",def:1},{key:"trim3",name:"Trim table 3",def:0},
  {key:"bs1",name:"Band saw 1",def:1},{key:"bs2",name:"Band saw 2",def:1},{key:"dicer",name:"Dicer / Grinder",def:1}];
let other={};OTHER.forEach(o=>other[o.key]=o.def);
try{const saved=JSON.parse(localStorage.getItem("floor_other_stations")||"null");if(saved)OTHER.forEach(o=>{if(typeof saved[o.key]==="number")other[o.key]=saved[o.key]})}catch(e){}
function saveOther(){try{localStorage.setItem("floor_other_stations",JSON.stringify(other))}catch(e){}}

let liveRuns={},records=[];
const view={}; // per machine key: {state, staff, product, reason, category, since, live}
function readMachine(name){
  const live=liveRuns[name];
  if(!live)return {state:"none",staff:0,label:"Not started"};
  const segs=live.segments||[],dts=live.downtimeSegments||[];
  const lastSeg=segs[segs.length-1];
  const openDt=[...dts].reverse().find(d=>!d.end);
  const v={product:live.product||"",since:live.startedAt||"",live};
  if(live.status==="RUNNING"){
    return Object.assign(v,{state:"run",staff:lastSeg?lastSeg.employees||0:0,label:"Running",since:lastSeg?lastSeg.start:v.since});
  }
  const crew=live.pendingEmployees!=null?live.pendingEmployees:(lastSeg?lastSeg.employees||0:0);
  const st=openDt?openDt.status:"WAITING";
  Object.assign(v,{reason:openDt?(openDt.reason||""):"",category:openDt?(openDt.reasonCategory||""):"",since:openDt?openDt.start:v.since,crew});
  if(st==="NO_WORK")return Object.assign(v,{state:"nowork",staff:0,label:"No work"});
  if(st==="BREAK")return Object.assign(v,{state:"break",staff:0,label:"Break"});
  const lab=st==="CHANGEOVER"?"Changeover":st==="PLANNED"?"Planned stop":"Waiting";
  return Object.assign(v,{state:"down",staff:crew,label:lab});
}
function wanted(){
  const n={};
  MACHINES.forEach(m=>{view[m.key]=readMachine(m.name);n[m.key]=Math.min(8,view[m.key].staff||0)});
  OTHER.forEach(o=>n[o.key]=Math.min(SPOTS[o.key].length,other[o.key]));
  // the slicer is staffed only when it's switched on in the tracker's Crew Board
  {const st=sideState("slicer");n.slicer=st.on?Math.min(SPOTS.slicer.length,(st.people||0)+(st.trim||0)):0}
  // maintenance comes out for a Machine / Equipment problem
  const broken=MACHINES.find(m=>m.key!=="mp"&&view[m.key].state==="down"&&/machine|equipment/i.test(view[m.key].category||""));
  n.maint=broken?1:0;maintFor=broken?broken.key:null;
  // Fajita / Cutlet crews come from the on/off panel
  ["fajita","cutlet"].forEach(k=>{const st=sideState(k);n[k]=st.on?Math.min(SPOTS[k].length,(st.people||0)+(st.trim||0)):0});
  if(trimBreak())TRIM_KEYS.forEach(k=>n[k]=0);   // trimmers' break: every trim table empties
  return n;
}
/* ---------- trimmers' breaks: 9:00-9:30 and 12:00-12:30 every day (this device's clock) ----------
   They walk out through the exit by Variovac 1 / the rebox table and come back in the same way. */
const TRIM_KEYS=["trimmer","trim","trim3"];
const BREAK_EXIT=[13.3,21.75],BREAK_OUT=[14.35,21.75];
const TRIM_BREAKS=[[9*60,9*60+30],[12*60,12*60+30]];
function nowMins(){const d=new Date();return d.getHours()*60+d.getMinutes()+d.getSeconds()/60}
function trimBreak(){const m=nowMins();return TRIM_BREAKS.some(([a,b])=>m>=a&&m<b)}
function trimReturning(){const m=nowMins();return TRIM_BREAKS.some(([a,b])=>m>=b&&m<b+15)}
let maintFor=null;
const crews={};
function spotFor(key,i){if(key==="maint"&&maintFor)return MAINT_SPOT[maintFor];return SPOTS[key][i]}
function roleFor(key,i){
  if((key==="v1"||key==="v2")&&i===2)return "centre";
  if(key==="v3"&&i===1)return "boxer";
  if(key==="marel"&&i===1)return "tubs";
  return null;
}
function assign(w,key,i,fromDoor){
  const sp=spotFor(key,i);
  w.key=key;w.slot=i;w.role=roleFor(key,i);w.spot=[sp[0],sp[1]];w.look=[sp[2],sp[3]];
  w.leaving=false;w.carry.visible=false;w.drop=false;w.onDrop=null;w.state="walk";
  w.path=findPath(fromDoor?DOOR:[w.g.position.x,w.g.position.z],[sp[0],sp[1]]);
}
// move people to match the floor: surplus people are reused for open spots before anyone new walks in
function syncFloor(){
  const n=wanted();const pool=[],leave=[],brk=[];const onBrk=trimBreak();
  Object.keys(n).forEach(k=>{const list=crews[k]||(crews[k]=[]);while(list.length>n[k])(k==="maint"?leave:(onBrk&&TRIM_KEYS.includes(k)?brk:pool)).push(list.pop())});
  if(maintFor&&crews.maint&&crews.maint[0]){const w=crews.maint[0];const sp=MAINT_SPOT[maintFor];if(w.spot[0]!==sp[0]||w.spot[1]!==sp[1])assign(w,"maint",0,false)}
  Object.keys(n).forEach(k=>{const list=crews[k];
    while(list.length<n[k]){const i=list.length;let w;
      if(k!=="maint"&&pool.length){
        const sp=spotFor(k,i);pool.sort((a,b)=>Math.hypot(a.g.position.x-sp[0],a.g.position.z-sp[1])-Math.hypot(b.g.position.x-sp[0],b.g.position.z-sp[1]));
        w=pool.shift();assign(w,k,i,false);
      }else if(TRIM_KEYS.includes(k)&&trimReturning()){w=newWorker(BREAK_OUT[0],BREAK_OUT[1]);assign(w,k,i,false)} // back from break through the exit
      else{w=newWorker(DOOR[0],DOOR[1]);assign(w,k,i,true)}
      list.push(w)}});
  pool.concat(leave).forEach(w=>{w.path=findPath([w.g.position.x,w.g.position.z],DOOR).concat([OUT]);w.leaving=true;w.key=null;w.carry.visible=false;w.drop=false;w.state="walk"});
  brk.forEach(w=>{w.path=findPath([w.g.position.x,w.g.position.z],BREAK_EXIT).concat([BREAK_OUT]);w.leaving=true;w.key=null;w.carry.visible=false;w.drop=false;w.state="walk"});
  placeMandy();
}

/* ---------- skids: one at the end of the centre conveyor, one beside Variovac 3 ---------- */
function makeSkid(x,z,start,name){const k={g:new THREE.Group(),count:0,boxes:[],x,z};k.g.position.set(x,0,z);scene.add(k.g);
  box(1.6,0.18,1.3,mats.pallet,0,0.09,0,k.g);OBST.push([x-0.8,z-0.65,x+0.8,z+0.65]);
  for(let i=0;i<start;i++)addSkidBox(k);if(name)label(name,x,2.6,z,.65);return k}
function addSkidBox(k){if(k.count>=12)return;const i=k.count++,layer=Math.floor(i/4),q=i%4;
  k.boxes.push(box(0.7,0.32,0.55,mats.box,(q%2?0.37:-0.37),0.34+layer*0.33,(q<2?-0.3:0.3),k.g))}
function clearSkid(k){k.boxes.forEach(b=>k.g.remove(b));k.boxes=[];k.count=0}
const skid=makeSkid(8.4,17.6,4,"Skid & labels");
const skid3=makeSkid(7.9,-2.0,3,null);
buildGrid();
const beltBoxes=[];for(let i=0;i<4;i++){const b=box(0.42,0.3,0.5,mats.box,6.0,1.02,0);beltBoxes.push({b,from:i<2?"v2":"v1",off:(i%2)*2.1})}

/* ---------- worker behaviour ---------- */
function faceTo(w,x,z,dt){const target=Math.atan2(x-w.g.position.x,z-w.g.position.z);let d=target-w.g.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));w.g.rotation.y+=d*Math.min(1,dt*8)}
// walk to a place and come back; carrying a box on the way out if asked
function trip(w,dest,carry,onDrop){const here=[w.g.position.x,w.g.position.z];
  const out=findPath(here,dest),back=findPath(dest,w.spot);
  w.state="walk";w.path=out.concat(back);w.dropAt=back.length;w.drop=!!carry;w.carry.visible=!!carry;w.onDrop=onDrop||null}
function isBusy(w){
  const k=w.key;if(!k)return false;
  if(view[k])return view[k].state==="run";
  if(k==="maint")return !!maintFor;
  return true;
}
// Warehouse 1, the In & Out passage and the Burger Room (grey floor): safety vest instead of the white frock
function inYard(x,z){return (x>10.9&&x<18.5&&z>-24&&z<-4.9)||(x>14&&x<18.5&&z>-4.9&&z<20.6)}
function dressFor(w){if(!w.vest)return;const v=inYard(w.g.position.x,w.g.position.z);if(v===w.vested)return;w.vested=v;
  const m=v?WK.shirt:WK.frock;w.body.material=m;w.shoulders.material=m;w.sleeves.forEach(s=>s.material=m);w.apron.visible=!v;w.vest.visible=v}
function updateWorker(w,dt,t){dressFor(w);
  const p=w.g.position,k=Math.min(1,dt*9),L=(o,ax,tg,kk)=>{o.rotation[ax]+=(tg-o.rotation[ax])*(kk||k)};
  const legs=w.legs,knees=w.knees||[],arms=w.arms,elb=w.elbows||[],tor=w.torso,hd=w.headG;
  if(w.state==="walk"){
    const tgt=w.path[0];
    if(!tgt){w.state=w.leaving?"gone":"work";return}
    const dx=tgt[0]-p.x,dz=tgt[1]-p.z,d=Math.hypot(dx,dz);
    if(d<0.08){w.path.shift();
      if(w.events)w.events.forEach(ev=>{if(!ev.done&&w.path.length===ev.at){ev.done=true;ev.fn()}});
      if(w.drop&&w.path.length===w.dropAt){w.carry.visible=false;w.drop=false;if(w.onDrop){const f=w.onDrop;w.onDrop=null;f()}}
      return}
    w.v=(w.v||0)+(w.speed-(w.v||0))*Math.min(1,dt*2.5);                     // ease into walking speed
    const step=Math.min(d,w.v*dt);p.x+=dx/d*step;p.z+=dz/d*step;faceTo(w,tgt[0],tgt[1],dt);
    w.phase+=dt*w.v*4.3;const s=Math.sin(w.phase),c=Math.cos(w.phase),amp=Math.min(1,w.v/1.2);
    L(legs[0],"x",s*0.55*amp,1);L(legs[1],"x",-s*0.55*amp,1);
    if(knees[0]){L(knees[0],"x",0.08+Math.max(0,-c)*0.85*amp,1);L(knees[1],"x",0.08+Math.max(0,c)*0.85*amp,1)}
    const busyArms=w.carry.visible||w.jack;
    if(busyArms){const ax=w.jack?-1.05:-1.15,ex=w.jack?-0.35:-0.65;arms.forEach(a=>{L(a,"x",ax);L(a,"z",0)});elb.forEach(e=>L(e,"x",ex))}
    else{L(arms[0],"x",-s*0.5*amp);L(arms[1],"x",s*0.5*amp);arms.forEach(a=>L(a,"z",0));elb.forEach((e,i)=>L(e,"x",-0.3-0.25*Math.max(0,i?-s:s)*amp))}
    if(tor){L(tor,"x",(w.jack?0.14:0.06)*amp);L(tor,"y",s*0.09*amp);L(tor,"z",0);tor.position.y=0.9}
    if(hd){L(hd,"x",0.04);L(hd,"y",-s*0.06*amp)}
    p.y=Math.abs(s)*0.045*amp;return;
  }
  w.v=0;p.y*=0.8;
  faceTo(w,w.look[0],w.look[1],dt);
  const busy=isBusy(w);
  // breathing and a little weight shift while standing
  const br=Math.sin(t*1.7+w.id*1.3);
  if(tor){tor.position.y=0.9+br*0.007;L(tor,"z",Math.sin(t*0.45+w.id)*0.025,0.05)}
  legs.forEach((l,i)=>L(l,"x",i===((w.id+Math.floor(t/7))%2)?0.04:-0.02));knees.forEach((n,i)=>L(n,"x",i===((w.id+Math.floor(t/7))%2)?0.1:0.03));
  if(busy){
    const kk=w.key||"",task=/^(trimmer|trim|trim3)$/.test(kk)?"cut":kk==="marel"?"load":/^(fajita|cutlet|slicer|bs1|bs2|dicer)$/.test(kk)?"feed":"pack";
    if(task==="cut"){w.phase+=dt*6.5;const st=Math.sin(w.phase*1.3);                 // knife hand saws, other hand holds the meat
      L(arms[1],"x",-0.85+st*0.22);L(arms[1],"z",-0.12);L(elb[1],"x",-1.05+Math.sin(w.phase*1.3+1.1)*0.35);
      L(arms[0],"x",-0.75);L(arms[0],"z",0.18);L(elb[0],"x",-0.95+Math.sin(w.phase*0.4)*0.05);
      L(tor,"x",0.26+Math.sin(w.phase*0.3)*0.03);L(tor,"y",st*0.04);L(hd,"x",0.38);L(hd,"y",Math.sin(w.phase*0.2)*0.12)}
    else if(task==="load"){w.phase+=dt*3.2;const st=Math.sin(w.phase);                 // big reach to the belt and back
      arms.forEach((a,i)=>{L(a,"x",-1.15+st*0.4);L(a,"z",i?-0.08:0.08)});elb.forEach(e=>L(e,"x",-0.35-Math.max(0,-st)*0.5));
      L(tor,"x",0.18+Math.max(0,st)*0.12);L(tor,"y",0);L(hd,"x",0.3);L(hd,"y",0)}
    else if(task==="feed"){w.phase+=dt*4;const st=Math.sin(w.phase);                  // push product into the machine
      arms.forEach(a=>{L(a,"x",-1.0+st*0.3);L(a,"z",0)});elb.forEach(e=>L(e,"x",-0.65-st*0.3));
      L(tor,"x",0.15+st*0.06);L(tor,"y",0);L(hd,"x",0.3);L(hd,"y",0)}
    else{w.phase+=dt*(5.2+(w.id%3)*0.5);const st=Math.sin(w.phase),st2=Math.sin(w.phase*0.5);   // grab a tray, place it: hands alternate
      L(arms[0],"x",-0.95+st*0.38);L(arms[1],"x",-0.95-st*0.38);arms.forEach((a,i)=>L(a,"z",(i?-1:1)*(0.06+Math.max(0,st2)*0.12)));
      L(elb[0],"x",-0.7+Math.max(0,-st)*0.4);L(elb[1],"x",-0.7+Math.max(0,st)*0.4);
      L(tor,"x",0.17+Math.abs(st2)*0.05);L(tor,"y",st2*0.12);L(hd,"x",0.32);L(hd,"y",st2*0.18)}
  }else{
    // idle: a few natural poses, glance around now and then, the odd stretch
    w.lookT-=dt;if(w.lookT<=0){w.lookT=2.5+Math.random()*4;w.lookYaw=Math.random()<0.35?0:(Math.random()-0.5)*1.4}
    w.stretchT-=dt;if(w.stretchT<=0&&!w.stretching){w.stretching=2.6;w.stretchT=35+Math.random()*50}
    L(hd,"y",w.lookYaw,dt*3);L(hd,"x",0.02,dt*3);L(tor,"y",w.lookYaw*0.25,dt*2);
    if(w.stretching>0){w.stretching-=dt;arms.forEach((a,i)=>{L(a,"x",-2.9,dt*4);L(a,"z",(i?-1:1)*0.2,dt*4)});elb.forEach(e=>L(e,"x",-0.25,dt*4));L(tor,"x",-0.1,dt*3)}
    else if(w.idleType===0){arms.forEach((a,i)=>{L(a,"x",-0.55,dt*4);L(a,"z",(i?-1:1)*0.42,dt*4)});elb.forEach(e=>L(e,"x",-1.75,dt*4));L(tor,"x",-0.02,dt*3)}  // arms crossed
    else if(w.idleType===1){arms.forEach((a,i)=>{L(a,"x",0.15,dt*4);L(a,"z",(i?1:-1)*0.5,dt*4)});elb.forEach(e=>L(e,"x",-1.3,dt*4));L(tor,"x",0,dt*3)}       // hands on hips
    else{arms.forEach((a,i)=>{L(a,"x",Math.sin(t*0.8+w.id+i)*0.06,dt*4);L(a,"z",(i?-1:1)*0.05,dt*4)});elb.forEach(e=>L(e,"x",-0.2,dt*4));L(tor,"x",0.03,dt*3)} // relaxed
  }
  w.timer-=dt;if(w.timer>0)return;
  w.timer=6+Math.random()*8;
  if(!busy)return;
  if(w.role==="boxer"){ // Variovac 3 boxes go on its skid
    if(skid3.count>=12)return; // full: waits for the pallet jack
    trip(w,[skid3.x-1.0,skid3.z],true,()=>addSkidBox(skid3));
  }else if(w.role==="centre"){
    if(skid.count>=12||Math.random()<0.25)trip(w,[11.8,4.6],false);          // labels from the Manual Pack scale
    else{trip(w,[skid.x-1.0,skid.z],true,()=>addSkidBox(skid));w.timer=3+Math.random()*3}
  }else if(w.role==="jack"){ // takes a full skid to Warehouse 1 on the pallet jack, brings an empty one back
    const k=skid.count>=8?skid:skid3.count>=8?skid3:null;if(!k){w.timer=3;return}
    const here=[w.g.position.x,w.g.position.z],at=k===skid?[k.x,k.z-1.35]:[k.x,k.z+1.35],drop=[12.1,-7.4];
    const a=findPath(here,at),b=findPath(at,drop),c=findPath(drop,w.spot);
    w.state="walk";w.path=a.concat(b,c);w.carry.visible=false;w.drop=false;
    w.events=[{at:b.length+c.length,fn:()=>{clearSkid(k);w.jackLoad.visible=true}},{at:c.length,fn:()=>{w.jackLoad.visible=false;w.timer=4}}];
  }else if(w.role==="rack"){ // brings a loaded meat rack out of the Debox room to the trim table, returns it empty
    const here=[w.g.position.x,w.g.position.z],drop=[-1.3,-13.6];
    const a=findPath(here,drop),b=findPath(drop,w.spot);
    w.state="walk";w.path=a.concat(b);w.carry.visible=false;w.drop=false;w.rackMeat.visible=true;
    w.events=[{at:b.length,fn:()=>{w.rackMeat.visible=false}},{at:0,fn:()=>{w.timer=8;setTimeout(()=>{w.rackMeat.visible=true},5000)}}];
    w.timer=18+Math.random()*8;
  }else if(w.role==="tubs"){ // tubs from the meat-out table to a running Variovac
    const dest=["v1","v2","v3"].filter(k=>view[k]&&view[k].state==="run");if(!dest.length)return;
    const k=dest[Math.floor(Math.random()*dest.length)];
    trip(w,k==="v1"?[-6.2,16.8]:k==="v2"?[-6.2,6.2]:[4.0,-11.2],true);
  }
}

/* ---------- machine visuals ---------- */
function updateMachineVis(key,dt,t){
  const v=vv[key];if(!v)return;const vw=view[key];const st=vw?vw.state:"none";const tone=toneOf(vw);const c=TONE[tone];
  v.beaconMat.color.setHex(c);v.beaconMat.emissive.setHex(c);v.glow.color.setHex(c);v.floorGlow.color.setHex(c);
  const pulse=st==="down"?(0.55+0.45*Math.sin(t*5)):st==="run"?1:st==="break"?0.8:0.2;
  v.beaconMat.emissiveIntensity=st==="down"?(Math.sin(t*6)>0?1.4:0.15):pulse;v.glow.intensity=(st==="none"||st==="nowork")?0:pulse*0.6;
  const al=isAlarm(vw);
  let op=st==="run"?0.42:st==="down"?(al?0.3+0.7*(0.5+0.5*Math.sin(t*9)):0.25+0.5*(0.5+0.5*Math.sin(t*4))):st==="break"?0.4:0.1;
  if(al){v.beaconMat.emissiveIntensity=Math.sin(t*12)>0?1.8:0.1;v.glow.intensity=Math.sin(t*12)>0?1.4:0}
  const h=highlight[key];if(h){const age=t-h;if(age<2.4)op=Math.max(op,0.95*(0.5+0.5*Math.cos(age*8)));else delete highlight[key]}
  v.floorGlow.opacity=op;
  if(st==="run"){const sp=0.55+vw.staff*0.12;v.trays.forEach(tr=>{tr.position.x+=sp*dt;if(tr.position.x>v.len/2-0.3)tr.position.x-=v.len-0.6})}
}
function marelStopped(){return MACHINES.some(m=>view[m.key]&&view[m.key].state==="down"&&/^MAREL - Switching Product/i.test(view[m.key].reason||""))}

/* ---------- cards ---------- */
const cardsEl=document.getElementById("cards");
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function localDate(d=new Date()){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function t12(hhmm){if(!hhmm)return"";const [h,m]=hhmm.split(":").map(Number);return ((h%12)||12)+":"+String(m).padStart(2,"0")+(h<12?" am":" pm")}
function todayPLH(name){
  const today=localDate();let lbs=0,gh=0,runs=0;
  records.forEach(r=>{if(r.date===today&&r.plh&&(!name||r.machine===name)&&r.plh.grossLaborHours>0){lbs+=r.plh.weightLbs||0;gh+=r.plh.grossLaborHours;runs++}});
  return {lbs,gh,runs,plh:gh>0?lbs/gh:null};
}
const fmt=n=>Math.round(n).toLocaleString("en-CA");
const PERSON='<svg viewBox="0 0 12 16" aria-hidden="true"><circle cx="6" cy="3.6" r="2.9"/><path d="M1 15.5V10a5 5 0 0 1 10 0v5.5z"/></svg>';
function people(n){n=Math.max(0,n||0);return n?`<span class="people" aria-label="${n} staff">${PERSON.repeat(Math.min(n,8))}${n>8?"+":""}</span>`:""}

   The functions between the two "copied" markers are copied word-for-word from CI Tracker v103 (index.html),
   so every total here is computed exactly the way the tracker's Dashboard computes it. Do not edit them here;
   if the tracker's calculation changes, copy the new version across. */
/* ---- copied from CI Tracker v103: start ---- */
const REASON_RENAMES = {
  'Waiting for MAREL Cut Meat':'MAREL - Meat Being Cut, Not Ready Yet',
  'MAREL Switching Product':'MAREL - Switching Product',
  'MAREL Cutting Chicken Muscle':'MAREL - Meat Ready, but Cutting Chicken Muscle for Variovac 3',
  'Meat Ready but MAREL Cutting for Variovac 1':'MAREL - Meat Ready, but Cutting for Variovac 1',
  'Meat Ready but MAREL Cutting for Variovac 2':'MAREL - Meat Ready, but Cutting for Variovac 2',
  'MAREL Cutting Meat for Variovac 1':'MAREL - Meat Ready, but Cutting for Variovac 1',
  'MAREL Cutting Meat for Variovac 2':'MAREL - Meat Ready, but Cutting for Variovac 2',
  'MAREL Waiting for Trimmed Meat':'MAREL - Waiting for Trimmed Meat',
  'Waiting for Chicken Muscle':'Waiting for Chicken Muscle (Trimmer Cutting by Hand)',
  'Waiting for Chicken Diced':'Waiting for Diced Chicken',
  'Waiting for Band Saw Cut Meat for SLICER':'Waiting for Band Saw Cut Meat (for Slicer)',
  'Waiting for Tenderloin BYPRODUCT':'Waiting for Tenderloin Byproduct',
  'Waiting for BYPRODUCT':'Waiting for Byproduct',
  // v97: MAREL wording — speed vs. priority made explicit
  'MAREL - Waiting for It to Cut Meat':'MAREL - Meat Being Cut, Not Ready Yet',
  'MAREL - Cutting Chicken Muscle':'MAREL - Meat Ready, but Cutting Chicken Muscle for Variovac 3'
};
function effectiveReasonLabel(r){
  if(r.reason && /other/i.test(r.reason) && r.notes && r.notes.trim()){ return r.notes.trim(); }
  return REASON_RENAMES[r.reason] || r.reason;
}
function toMin(t){ if(!t) return null; const [h,m]=t.split(':').map(Number); return h*60+m; }
function fmtDur(min){ min=Math.round(min); const h=Math.floor(min/60), m=min%60; return h>0? `${h}h ${m}m` : `${m}m`; }
function machineTotals(recs, machine){
  const t = {RUNNING:0,CHANGEOVER:0,WAITING:0,NO_WORK:0,BREAK:0,PLANNED:0, upstream:0, internal:0};
  recs.filter(r=>r.machine===machine).forEach(r=>{
    t[r.status]=(t[r.status]||0)+r.durationMin;
    if(r.status==='WAITING'){ if(r.classification==='upstream') t.upstream+=r.durationMin; else t.internal+=r.durationMin; }
  });
  return t;
}
function efficiencyPct(mt){
  const scheduled = (mt.RUNNING||0)+(mt.WAITING||0)+(mt.CHANGEOVER||0);
  if(scheduled<=0) return null;
  return Math.round((mt.RUNNING||0)/scheduled*100);
}
function efficiencyColor(pct){
  if(pct===null) return 'var(--muted)';
  if(pct>=85) return 'var(--run)';
  if(pct>=60) return 'var(--change)';
  return 'var(--wait)';
}
function mergeIntervals(intervals){
  if(!intervals.length) return [];
  const sorted = intervals.slice().sort((a,b)=>a.start-b.start);
  const merged = [{...sorted[0]}];
  for(let i=1;i<sorted.length;i++){
    const last = merged[merged.length-1];
    const cur = sorted[i];
    if(cur.start <= last.end){ last.end = Math.max(last.end, cur.end); }
    else { merged.push({...cur}); }
  }
  return merged;
}
function totalBreakMinutes(recs){
  const byDate = {};
  recs.filter(r=>r.status==='BREAK').forEach(r=>{
    if(!byDate[r.date]) byDate[r.date]=[];
    let s=toMin(r.startTime), e=toMin(r.endTime); if(e<s) e+=1440;
    byDate[r.date].push({start:s,end:e});
  });
  let total = 0;
  Object.values(byDate).forEach(intervals=>{
    mergeIntervals(intervals).forEach(iv=>{ total += (iv.end-iv.start); });
  });
  return total;
}
function dayTotals(recs){
  const t = {RUNNING:0,CHANGEOVER:0,WAITING:0,NO_WORK:0,BREAK:0,PLANNED:0, upstream:0, internal:0};
  recs.forEach(r=>{
    if(r.status!=='BREAK'){ t[r.status]=(t[r.status]||0)+r.durationMin; }
    if(r.status==='WAITING'){ if(r.classification==='upstream') t.upstream+=r.durationMin; else t.internal+=r.durationMin; }
  });
  t.BREAK = totalBreakMinutes(recs);
  return t;
}
function bottlenecks(recs, limit){
  const map = {};
  recs.filter(r=>r.status==='WAITING' || r.status==='CHANGEOVER').forEach(r=>{
    const key = effectiveReasonLabel(r) || r.status;
    map[key] = (map[key]||0)+r.durationMin;
  });
  return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,limit||5);
}

/* ---------- display mode: hands-off camera tour for an iPad or TV on the wall ---------- */
const STOPS={v1:[0.0,18.6],v2:[0.0,7.95],v3:[5.25,-7.1],mp:[12.6,9.6]};
const tour={on:false,queue:[],stop:null,time:0,ang:0,lock:null};
function nextStops(){
  const alarms=["v1","v2","v3","mp"].filter(k=>isAlarm(view[k]));
  const down=["v1","v2","v3","mp"].filter(k=>view[k]&&view[k].state==="down"&&!alarms.includes(k));
  if(alarms.length)return alarms.map(k=>({k,secs:20})).concat([{k:"overview",secs:8}]);
  return down.map(k=>({k,secs:14})).concat([{k:"v3",secs:11},{k:"v2",secs:11},{k:"v1",secs:11},{k:"mp",secs:9},{k:"overview",secs:10}].filter(s=>!down.includes(s.k)));
}
function camFor(stop,ang){
  if(stop.k==="overview")return {p:VVIEW.pos.clone(),t:VVIEW.target.clone()};
  const c=STOPS[stop.k],r=15,h=11;return {p:new THREE.Vector3(c[0]+r*Math.sin(ang),h,c[1]+r*Math.cos(ang)),t:new THREE.Vector3(c[0],0.8,c[1])};
}
function goStop(){
  if(!tour.queue.length)tour.queue=nextStops();
  tour.stop=tour.queue.shift();tour.time=tour.stop.secs;tour.ang=0.5;
  const c=camFor(tour.stop,tour.ang);fly={fromP:camera.position.clone(),fromT:controls.target.clone(),toP:c.p,toT:c.t,t:0};
  if(tour.stop.k!=="overview")highlight[tour.stop.k]=performance.now()/1000;
}
function tourStep(dt){
  // a machine just went into alarm: jump to it straight away
  const al=["v1","v2","v3","mp"].find(k=>isAlarm(view[k]));
  if(al&&tour.stop&&tour.stop.k!==al&&!isAlarm(view[tour.stop.k])){tour.queue=nextStops();goStop();return}
  if(fly)return;
  tour.time-=dt;
  if(tour.stop&&tour.stop.k!=="overview"){tour.ang+=dt*0.07;const c=camFor(tour.stop,tour.ang);camera.position.copy(c.p);controls.target.copy(c.t)}
  if(tour.time<=0)goStop();
}

  const d=makeWorker(WHITE_HAT,mats.skin2);scene.remove(d.g);g.add(d.g);d.g.position.set(0,0.42,-0.15);d.g.position.set(0,0.42,-0.15);d.body.material=WK.shirt;d.shoulders.material=WK.shirt;d.sleeves.forEach(x=>x.material=WK.shirt);d.apron.visible=false;d.vest.visible=true;d.vested=true; // forklift driver always in the warehouse: vest

function updateForklift(dt){
  const g=FL.g;FL.load.visible=FL.loaded;
  if(FL.wait>0){FL.wait-=dt;FL.lift+=(FL.loaded?0.35:0.05)-FL.lift>0?dt*0.4:-dt*0.4;FL.lift=Math.max(0.05,Math.min(0.35,FL.lift));FL.car.position.y=0.12+FL.lift;return}
  const tgt=FL.path[FL.i],dx=tgt[0]-g.position.x,dz=tgt[1]-g.position.z,dist=Math.hypot(dx,dz);
  if(dist<0.05){ // pick up at the back of the warehouse, drop off near the floor door
    if(FL.i===1){FL.loaded=true;FL.wait=2.5}else if(FL.i===3){FL.loaded=false;FL.wait=2.5}else FL.wait=0.4;
    FL.i=(FL.i+1)%FL.path.length;return}
  const want=Math.atan2(dx,dz);let d=want-g.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));
  g.rotation.y+=d*Math.min(1,dt*3);
  if(Math.abs(d)<0.35){const step=Math.min(dist,1.8*dt);g.position.x+=dx/dist*step;g.position.z+=dz/dist*step}

let embedH=0;
function fitEmbed(){
  if(!EMBED)return;
  let h=0;try{h=window.frameElement?window.frameElement.clientHeight:0}catch(e){}
  if(!h)h=window.innerHeight;
  if(Math.abs(h-embedH)<2)return;embedH=h;
  [document.documentElement,document.body,document.getElementById("app")].forEach(el=>{el.style.height=h+"px";el.style.minHeight="0";el.style.overflow="hidden"});
  resize();
}

let last=performance.now(),paused=false;
// the CI Tracker pauses the 3D floor while it's hidden (List view or another tab) to save battery
window.addEventListener("message",e=>{if(e.origin!==location.origin||!e.data)return;
  if(e.data.floor==="pause")paused=true;if(e.data.floor==="resume"&&paused){paused=false;last=performance.now();resize()}});
function loop(now){
  // one bad frame must never stop the 3D floor: log it and keep drawing
  try{loopFrame(now)}catch(e){if(!loop.warned){loop.warned=true;console.error("3D frame error",e)}}
  requestAnimationFrame(loop);
}
function loopFrame(now){
  if(paused)return;
  const dt=Math.min(0.05,(now-last)/1000);last=now;const t=now/1000;
  ["v1","v2","v3","mp"].forEach(k=>{updateMachineVis(k,dt,t);drawTag(k,view[k])});

    o.b.position.z=Math.min(o.z,mz1);o.b.position.x=marel.x+(o.z>mz1?o.side*Math.min(marel.w/2+0.8,(o.z-mz1)*3.4):0)});
  beltBoxes.forEach(o=>{const on=view[o.from]&&view[o.from].state==="run";o.b.visible=on;if(!on)return;
    o.off=(o.off+dt*0.7)%4.2;o.b.position.z=o.from==="v2"?7.9+o.off:16.4-o.off});
  for(let i=workers.length-1;i>=0;i--){const w=workers[i];updateWorker(w,dt,t);if(w.state==="gone"){scene.remove(w.g);workers.splice(i,1)}}

    camera.position.lerpVectors(fly.fromP,fly.toP,e);controls.target.lerpVectors(fly.fromT,fly.toT,e);if(fly.t>=1)fly=null}
  controls.update();renderer.render(scene,camera);
}
