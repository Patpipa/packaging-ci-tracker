const UPSTREAM_OTHERS = 'Others';
function upstreamDeptFor(reason){
  const r = REASON_RENAMES[reason] || reason || '';
  const d = UPSTREAM_DEPARTMENTS.find(d=> d.match ? d.match(r) : d.reasons.includes(r));
  return d ? d.name : UPSTREAM_OTHERS;
}
function upstreamRecordsInRange(start, end){
  return Store.records.filter(r=>!r.side && r.date>=start && r.date<=end && r.status==='WAITING' && r.classification==='upstream');
}
function previousPeriod(start, end){
  const s = new Date(start+'T00:00:00'), e = new Date(end+'T00:00:00');
  const days = Math.round((e-s)/86400000)+1;
  const pe = new Date(s); pe.setDate(pe.getDate()-1);
  const ps = new Date(pe); ps.setDate(ps.getDate()-(days-1));
  return {start:localDateStr(ps), end:localDateStr(pe), days};
}
function computeUpstreamImpact(start, end){
  const recs = upstreamRecordsInRange(start, end);
  const allDown = Store.records.filter(r=>!r.side && r.date>=start && r.date<=end && (r.status==='WAITING'||r.status==='CHANGEOVER'));
  const allDownMin = allDown.reduce((a,r)=>a+(r.durationMin||0),0);
  const prev = previousPeriod(start, end);
  const prevByDept = {};
  upstreamRecordsInRange(prev.start, prev.end).forEach(r=>{ const d=upstreamDeptFor(r.reason); prevByDept[d]=(prevByDept[d]||0)+(r.durationMin||0); });
  const prevHasData = Store.records.some(r=>!r.side && r.date>=prev.start && r.date<=prev.end);
  const depts = {};
  recs.forEach(r=>{
    const name = upstreamDeptFor(r.reason);
    const g = depts[name] || (depts[name] = {name, totalMin:0, count:0, reasons:{}, machines:{}});
    const min = r.durationMin||0;
    g.totalMin += min; g.count++;
    const label = effectiveReasonLabel(r) || 'Waiting';
    const rg = g.reasons[label] || (g.reasons[label] = {label, totalMin:0, count:0});
    rg.totalMin += min; rg.count++;
    g.machines[r.machine] = (g.machines[r.machine]||0) + min;
  });
  const totalMin = recs.reduce((a,r)=>a+(r.durationMin||0),0);
  const list = Object.values(depts).map(g=>({
    ...g,
    share: totalMin>0 ? g.totalMin/totalMin*100 : 0,
    reasons: Object.values(g.reasons).sort((a,b)=>b.totalMin-a.totalMin),
    machines: Object.entries(g.machines).sort((a,b)=>b[1]-a[1]),
    prevMin: prevByDept[g.name]||0
  })).sort((a,b)=> (a.name===UPSTREAM_OTHERS) - (b.name===UPSTREAM_OTHERS) || b.totalMin-a.totalMin);
  const prevTotal = Object.values(prevByDept).reduce((a,b)=>a+b,0);
  return {list, totalMin, count:recs.length, allDownMin, sharePct: allDownMin>0 ? Math.round(totalMin/allDownMin*100) : 0, prev, prevTotal, prevHasData, days:new Set(recs.map(r=>r.date)).size};
}
/* Change vs the previous period of the same length. More waiting = red (worse), less = green. */
function upstreamTrend(cur, prev, hasPrev, forPdf){
  if(!hasPrev) return {text:'no earlier data', color: forPdf?'#999':'var(--muted)'};
  const diff = Math.round(cur - prev);
  if(prev<=0 && cur>0) return {text:'new this period', color: forPdf?'#c0392b':'var(--wait)'};
  if(diff===0) return {text:'no change', color: forPdf?'#999':'var(--muted)'};
  const pct = prev>0 ? Math.round(Math.abs(diff)/prev*100) : 0;
  return diff>0
    ? {text:`▲ ${fmtDur(diff)} more (+${pct}%)`, color: forPdf?'#c0392b':'var(--wait)'}
    : {text:`▼ ${fmtDur(-diff)} less (−${pct}%)`, color: forPdf?'#2e8b57':'var(--run)'};
}

/* v102: Before vs after noon, per line (Variovac 1–3). Shows when each line actually produced across the shift (8:00–4:30, split at 12:00) — e.g. a line starved all morning then flooded after lunch. Only RUNNING time counts as production; a record crossing noon is split. Upstream waiting before noon uses the same Upstream tag as the rest of this report. */
const AMPM_LINES = ['Variovac 1','Variovac 2','Variovac 3'];
const NOON_MIN = 12*60;
function fmtShort(min){ min=Math.round(min); if(min<60) return min+'m'; const h=Math.floor(min/60), m=min%60; return h+'h'+(m?String(m).padStart(2,'0'):''); }
function splitSpanAtNoon(start, end){
  const s=toMin(start), e=toMin(end);
  if(s==null||e==null||e<=s) return [0,0];
  return [Math.max(0, Math.min(e,NOON_MIN)-s), Math.max(0, e-Math.max(s,NOON_MIN))];
}
/* v116: a Live Floor run is split using its actual running segments, so stops inside the run (waiting, breaks…) are no longer counted as running time */
function splitAtNoon(r){
  if(r.status==='RUNNING' && r.plh && Array.isArray(r.plh.segments) && r.plh.segments.length){
    return r.plh.segments.reduce((acc,seg)=>{ const [a,b]=splitSpanAtNoon(seg.start, seg.end); return [acc[0]+a, acc[1]+b]; }, [0,0]);
  }
  return splitSpanAtNoon(r.startTime, r.endTime);
}
function computeAmPm(start, end){
  const recs = Store.records.filter(r=>r.date>=start && r.date<=end && AMPM_LINES.includes(r.machine));
  const days = [...new Set(recs.map(r=>r.date))].sort();
  const blank = ()=>({am:0, pm:0, upAm:0});
  const byDay = {}, tot = {};
  AMPM_LINES.forEach(l=>tot[l]=blank());
  days.forEach(d=>{ byDay[d]={}; AMPM_LINES.forEach(l=>byDay[d][l]=blank()); });
  recs.forEach(r=>{
    const [a,b] = splitAtNoon(r);
    const c = byDay[r.date][r.machine], t = tot[r.machine];
    if(r.status==='RUNNING'){ c.am+=a; c.pm+=b; t.am+=a; t.pm+=b; }
    if(r.status==='WAITING' && r.classification==='upstream'){ c.upAm+=a; t.upAm+=a; }
  });
  // A "starved morning": a line ran under 1h before noon while another line ran 2h+ that same morning
  const flags = [];
  days.forEach(d=>{
    const best = AMPM_LINES.reduce((x,l)=> byDay[d][l].am > byDay[d][x].am ? l : x, AMPM_LINES[0]);
    AMPM_LINES.forEach(l=>{
      const c = byDay[d][l];
      if(l!==best && c.am<60 && byDay[d][best].am>=120 && (c.pm>0 || c.upAm>0)) flags.push({date:d, line:l, am:c.am, upAm:c.upAm, other:best, otherAm:byDay[d][best].am});
    });
  });
  const active = AMPM_LINES.filter(l=>tot[l].am+tot[l].pm>0);
  let headline = '';
  if(active.length>=2){
    const lo = active.reduce((x,l)=> tot[l].am < tot[x].am ? l : x, active[0]);
    const hi = active.reduce((x,l)=> tot[l].am > tot[x].am ? l : x, active[0]);
    if(lo!==hi) headline = `Before noon, ${lo} ran ${fmtDur(tot[lo].am)} in total, while ${hi} ran ${fmtDur(tot[hi].am)}.${tot[lo].upAm>0?` ${lo} waited ${fmtDur(tot[lo].upAm)} on upstream areas before noon.`:''}`;
  }
  return {days, byDay, tot, flags, headline, hasData: active.length>0};
}
function isFlagged(a, d, l){ return a.flags.some(f=>f.date===d && f.line===l); }
function renderAmPmCard(start, end){
  const a = computeAmPm(start, end);
  if(!a.hasData) return '';
  const max = Math.max(1, ...AMPM_LINES.flatMap(l=>[a.tot[l].am, a.tot[l].pm]));
  const bar = (min, color)=>`<div style="flex:1;height:8px;background:var(--panel2);border-radius:5px;overflow:hidden;"><div style="height:100%;width:${Math.round(min/max*100)}%;background:${color};border-radius:5px;"></div></div>`;
  const bars = AMPM_LINES.map(l=>`
    <div style="margin-bottom:12px;">
      <div style="font-family:'Oswald';font-size:13.5px;margin-bottom:4px;">${l}</div>
      <div style="display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:3px;"><span style="width:76px;color:var(--muted);">Before noon</span>${bar(a.tot[l].am,'var(--amber)')}<span class="mono" style="width:56px;text-align:right;">${fmtShort(a.tot[l].am)}</span></div>
      <div style="display:flex;align-items:center;gap:8px;font-size:12px;"><span style="width:76px;color:var(--muted);">After noon</span>${bar(a.tot[l].pm,'var(--brk)')}<span class="mono" style="width:56px;text-align:right;">${fmtShort(a.tot[l].pm)}</span></div>
    </div>`).join('');
  const th = 'text-align:center;font-size:10px;color:var(--muted);padding:4px 2px;font-weight:600;';
  const td = 'text-align:center;font-size:11.5px;padding:5px 2px;border-top:1px solid var(--line);font-family:"IBM Plex Mono",monospace;';
  const table = `<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;">
    <tr><th style="${th}text-align:left;"></th>${AMPM_LINES.map(l=>`<th colspan="2" style="${th}">${l.replace('Variovac ','V')}</th>`).join('')}</tr>
    <tr><th style="${th}text-align:left;">Day</th>${AMPM_LINES.map(()=>`<th style="${th}">AM</th><th style="${th}">PM</th>`).join('')}</tr>
    ${a.days.map(d=>`<tr><td style="${td}text-align:left;font-family:inherit;white-space:nowrap;">${fmtDate(d).replace(/, \d{4}$/,'')}</td>${AMPM_LINES.map(l=>{ const c=a.byDay[d][l]; const f=isFlagged(a,d,l); return `<td style="${td}${f?'color:var(--wait);font-weight:700;':''}">${fmtShort(c.am)}</td><td style="${td}color:var(--muted);">${fmtShort(c.pm)}</td>`; }).join('')}</tr>`).join('')}
  </table></div>`;
  const flags = a.flags.length ? `<div style="margin-top:12px;">${a.flags.map(f=>`<div style="font-size:12.5px;padding:6px 0;border-top:1px dashed var(--line);"><b style="color:var(--wait);">${fmtDate(f.date).replace(/, \d{4}$/,'')}:</b> ${f.line} ran ${fmtDur(f.am)} before noon${f.upAm?` (waited ${fmtDur(f.upAm)} upstream)`:''}; ${f.other} ran ${fmtDur(f.otherAm)}.</div>`).join('')}</div>` : '';
  return `<div class="card">
    <h3>Before vs After Noon — Running Time</h3>
    ${a.headline ? `<div style="font-size:13.5px;line-height:1.5;margin-bottom:12px;">${a.headline}</div>` : ''}
    ${bars}
    ${table}
    ${flags}
    <div style="font-size:11px;color:var(--muted);margin-top:10px;line-height:1.4;">Running time only, split at 12:00. Red = line ran under 1h before noon while another line ran 2h+.</div>
  </div>`;
}
function renderAmPmPdfHTML(start, end){
  const a = computeAmPm(start, end);
  if(!a.hasData) return '';
  const max = Math.max(1, ...AMPM_LINES.flatMap(l=>[a.tot[l].am, a.tot[l].pm]));
  const bar = (min, color)=>`<div style="flex:1;height:9px;background:#eee;border-radius:5px;overflow:hidden;"><div style="height:100%;width:${Math.round(min/max*100)}%;background:${color};"></div></div>`;
  const th = 'font-size:10px;color:#888;text-transform:uppercase;letter-spacing:0.04em;padding:5px 6px;border-bottom:2px solid #1e3a5f;text-align:center;';
  const td = 'font-size:11.5px;color:#1a1a2e;padding:6px;border-bottom:1px solid #e6e6e6;text-align:center;';
  return `
    <div style="page-break-inside:avoid;break-inside:avoid;margin-bottom:20px;">
      <div style="font-size:15px;font-weight:700;margin-bottom:4px;">Before vs After Noon — Running Time by Line</div>
      ${a.headline ? `<div style="font-size:12.5px;color:#333;margin-bottom:10px;line-height:1.5;">${a.headline}</div>` : ''}
      ${AMPM_LINES.map(l=>`
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:11.5px;">
          <span style="width:80px;font-weight:700;">${l}</span>
          <span style="width:70px;color:#888;">Before noon</span>${bar(a.tot[l].am,'#e0a030')}<span style="width:50px;text-align:right;">${fmtShort(a.tot[l].am)}</span>
          <span style="width:62px;color:#888;margin-left:8px;">After noon</span>${bar(a.tot[l].pm,'#4a90d9')}<span style="width:50px;text-align:right;">${fmtShort(a.tot[l].pm)}</span>
        </div>`).join('')}
    </div>
    <div style="page-break-inside:avoid;break-inside:avoid;margin-bottom:20px;">
      <table style="width:100%;border-collapse:collapse;">
        <tr><th style="${th}text-align:left;">Day</th>${AMPM_LINES.map(l=>`<th style="${th}">${l} AM</th><th style="${th}">${l} PM</th>`).join('')}</tr>
        ${a.days.map(d=>`<tr><td style="${td}text-align:left;">${fmtDate(d)}</td>${AMPM_LINES.map(l=>{ const c=a.byDay[d][l]; const f=isFlagged(a,d,l); return `<td style="${td}${f?'color:#c0392b;font-weight:700;background:#fdecea;':''}">${fmtShort(c.am)}</td><td style="${td}color:#666;">${fmtShort(c.pm)}</td>`; }).join('')}</tr>`).join('')}
      </table>
      ${a.flags.length ? `<div style="margin-top:8px;">${a.flags.map(f=>`<div style="font-size:11.5px;color:#1a1a2e;padding:3px 0;"><b style="color:#c0392b;">${fmtDate(f.date)}:</b> ${f.line} ran ${fmtDur(f.am)} before noon${f.upAm?` (waited ${fmtDur(f.upAm)} upstream)`:''}; ${f.other} ran ${fmtDur(f.otherAm)}.</div>`).join('')}</div>` : ''}
      <div style="font-size:10px;color:#888;margin-top:6px;">Running time only, split at 12:00 (shift 8:00–4:30). Red = line ran under 1h before noon while another line ran 2h+.</div>
    </div>`;
}
function renderUpstreamReportHTML(start, end){
  const u = computeUpstreamImpact(start, end);
  const dateLabel = start===end ? fmtDate(start) : `${fmtDate(start)} – ${fmtDate(end)}`;
  const totalTrend = upstreamTrend(u.totalMin, u.prevTotal, u.prevHasData, true);
  const statCard = (label,val)=>`<div style="flex:1;min-width:0;background:#f7f7f7;border-radius:8px;padding:12px 14px;"><div style="font-size:10px;color:#888;text-transform:uppercase;letter-spacing:0.06em;">${label}</div><div style="font-size:20px;font-weight:700;color:#1a1a2e;margin-top:2px;">${val}</div></div>`;
  const th = 'text-align:left;font-size:10px;color:#888;text-transform:uppercase;letter-spacing:0.05em;padding:6px 8px;border-bottom:2px solid #1e3a5f;';
  const td = 'font-size:12px;color:#1a1a2e;padding:8px;border-bottom:1px solid #e6e6e6;vertical-align:top;'; // explicit colour: the app's own dark-theme table styles also apply while the PDF is built on-screen
  const rows = u.list.map((d,i)=>{ const t=upstreamTrend(d.totalMin, d.prevMin, u.prevHasData, true); return `<tr>
      <td style="${td}font-weight:700;">${i+1}. ${escapeHtml(d.name)}</td>
      <td style="${td}">${fmtDur(d.totalMin)}</td>
      <td style="${td}">${d.count}</td>
      <td style="${td}">${Math.round(d.share)}%</td>
      <td style="${td}color:${t.color};">${t.text}</td></tr>`; }).join('');
  const detailBlocks = u.list.map(d=>`
    <div style="page-break-inside:avoid;break-inside:avoid;border:1px solid #ddd;border-radius:8px;padding:12px 16px;margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;font-size:14px;font-weight:700;"><span>${escapeHtml(d.name)}</span><span style="color:#8e44ad;">${fmtDur(d.totalMin)}</span></div>
      <div style="font-size:11px;color:#777;margin:2px 0 8px;">${d.count} stop${d.count===1?'':'s'} · avg ${fmtDur(d.totalMin/d.count)} each · machines: ${d.machines.map(([m,min])=>`${escapeHtml(m)} (${fmtDur(min)})`).join(', ')}</div>
      ${d.reasons.slice(0,3).map(r=>`<div style="display:flex;justify-content:space-between;font-size:11.5px;padding:3px 0;border-top:1px dashed #eee;"><span>${escapeHtml(r.label)}</span><span style="color:#555;">${fmtDur(r.totalMin)} · ${r.count} stop${r.count===1?'':'s'}</span></div>`).join('')}
    </div>`);
  return `
  <div style="font-family:Arial,Helvetica,sans-serif;color:#1a1a2e;background:#fff;width:816px;">
    <div style="background:#1e3a5f;color:#fff;padding:26px 36px;">
      <div style="font-size:24px;font-weight:700;">Upstream Impact Summary</div>
      <div style="font-size:12.5px;opacity:0.85;margin-top:4px;">${dateLabel} &nbsp;|&nbsp; Prepared by Walter, Packaging</div>
    </div>
    <div style="padding:24px 36px;">
      <div style="border-left:5px solid #8e44ad;background:#f7f7f7;padding:16px 20px;margin-bottom:16px;">
        <div style="font-size:15px;line-height:1.5;">Packaging waited <b>${fmtDur(u.totalMin)}</b> on upstream areas, <b>${u.sharePct}%</b> of all packaging downtime.</div>
        <div style="font-size:11.5px;margin-top:4px;color:${totalTrend.color};">${totalTrend.text} <span style="color:#888;">vs ${fmtDate(u.prev.start)} – ${fmtDate(u.prev.end)}</span></div>
      </div>
      <div style="display:flex;gap:10px;margin-bottom:20px;">
        ${statCard('Upstream waiting', fmtDur(u.totalMin))}
        ${statCard('Stops', u.count)}
        ${statCard('Departments', u.list.length)}
        ${statCard('Production days', u.days)}
      </div>
      <div style="page-break-inside:avoid;break-inside:avoid;margin-bottom:20px;">
        <div style="font-size:15px;font-weight:700;margin-bottom:6px;">Minutes Packaging Waited, by Department</div>
        <table style="width:100%;border-collapse:collapse;">
          <tr><th style="${th}">Department</th><th style="${th}">Time</th><th style="${th}">Stops</th><th style="${th}">Share</th><th style="${th}">vs previous period</th></tr>
          ${rows}
        </table>
      </div>
      ${renderAmPmPdfHTML(start, end)}
      ${renderSideLabourPdfHTML(start, end)}
      <div style="page-break-inside:avoid;break-inside:avoid;">
        <div style="font-size:15px;font-weight:700;margin-bottom:8px;">Top Reasons per Department</div>
        ${detailBlocks[0]||''}
      </div>
      ${detailBlocks.slice(1).join('')}
      <div style="border-top:1px solid #ddd;margin-top:18px;padding-top:10px;font-size:10px;color:#888;line-height:1.5;">Times are recorded live on the packaging floor, by machine and reason, as each stop happens. This summary measures how long packaging waited; it does not assess causes inside other departments. Reasons without an assigned department are grouped under "Others".</div>
      <div style="border-top:1px solid #ddd;margin-top:10px;padding-top:10px;display:flex;justify-content:space-between;font-size:10.5px;color:#999;">
        <span>Upstream Impact Summary — ${dateLabel}</span>
        <span>Packaging CI Tracker ${APP_VERSION.split(' ')[0]}</span>
      </div>
    </div>
  </div>`;
}
async function exportUpstreamPDF(){
  const {start, end} = upstreamRange;
  if(!upstreamRecordsInRange(start, end).length){ toast('No upstream waiting time in this range'); return; }
  await buildHtmlReportPDF(renderUpstreamReportHTML(start, end), `Upstream-Impact-${start}${end!==start?'_to_'+end:''}.pdf`);
}

/* ============ APP TOUR ============
The illustrated tour lives in its own file (tour.html, next to index.html) so the same tour serves two places: the shareable "How it works" link for supervisors/managers/the director, and this in-app overlay. One file to update when the tour changes. Shown automatically once per device (after sign-in), and on demand from Settings. */
const TOUR_SEEN_KEY = 'pct_tour_seen_v1';
async function openTour(auto){
  if(document.getElementById('tourOverlay')) return;
  try{
    const res = await fetch('tour.html', {method:'HEAD', cache:'no-store'});
    if(!res.ok) throw new Error('tour.html not found');
  }catch(e){
    if(!auto) toast('Tour unavailable — check tour.html is uploaded and you are online');
    return; // auto: stay silent and try again next launch (seen flag is not set)
  }
  const ov = document.createElement('div');
  ov.id = 'tourOverlay';
  ov.style.cssText = 'position:fixed;inset:0;z-index:100000;background:var(--bg);box-sizing:border-box;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);'; // safe-area padding lives here: iOS doesn't pass notch/home-bar insets into an iframe
  ov.innerHTML = '<iframe src="tour.html?app=1" title="App tour" style="border:0;width:100%;height:100%;display:block;background:var(--bg);"></iframe>';
  document.body.appendChild(ov);
  document.body.style.overflow = 'hidden';
}
function closeTour(){
  const ov = document.getElementById('tourOverlay');
  if(ov) ov.remove();
  document.body.style.overflow = '';
  safeLocalSet(TOUR_SEEN_KEY, '1');
}
window.addEventListener('message', e=>{
  if(e.origin !== location.origin) return;
  if(e.data && e.data.type === 'ci-tour-done') closeTour();
});
function tourLink(){ return new URL('tour.html', location.href).href; }
async function copyTourLink(){
  const link = tourLink();
  try{ await navigator.clipboard.writeText(link); toast('Tour link copied — paste it in a text or email'); }
  catch(e){ prompt('Copy this link:', link); }
}
async function shareTourLink(){
  const link = tourLink();
  if(navigator.share){
    try{ await navigator.share({title:'Packaging CI Tracker — how it works', url:link}); }catch(e){ /* user cancelled the share sheet */ }
  } else { copyTourLink(); }
}

/* ============ INIT ============ */
(function bootstrap(){
  firebase.initializeApp(FIREBASE_CONFIG);
  firebase.auth().onAuthStateChanged(async (user)=>{
    if(!user){
      document.getElementById('main').innerHTML = renderLoginScreen();
      document.getElementById('pageTitle').textContent = 'Sign In';
      return;
    }
    await startApp();
  });
})();
/* v116: repairs records saved before v116 that were left open overnight (finish earlier than start, e.g. No Work from 4:00 PM closed at 8:33 AM next day → counted 16+ h). The finish is set to the 4:30 PM shift end (or the start, if it began after 4:30). Safe to run on every load — fixed records no longer match. */
async function repairOvernightRecords(){
  try{
    if(!Store.ready) return;
    let n=0;
    Store.records.forEach((r,i)=>{
      const s=toMin(r.startTime), e=toMin(r.endTime);
      if(s==null||e==null||e>=s) return;
      const newEnd = pastOpenEnd(r.startTime);
      let fixed = {...r, endTime:newEnd, durationMin: duration(r.startTime,newEnd), notes: ((r.notes||'')+' [auto-fixed: left open overnight, finish set to '+fmtTime12(newEnd)+']').trim()};
      if(r.status==='RUNNING' && r.plh && Array.isArray(r.plh.segments)){
        const plh = {...r.plh, segments: r.plh.segments.map(sg=>toMin(sg.end)<toMin(sg.start)?{...sg,end:pastOpenEnd(sg.start)}:sg), downtimeSegments:(r.plh.downtimeSegments||[]).map(d=>toMin(d.end)<toMin(d.start)?{...d,end:pastOpenEnd(d.start)}:d)};
        const rc = recalcLiveRunRecord({...r, plh}, r.startTime, newEnd);
        fixed = {...fixed, plh: rc.plh, durationMin: rc.durationMin};
      }
      Store.records[i] = fixed; n++;
    });
    if(n){ await Store.saveRecords(); toast(`Fixed ${n} record${n===1?'':'s'} left open overnight`); }
  }catch(e){ console.error('overnight repair failed', e); }
}
async function startApp(){
  await Store.init();
  try{ const w = storageUsage().filter(r=>r.pct>=80); const k='pct_storage_warn_'+todayStr(); if(w.length && !safeLocalGet(k)){ safeLocalSet(k,'1'); setTimeout(()=>toast(`Storage: ${w[0].name} is ${w[0].pct.toFixed(0)}% full — see Settings`), 2500); } }catch(e){}
  await migrateReasonLabels();
  await migrateRibeyeEye();
  await mergeSideJobs();
  await repairOvernightRecords();
  render();
  if(!safeLocalGet(TOUR_SEEN_KEY)) openTour(true);
  setInterval(updateClock, 30000);
  setInterval(()=>{ if(Router.current==='live'||Router.current==='dashboard') render(); }, 30000);

  /* Self-heal a stale Firestore connection or a stale local cache: iOS can tear down the connection while the tab is backgrounded (phone locked, app switched away, or the device hopped between wifi/cellular). Firestore's offline persistence can silently keep showing old cached data with no error at all when this happens — so on returning to the app, force a genuine server read (bypassing the local cache) for whatever's currently live, rather than trusting the ambient listener to have caught up on its own. This is what keeps two devices (e.g. iPad on the floor, phone during a break) from disagreeing about what's actually running after switching between them. */
  let wasHidden = false;
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='hidden'){ wasHidden = true; return; }
    if(document.visibilityState==='visible' && wasHidden && Store.db){
      wasHidden = false;
      Store.db.collection('tracker').doc('settings').get().catch(e=>{ // v150: small document, just to test the connection
        const msg = String(e && e.message || e).toLowerCase();
        if(msg.includes('terminated') || msg.includes('client is offline')){
          toast('Reconnecting…');
          setTimeout(()=>location.reload(), 600);
          return;
        }
      });
      // Force a genuine from-server refresh of live run state specifically — this is the data most likely to have changed on another device while this tab was away, and the one where a stale view causes real confusion
      Store.db.collection('tracker').doc('liveRuns').get({source:'server'}).then(snap=>{
        if(snap.exists && snap.data().data){
          Store.liveRuns = JSON.parse(snap.data().data);
          safeLocalSet('pct_live_runs_backup', snap.data().data);
          if(Router.current==='live'||Router.current==='dashboard') render();
        }
      }).catch(()=>{ /* server unreachable right now — the visible listener will catch up once it can */ });
    }
  });
}
