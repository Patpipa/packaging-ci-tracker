<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CI Tracker">
<title>Packaging CI Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{
  --bg:#181B1E; --panel:#22262A; --panel2:#2B3034; --line:#383E43;
  --text:#EDEFF1; --muted:#9AA1A6; --muted2:#6D7377;
  --amber:#E0A030; --amber-dim:#3A2F1C;
  --run:#3FA35B; --run-dim:#1D3323;
  --change:#D98F2B; --change-dim:#3A2A14;
  --wait:#D6534A; --wait-dim:#3A1E1C;
  --brk:#4A90D9; --brk-dim:#1C2A3A;
  --nowork:#7C848A; --nowork-dim:#26292C;
  --planned:#B8A06A; --planned-dim:#302A1E;
  --up:#C77DD6; --int:#4FB3C2;
  --radius:14px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;height:100%;overscroll-behavior-y:none;}
body{padding-bottom:env(safe-area-inset-bottom);}
h1,h2,h3{font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.03em; margin:0;}
.mono{font-family:'IBM Plex Mono',monospace;}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;}
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg) 80%,transparent);padding:14px 16px 8px;display:flex;align-items:center;justify-content:space-between;}
.topbar .brand{display:flex;flex-direction:column;line-height:1;}
.topbar .brand .eyebrow{font-size:10px;letter-spacing:0.18em;color:var(--amber);font-weight:600;text-transform:uppercase;}
.topbar h1{font-size:19px;color:var(--text);margin-top:2px;}
.iconbtn{width:40px;height:40px;border-radius:10px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text);}
main{flex:1;padding:0 16px 100px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
.card h3{font-size:12px;color:var(--muted);letter-spacing:0.1em;margin-bottom:10px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.machine-card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:18px 10px;text-align:center;min-width:0;position:relative;}
@keyframes breathingGlow{
  0%,100% { box-shadow:0 0 3px 0px var(--glow-color); }
  50% { box-shadow:0 0 9px 2px var(--glow-color); }
}
.machine-card.glow-running{ animation:breathingGlow 2.8s ease-in-out infinite; }
@keyframes alarmFlash{
  0%,100% { box-shadow:0 0 6px 1px var(--wait); background:var(--panel2); }
  50% { box-shadow:0 0 18px 5px var(--wait); background:rgba(224,90,80,0.14); }
}
.machine-card.alarm-flash{ animation:alarmFlash 1s ease-in-out infinite; border-width:2px; }
@media (prefers-reduced-motion: reduce){
  .machine-card.glow-running{ animation:none; box-shadow:0 0 4px 0px var(--glow-color); }
  .machine-card.alarm-flash{ animation:none; box-shadow:0 0 10px 2px var(--wait); background:rgba(224,90,80,0.12); }
}
.machine-card .mname{font-family:'Oswald';font-size:15px;color:var(--text);letter-spacing:0.05em;}
.machine-card .mstat{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:8px;}
.pill{font-size:10px;padding:3px 7px;border-radius:20px;font-weight:600;letter-spacing:0.02em;display:inline-flex;align-items:center;gap:4px;}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;}
.pill.run{background:var(--run-dim);color:var(--run);}
.pill.change{background:var(--change-dim);color:var(--change);}
.pill.wait{background:var(--wait-dim);color:var(--wait);}
.pill.brk{background:var(--brk-dim);color:var(--brk);}
.pill.nowork{background:var(--nowork-dim);color:var(--nowork);}
.pill.planned{background:var(--planned-dim);color:var(--planned);}
.bignum{font-family:'IBM Plex Mono';font-size:28px;font-weight:600;}
.statrow{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;}
.statrow:last-child{border-bottom:none;}
.statrow .lbl{color:var(--muted);}
.statrow .val{font-family:'IBM Plex Mono';font-weight:600;}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:12px;border:none;font-family:'Oswald';font-size:16px;letter-spacing:0.04em;text-transform:uppercase;font-weight:600;cursor:pointer;}
.btn-primary{background:var(--amber);color:#1A1500;}
.btn-secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line);}
.btn-danger{background:var(--wait-dim);color:var(--wait);border:1px solid var(--wait);}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line);}
.btn:active{transform:scale(0.98);}
.btnrow{display:flex;gap:8px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:11px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:6px;font-weight:600;}
select,input[type=text],input[type=time],input[type=number],input[type=password],input[type=email],textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:16px;border-radius:10px;font-size:18px;font-family:'Inter';appearance:none;}
select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='8'><path d='M1 1l6 6 6-6' stroke='%239AA1A6' stroke-width='2' fill='none'/></svg>");background-repeat:no-repeat;background-position:right 14px center;}
textarea{min-height:70px;resize:vertical;font-size:15px;}
.timerow{display:flex;gap:10px;}
.timerow .field{flex:1;}
.duration-badge{background:var(--panel2);border:1px dashed var(--line);border-radius:10px;padding:10px 14px;text-align:center;margin:-4px 0 16px;font-family:'IBM Plex Mono';color:var(--amber);font-size:14px;}
.statusgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
/* v149: downtime picker — blocks instead of dropdowns */
.dt-lbl{font:600 10.5px 'Inter',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 0 7px;}
.dt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.dt-tile{display:flex;flex-direction:column;justify-content:space-between;gap:5px;text-align:left;min-height:60px;border:1.5px solid var(--line);border-left:4px solid var(--tc,var(--line));background:var(--panel2);color:var(--text);border-radius:11px;padding:9px 10px;font:600 13.5px/1.25 'Inter',sans-serif;cursor:pointer;min-width:0;overflow-wrap:anywhere;}
.dt-tile .meta{font:500 11px 'Inter',sans-serif;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;}
.dt-tile .star{color:var(--amber);font-weight:700;}
.dt-tile.sel{border-color:var(--amber);background:var(--amber-dim);box-shadow:0 0 0 1px var(--amber) inset;}
.dt-cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.dt-cat{border:1.5px solid var(--line);border-top:4px solid var(--cc);background:var(--panel2);border-radius:11px;padding:10px 8px;cursor:pointer;color:var(--text);text-align:left;display:flex;flex-direction:column;gap:3px;}
.dt-cat b{font:600 13px/1.2 'Inter',sans-serif;}
.dt-cat span{font:500 11px 'IBM Plex Mono',monospace;color:var(--muted);}
.dt-cat.open{border-color:var(--cc);background:color-mix(in srgb,var(--cc) 16%,var(--panel2));}
.dt-group{margin-top:10px;}
.dt-group h4{margin:0 0 6px;font:600 11px 'Inter',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--tc);}
.dt-search{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:0 12px;margin-top:4px;}
.dt-search input{flex:1;min-width:0;background:none;border:0;color:var(--text);font:500 15px 'Inter',sans-serif;padding:12px 0;outline:none;}
.dt-search:focus-within{border-color:var(--amber);}
@media (max-width:360px){.dt-cats{grid-template-columns:1fr 1fr;}}
.statusopt{padding:16px 8px;border-radius:12px;border:2px solid var(--line);background:var(--panel2);text-align:center;font-family:'Oswald';font-size:13px;letter-spacing:0.03em;color:var(--muted);}
.statusopt .dot{width:10px;height:10px;margin:0 auto 6px;}
.statusopt.sel{border-color:var(--sc);color:var(--text);background:var(--scdim);}
.machinechecks{display:flex;gap:8px;}
.mchip{flex:1;text-align:center;padding:12px 4px;border-radius:10px;border:2px solid var(--line);background:var(--panel2);color:var(--muted);font-family:'Oswald';font-size:13px;}
.mchip.sel{border-color:var(--amber);color:var(--amber);background:var(--amber-dim);}
nav.tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;z-index:30;}
nav.tabbar .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted2);font-size:10px;letter-spacing:0.04em;text-transform:uppercase;font-family:'Oswald';}
nav.tabbar .tab.active{color:var(--amber);}
nav.tabbar .tab .ic{font-size:18px;}
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:var(--run);color:#08150C;padding:10px 20px;border-radius:30px;font-weight:600;font-size:14px;z-index:50;box-shadow:0 6px 18px rgba(0,0,0,0.4);opacity:0;transition:opacity .25s, transform .25s;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
.hist-item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;}
.hist-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.hist-top .mach{font-family:'Oswald';font-size:13px;letter-spacing:0.03em;}
.hist-mid{font-size:13px;color:var(--muted);margin-bottom:6px;}
.hist-bot{display:flex;justify-content:space-between;align-items:center;}
.hist-actions{display:flex;gap:6px;}
.iconsmall{width:30px;height:30px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;}
.filterbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;}
.filterbar select{width:auto;flex:0 0 auto;font-size:12px;padding:8px 10px;}
.rank-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);}
.rank-item:last-child{border-bottom:none;}
.rank-num{font-family:'IBM Plex Mono';font-weight:600;color:var(--amber);width:20px;}
.rank-bar-wrap{flex:1;}
.rank-name{font-size:13px;margin-bottom:4px;}
.rank-bar-bg{background:var(--panel2);border-radius:6px;height:6px;overflow:hidden;}
.rank-bar-fill{height:100%;background:var(--amber);}
.rank-min{font-family:'IBM Plex Mono';font-size:12px;color:var(--muted);width:52px;text-align:right;}
.hidden{display:none !important;}
.fp-wrap{position:relative;border-radius:12px;border:1px solid var(--line);-webkit-overflow-scrolling:touch;}
.fp-inner{position:relative;}
.fp-img{display:block;width:100%;height:auto;border-radius:11px;}
.fp-vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:11px;pointer-events:none;}
.fp-spot{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;}
.fp-dot{width:16px;height:16px;border-radius:50%;background:var(--c);border:2.5px solid #fff;box-shadow:0 0 0 3px color-mix(in srgb, var(--c) 45%, transparent),0 1px 4px rgba(0,0,0,.6);}
.fp-tag{position:absolute;white-space:nowrap;background:rgba(17,20,23,.86);color:#fff;font-size:10px;line-height:1.2;padding:2px 6px;border-radius:7px;border:2px solid var(--c);font-family:'Inter',sans-serif;pointer-events:none;}
.fp-tag b{font-weight:700;}
.fp-alarm .fp-dot{animation:fpPulse 1s ease-in-out infinite;}
@keyframes fpPulse{0%,100%{box-shadow:0 0 0 3px color-mix(in srgb, var(--c) 45%, transparent);}50%{box-shadow:0 0 0 9px color-mix(in srgb, var(--c) 30%, transparent);}}
@media (prefers-reduced-motion: reduce){ .fp-alarm .fp-dot{animation:none;} }
.fp-key{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin:0 3px 0 6px;vertical-align:-1px;}
.fp-key:first-child{margin-left:0;}
.fp-switch{font-family:'Inter',sans-serif;font-size:11px;letter-spacing:0;text-transform:none;padding:4px 10px;border-radius:20px;border:1px solid var(--line);color:var(--muted);cursor:pointer;}
.fp-switch.on{border-color:var(--amber);color:var(--amber);background:var(--amber-dim);}
.fp-sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;}
.fp-sheet{width:100%;max-width:560px;max-height:82vh;overflow:auto;background:var(--panel);border-top:2px solid var(--amber);border-radius:18px 18px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom));}
.fp-sheet .machine-card{cursor:default;}
.cb-hd{border:1.5px solid;border-radius:12px;padding:12px 14px;margin-bottom:10px;}
.cb-big{font-family:'Oswald',sans-serif;font-size:22px;letter-spacing:0.02em;text-transform:uppercase;line-height:1.1;}
.cb-sub{font-size:12.5px;color:var(--muted);margin-top:4px;}
.cb-lbl{font-size:10.5px;color:var(--muted);letter-spacing:0.1em;margin:10px 2px 6px;font-weight:600;}
.cb-row{display:flex;align-items:center;justify-content:space-between;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:6px;}
.cb-nm{font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:0.03em;}
.cb-mut{font-size:12px;color:var(--muted);}
.cb-ppl{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end;}
.cb-p{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;}
.cb-p.ok{background:var(--run-dim);color:var(--run);}
.cb-p.miss{border:1.5px dashed var(--wait);color:var(--wait);}
.cb-p.side{background:var(--amber-dim);color:var(--amber);}
.cb-p.tr{background:rgba(199,125,214,0.15);color:var(--up);}
.cb-p.trn{background:rgba(242,193,78,0.18);color:#F2C14E;box-shadow:0 0 0 1.5px #F2C14E inset;}
.cb-tag{font-family:'Inter',sans-serif;font-size:10.5px;padding:2px 8px;border-radius:20px;background:var(--amber-dim);color:var(--amber);margin-left:4px;letter-spacing:0;}
.nm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;}
.nm-chip{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:11px 4px;font-size:14px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.15;min-height:46px;justify-content:center;}
.nm-chip small{font-size:10.5px;font-weight:500;color:var(--muted);}
.nm-chip.on{border-color:var(--brk);background:var(--brk-dim);color:var(--brk);}
.nm-chip.on small{color:var(--brk);}
.nm-chip.role{border-style:dashed;}
.nm-chip.trn.on{border-color:#F2C14E;background:rgba(242,193,78,0.15);color:#F2C14E;}
.nm-chip.trm.on{border-color:var(--change);background:var(--change-dim);color:var(--change);}
.cb-btn{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 8px;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:0.03em;text-transform:uppercase;cursor:pointer;}
.cb-btn:active{transform:scale(0.97);}
.cb-link{font-size:12px;color:var(--brk);cursor:pointer;text-decoration:underline;}
.cb-legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:10px;}
.cb-legend .cb-p{width:16px;height:16px;}
.cb-legend .cb-p svg{width:9px;height:9px;}
.warnbanner{background:var(--wait-dim);border:1px solid var(--wait);color:var(--wait);padding:12px 14px;border-radius:10px;font-size:13px;margin-bottom:12px;font-weight:600;}
.live-card{background:var(--panel);border:2px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
.live-card.running{border-color:var(--run);}
.live-card.downtime{border-color:var(--change);}
.live-badge{font-size:11px;padding:4px 10px;border-radius:20px;font-weight:700;letter-spacing:0.04em;display:inline-flex;align-items:center;gap:5px;}
.live-badge.idle{background:var(--nowork-dim);color:var(--nowork);}
.live-badge.running{background:var(--run-dim);color:var(--run);}
.live-badge.downtime{background:var(--change-dim);color:var(--change);}
.live-timer{font-family:'IBM Plex Mono';font-size:34px;font-weight:600;color:var(--brk);margin:8px 0 4px;}
.live-segrow{font-size:12.5px;color:var(--muted);line-height:1.5;}
.classtag{font-size:10px;padding:2px 7px;border-radius:6px;font-weight:700;letter-spacing:0.04em;}
.classtag.up{color:var(--up);background:rgba(199,125,214,0.12);}
.classtag.int{color:var(--int);background:rgba(79,179,194,0.12);}
.reporthead{text-align:center;padding:14px 0 20px;}
.reporthead .eyebrow{color:var(--amber);font-size:11px;letter-spacing:0.16em;font-weight:600;}
.reporthead h2{font-size:20px;margin-top:4px;}
.reporthead .sub{color:var(--muted);font-size:13px;margin-top:6px;}
.obs{background:var(--panel2);border-left:3px solid var(--amber);padding:12px 14px;border-radius:8px;font-size:13px;line-height:1.5;color:var(--text);}
.linkrow{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);}
.linkrow:last-child{border-bottom:none;}
.empty{text-align:center;color:var(--muted2);padding:40px 10px;font-size:14px;}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">
      <span class="eyebrow" id="shiftClock">--:--</span>
      <h1 id="pageTitle">Dashboard</h1>
    </div>
    <button class="iconbtn" onclick="Router.go('settings')">⚙</button>
  </div>
  <main id="main"></main>
  <div class="toast" id="toast"></div>
  <nav class="tabbar">
    <div class="tab" data-tab="dashboard" onclick="Router.go('dashboard')"><span class="ic">▦</span>Dashboard</div>
    <div class="tab" data-tab="live" onclick="Router.go('live')"><span class="ic">●</span>Live</div>
    <div class="tab" data-tab="crew" onclick="Router.go('crew')"><span class="ic">👥</span>Crew</div>
    <div class="tab" data-tab="history" onclick="Router.go('history')"><span class="ic">☰</span>History</div>
    <div class="tab" data-tab="reports" onclick="Router.go('reports')"><span class="ic">▤</span>Reports</div>
  </nav>
</div>

<script>
/* ============ DATA / CONSTANTS ============ */
const APP_VERSION = 'v200 - 2026-11-09 (☕ Start Break now works with no lines running — puts everyone in today on break, pauses side machines and Lead / Yield, ▶ End Break brings them back; Crew Hours counts the break for everyone here, placed or not)';
/* RGB colors matching the app's on-screen status colors, used to keep PDF exports visually consistent and scannable */
const PDF_COLOR = {
  amber:[224,160,48], run:[63,163,91], wait:[214,83,74], change:[217,143,43],
  brk:[74,144,217], nowork:[124,132,138], planned:[160,138,84], upstream:[178,110,190], internal:[70,158,172]
};
const MACHINES = ['Variovac 1','Variovac 2','Variovac 3','Manual Pack'];
const PRODUCTS = ['Steak','Burger','Ground Beef','Ground Pork','Ground Bison','Ground Venison','Diced Beef','Diced Pork','Diced Bison','Diced Venison','Meat Box','Rebox','Rework','Relabel','Other'];
const STATUSES = [
  {key:'RUNNING', label:'Running', color:'var(--run)', dim:'var(--run-dim)', pillClass:'run'},
  {key:'CHANGEOVER', label:'Changeover', color:'var(--change)', dim:'var(--change-dim)', pillClass:'change'},

const MAREL_MACHINES = ['Variovac 1','Variovac 2','Variovac 3'];
function reasonAllowedForMachine(reason, machine){
  if(!/^MAREL - /.test(reason)) return true;

}

/* v185: follow rename chains (old -> older-new -> newest) so every old label lands on today's label in one step */
Object.keys(REASON_RENAMES).forEach(k=>{ let v=REASON_RENAMES[k], g=0; while(REASON_RENAMES[v] && g++<6) v=REASON_RENAMES[v]; REASON_RENAMES[k]=v; });
/* Replaces any string value that EXACTLY equals an old reason label, anywhere inside a record (incl. PLH downtime segments). Notes and other free text are never touched because they never match exactly. Returns the number of replacements. */
function renameReasonsDeep(obj){
  let n=0;
  if(Array.isArray(obj)){ obj.forEach((v,i)=>{ if(typeof v==='string' && REASON_RENAMES[v]){ obj[i]=REASON_RENAMES[v]; n++; } else if(v && typeof v==='object') n+=renameReasonsDeep(v); }); }
  else if(obj && typeof obj==='object'){ Object.keys(obj).forEach(k=>{ const v=obj[k]; if(typeof v==='string' && REASON_RENAMES[v]){ obj[k]=REASON_RENAMES[v]; n++; } else if(v && typeof v==='object') n+=renameReasonsDeep(v); }); }
  return n;
}

async function migrateRibeyeEye(){

    Object.values(Store.dayLog||{}).forEach(d=>{ if(!d) return;
      (d.side||[]).forEach(x=>{ if(x.product==='Ribeye'){ x.product='Ribeye (Eye)'; n++; } });

    let m = 0; (Store.records||[]).forEach(r=>{ if(r.side && r.product==='Ribeye'){ r.product='Ribeye (Eye)'; if(r.plh) r.plh.product='Ribeye (Eye)'; m++; } });

  recs.filter(r=>r.machine===machine).forEach(r=>{

function efficiencyPct(mt){

/* Merges overlapping/adjacent time windows into their real combined span — e.g. 9:30-10:00, 9:45-10:15, 10:00-10:30 across three machines becomes one 9:30-10:30 span, not three separate 30-min blocks summed */
function mergeIntervals(intervals){
  if(!intervals.length) return [];
  const sorted = intervals.slice().sort((a,b)=>a.start-b.start);
  const merged = [{...sorted[0]}];
  for(let i=1;i<sorted.length;i++){
    const last = merged[merged.length-1];
    const cur = sorted[i];
    if(cur.start <= last.end){ last.end = Math.max(last.end, cur.end); }
    else { merged.push({...cur}); }
  }
  return merged;
}

function totalBreakMinutes(recs){
  const byDate = {};
  recs.filter(r=>r.status==='BREAK').forEach(r=>{
    if(!byDate[r.date]) byDate[r.date]=[];
    let s=toMin(r.startTime), e=toMin(r.endTime); if(e<s) e=s;
    byDate[r.date].push({start:s,end:e});
  });
  let total = 0;
  Object.values(byDate).forEach(intervals=>{
    mergeIntervals(intervals).forEach(iv=>{ total += (iv.end-iv.start); });
  });
  return total;
}
function dayTotals(recs){
  const t = {RUNNING:0,CHANGEOVER:0,WAITING:0,NO_WORK:0,BREAK:0,PLANNED:0, upstream:0, internal:0};
  recs.forEach(r=>{
    if(r.status!=='BREAK'){ t[r.status]=(t[r.status]||0)+r.durationMin; }
    if(r.status==='WAITING'){ if(r.classification==='upstream') t.upstream+=r.durationMin; else t.internal+=r.durationMin; }
  });
  t.BREAK = totalBreakMinutes(recs);
  return t;
}
/* Groups all Waiting/Changeover time across a date range by specific reason (not per-machine, unless a machine filter is applied) — this is what lets a plant-wide recurring pattern like "MAREL Switching Product" show its true combined impact instead of being hidden across 3 separate machine totals. Tracks which machines it actually hit so an isolated-machine issue is still distinguishable from a systemic one. */
function computeDowntimeAnalysis(start, end, machineFilter){
  let recs = Store.records.filter(r=>!r.side && r.date>=start && r.date<=end && (r.status==='WAITING'||r.status==='CHANGEOVER'));
  if(machineFilter) recs = recs.filter(r=>r.machine===machineFilter);
  const groups = {};
  recs.forEach(r=>{
    const label = effectiveReasonLabel(r) || r.status;
    if(!groups[label]) groups[label] = {reason:label, classification:r.classification, status:r.status, totalMin:0, count:0, machines:new Set()};
    groups[label].totalMin += r.durationMin;
    groups[label].count++;
    groups[label].machines.add(r.machine);
  });
  const totalDowntimeMin = recs.reduce((a,r)=>a+r.durationMin,0);
  const list = Object.values(groups).map(g=>({...g, machines:[...g.machines].sort(), avgMin: g.totalMin/g.count})).sort((a,b)=>b.totalMin-a.totalMin);
  return {list, totalDowntimeMin};
}
/* Flags a downtime reason as needing priority attention based on two independent signals: it keeps recurring (count) or it's quietly eating large total time (totalMin) — either alone is worth flagging, since a short-but-frequent issue and a rare-but-long one are both real problems, just different shapes. Top-3 by total time always counts as highest priority regardless of count, since that's the biggest lever regardless of pattern. */
function downtimeSeverityFlag(item, rankIndex){
  if(rankIndex<3 || item.count>=5 || item.totalMin>=120) return {level:'critical', label:'🔴 HIGHEST PRIORITY', color:'var(--wait)'};
  if(item.count>=3 || item.totalMin>=60) return {level:'watch', label:'🟡 WATCH', color:'var(--change)'};
  return {level:'normal', label:'', color:'var(--amber)'};
}
function bottlenecks(recs, limit){
  const map = {};

    const key = effectiveReasonLabel(r) || r.status;
    map[key] = (map[key]||0)+r.durationMin;

function bottleneckNotesFor(recs, label, max){
  max = max || 2;
  const seen = new Set(); const notes = [];
  recs.filter(r=>(r.status==='WAITING'||r.status==='CHANGEOVER') && effectiveReasonLabel(r)===label && r.notes && r.notes.trim()).forEach(r=>{

    if(!seen.has(n) && notes.length<max){ seen.add(n); notes.push(n); }

}

function bottleneckCategory(recs, label){

async function syncSideBreaks(){

  if(!d) return;
  const b = variovacBreakState();
  let changed = false, msg = '';
  if(b.any && b.all && !d.breakPause){
    const runs = (d.side||[]).filter(x=>!x.end && x.start < b.start);
    const offl = (d.offline||[]).filter(x=>!x.end && x.start < b.start); // v138: Lead Hand / Yield go off the line with the break too
    if(runs.length || offl.length){
      runs.forEach(x=>{ x.end = b.start; x.breakPaused = true; closeSideWaits(x, b.start); });
      offl.forEach(x=>{ x.end = b.start; x.breakPaused = true; });
      d.breakPause = {start: b.start, ids: runs.map(x=>x.id), offIds: offl.map(x=>x.id)};
      changed = true; msg = `${[...runs.map(x=>x.machine), ...offl.map(x=>x.role)].join(', ')} paused for break`;
    }
  } else if(d.breakPause && b.any && !b.all){
    const at = breakEndAfter(d.breakPause.start), back = [];
    (d.side||[]).filter(x=>d.breakPause.ids.includes(x.id)).forEach(x=>{
      if((d.side||[]).some(y=>y.machine===x.machine && !y.end)) return; // already restarted by hand
      d.side.push({id: uid(), machine: x.machine, start: at, end: null, pack: x.pack, trim: x.trim, afterBreak: true, ...sideCarry(x)});
      back.push(x.machine);
    });
    (d.offline||[]).filter(x=>(d.breakPause.offIds||[]).includes(x.id)).forEach(x=>{
      if((d.offline||[]).some(y=>y.role===x.role && !y.end) || !roleIn(date, x.role)) return; // already back on by hand, or marked off today
      d.offline.push({id: uid(), role: x.role, start: at, end: null, afterBreak: true});
      back.push(x.role);
    });
    d.breakPause = null;
    changed = true; if(back.length) msg = `${back.join(', ')} restarted after break`;
  }
  if(!changed) return;
  sideBreakBusy = true;
  try{ const ok = await saveDayLogNow(); if(ok && msg) toast(msg); } finally { sideBreakBusy = false; }
}

function sideIntervals(date){

/* Packaging labour on side machines for a date range. packMin/trimMin are labour minutes (time × people). shortMin = minutes, while packaging staff were on side machines, that a Variovac's logged run had fewer than 2 people — taken from the staffing segments saved with each finished Live Floor run. */
function computeSideLabour(start, end){
  const days = Object.keys(Store.dayLog||{}).filter(d=>d>=start && d<=end).sort();
  const perMachine = {}; SIDE_MACHINES.forEach(m=>perMachine[m.name]={packMin:0, trimMin:0, runMin:0});
  const perDay = [];
  let shortTotal = 0;
  days.forEach(d=>{
    const log = dayLogFor(d), iv = sideIntervals(d);
    const om = offlineMinutes(d);
    const day = {date:d, crew: crewNowFor(d), crewShort: crewLabel(d,true), crewLong: crewLabel(d,false), rolesOff: OFFLINE_ROLES.filter(r=>!roleIn(d,r)), marelStart: log.marelStart, marelEnd: log.marelEnd, packMin:0, trimMin:0, byMachine:{}, shortMin:0, offMin: OFFLINE_ROLES.reduce((a,r)=>a+om[r].min,0), off: om};
    iv.forEach(s=>{
      const pm = perMachine[s.machine] || (perMachine[s.machine]={packMin:0,trimMin:0,runMin:0});
      pm.packMin += s.act*(s.pack||0); pm.trimMin += s.act*(s.trim||0); pm.runMin += s.min; pm.waitMin = (pm.waitMin||0) + s.waitMin;
      day.packMin += s.act*(s.pack||0); day.trimMin += s.act*(s.trim||0);
      day.byMachine[s.machine] = (day.byMachine[s.machine]||0) + s.act*(s.pack||0);
    });
    const packIv = mergeIntervals(iv.filter(s=>s.pack>0).map(s=>({start:s.a, end:s.b})));
    if(packIv.length){
      Store.records.filter(r=>r.date===d && LINE_NEED[r.machine] && r.plh && r.plh.segments).forEach(r=>{
        r.plh.segments.forEach(seg=>{
          if(seg.employees==null || seg.employees>=LINE_NEED[r.machine] || !seg.start || !seg.end) return;
          let a=toMin(seg.start), b=toMin(seg.end); if(b<a) b=a;

  const trimTotal = Object.values(perMachine).reduce((a,m)=>a+m.trimMin,0);
  const offTotals = {}; OFFLINE_ROLES.forEach(r=>offTotals[r]=perDay.reduce((a,d)=>a+d.off[r].min,0));
  return {perMachine, perDay, packTotal, trimTotal, shortTotal, offTotals, hasData: perDay.some(x=>x.packMin||x.trimMin||x.crew!=null||x.marelStart||x.marelEnd||x.offMin)};
}

Live keeps the machines (Variovacs, Manual Pack, MAREL, side machines). The Crew tab keeps the people. */
const STAFF_RULES_NOTE = 'Variovac needs 2 · Manual Pack 1 · side machines 1 (2 if training or priority)';
function stopWord(st, reason, cat){
  const r = (reason||'').toLowerCase(), c = (cat||'').toLowerCase();
  if(!st) return 'stopped';
  if(st.key==='BREAK') return 'break';
  if(/set ?up/.test(r)) return 'set-up';
  if(/clean|sanit/.test(r) || /clean|sanit/.test(c)) return 'cleaning';
  if(st.key==='CHANGEOVER') return 'changeover';
  if(st.key==='PLANNED') return (reason||'planned stop').toLowerCase();
  if(st.key==='NO_WORK') return 'no work';
  return 'waiting';
}
function placeWord(w){
  if(!w) return 'free';
  if(w==='Garbage run') return 'garbage';
  if(w.startsWith('Clean-up · ')) return 'clean-up';
  if(w.startsWith('Closing · ')) return w.replace('Closing · ','').toLowerCase();
  if(w.startsWith('Set-up · ')) return 'set-up';
  if(w.startsWith('Dismantle · ')) return 'dismantling';
  if(w==='Setup / Opening') return 'set-up';
  if(w==='Cleaning / Sanitation') return 'cleaning';
  if(w.startsWith('Planned · ')) return w.replace('Planned · ','').toLowerCase();
  if(w.startsWith('Other · ')) return w.replace('Other · ','');
  if(w.startsWith('Lent')) return 'lent out';
  if(w.startsWith('Not here')) return 'not here';
  return w;
}
function lineNowInfo(m){
  const l = Store.liveRuns[m]; const T = todayStr();
  if(!l || isStaleLive(l) || (l.date && l.date!==T)) return {m, active:false, names:[], label:'Not started', color:'var(--nowork)'};
  const names = liveNames(l);
  if(l.status==='RUNNING') return {m, active:true, running:true, names, label:'▶ Running', color:'var(--run)'};
  const s = lineStopNow(m), o = (l.downtimeSegments||[]).slice(-1)[0] || {};
  const word = stopWord(s.st, s.reason, o.reasonCategory);
  return {m, active:true, running:false, names, label:`⏸ ${s.reason || (s.st?s.st.label:'Stopped')}`, word, mins:s.mins, color: s.st ? s.st.color : 'var(--change)'};
}
function crewActivity(){
  const roster = crewRoster(), here = [], away = [], notPlaced = notPlacedYet ? notPlacedYet() : [];
  const groups = {}; const add = (k,n)=>{ (groups[k] = groups[k] || []).push(n); };
  roster.forEach(n=>{
    if(notPlaced.includes(n)) return;
    const w = whereOf(n);
    if(w.startsWith('Not here') || w.startsWith('Lent')){ away.push({n, w}); return; }
    here.push(n);
    if(MACHINES.includes(w)){ const li = lineNowInfo(w); if(li.running) add('on running lines', n); else add(`${li.word||'stopped'} (${shortM(w)})`, n); return; }
    if(SIDE_MACHINES.some(x=>x.name===w)){ add(`on ${w}`, n); return; }
    add(placeWord(w), n);
  });
  return {here, away, notPlaced, groups};
}

  const order = Object.keys(a.groups).sort((x,y)=>(x==='on running lines'?-1:y==='on running lines'?1:0) || (x==='free')-(y==='free'));

    const by = {}; l.forEach(e=>by[e.reason]=(by[e.reason]||0)+1); const top = Object.keys(by).sort((a,b)=>by[b]-by[a])[0]; const it = l.filter(e=>e.itAt); const avgIt = it.length ? Math.round(it.reduce((t,e)=>t+Math.max(0,toMin(e.itAt)-toMin(e.start)),0)/it.length) : null;
    return `<tr><td style="${td}font-weight:700;">${sc}</td><td style="${td}${red}">${l.length}</td><td style="${td}${red}">${chDur(l.reduce((t,e)=>t+e.min,0))}</td><td style="${td}">${chDur(Math.max(...l.map(e=>e.min)))}</td><td style="${td}">${escapeHtml(top)} (${by[top]}×)</td><td style="${td}">${avgIt!=null?`called after ${chDur(avgIt)}`:'—'}</td></tr>`; }).join('')}</table>`));
  const R = {}; all.forEach(e=>{ R[e.reason] = R[e.reason] || {n:0, m:0}; R[e.reason].n++; R[e.reason].m += e.min; });

    H.push(hd('3 · By day')); H.push(`<table style="width:100%;border-collapse:collapse;">${Object.keys(D).sort().map(dt=>`<tr><td style="${td}">${fmtDate(dt)}</td><td style="${td}text-align:right;">${D[dt].n}×</td><td style="${td}text-align:right;${red}">${chDur(D[dt].m)}</td></tr>`).join('')}</table>`); }
  H.push(hd(`${start!==end?'4':'3'} · Every incident`));
  H.push(scroll(`<table style="width:100%;border-collapse:collapse;"><tr><th style="${th}">Day</th><th style="${th}">Scale</th><th style="${th}">Down</th><th style="${th}">Problem</th><th style="${th}">Reported</th><th style="${th}">Minutes</th></tr>${all.map(e=>`<tr><td style="${td}white-space:nowrap;">${fmtDate(e.date)}</td><td style="${td}font-weight:700;">${e.scale}</td><td style="${td}white-space:nowrap;">${fmtTime12(e.start)} – ${e.end?fmtTime12(e.end):'still down'}${e.endShift?' (end of shift)':''}</td><td style="${td}">${escapeHtml(e.reason)}</td><td style="${td}">${e.itAt?`${fmtTime12(e.itAt)} (+${chDur(Math.max(0,toMin(e.itAt)-toMin(e.start)))})`:'—'}</td><td style="${td}text-align:right;${red}">${chDur(e.min)}</td></tr>`).join('')}</table>`));
  H.push(`<div style="margin-top:22px;font-size:10px;color:#888;line-height:1.5;">Logged live on the packaging floor in the CI Tracker: the time a scale / label computer stopped working, why, when it was reported to the supervisor / manager, and when it worked again. Packaging lines share the scales, so a scale down means slower weighing and labelling for every line; lines that stopped completely are also logged as Waiting — Scale Problem.</div></div>`);

function lineLiveStatus(m){
  const live = Store.liveRuns[m];
  if(!live) return {color:'var(--nowork)', label:'Idle', alarm:false, mins:null};
  if(isStaleLive(live)) return {color:'var(--wait)', label:'Open from '+fmtDate(live.date), alarm:true, mins:null, stale:true};
  if(live.status==='RUNNING') return {color:'var(--run)', label:'Running', alarm:false, mins:elapsedMinutesSince(live.startedAt)};
  const lastDt = (live.downtimeSegments||[])[live.downtimeSegments.length-1];
  const info = lastDt ? statusInfo(lastDt.status) : null;
  const alarm = !!(lastDt && !lastDt.end && (lastDt.status==='WAITING'||lastDt.status==='CHANGEOVER') && elapsedMinutesSince(lastDt.start) >= (Store.settings.downtimeAlarmMinutes||30));
  return {color: info ? info.color : 'var(--change)', label: info ? info.label : 'Downtime', reason: lastDt && lastDt.reason, alarm, mins: lastDt && !lastDt.end ? elapsedMinutesSince(lastDt.start) : null};
}
/* Lines waiting right now on an upstream department (MAREL / Trimmers / Band Saw), from the open downtime on each Live Floor run */
function linesWaitingOn(dept){
  const out = [];
  MACHINES.forEach(m=>{
    const live = Store.liveRuns[m]; if(!live || live.status==='RUNNING') return;
    const d = (live.downtimeSegments||[])[live.downtimeSegments.length-1];
    if(d && !d.end && d.status==='WAITING' && upstreamDeptFor(d.reason)===dept) out.push({m, reason:REASON_RENAMES[d.reason]||d.reason, mins:elapsedMinutesSince(d.start)});
  });
  return out;
}
/* Today's waiting minutes on a department: saved records + downtime inside runs still open on the Live Floor */
function deptWaitToday(dept){
  const today = todayStr();
  let min = Store.records.filter(r=>!r.side && r.date===today && r.status==='WAITING' && upstreamDeptFor(r.reason)===dept).reduce((a,r)=>a+(r.durationMin||0),0);
  MACHINES.forEach(m=>{ const live = Store.liveRuns[m]; if(!live || live.date!==today) return;
    (live.downtimeSegments||[]).forEach(d=>{ if(d.status==='WAITING' && upstreamDeptFor(d.reason)===dept) min += d.end ? duration(d.start,d.end) : elapsedMinutesSince(d.start); }); });
  return min;
}
function spotState(sp){
  if(sp.type==='line'){
    const st = lineLiveStatus(sp.id), cs = lineStaffNow(sp.id), need = LINE_NEED[sp.id]||0;
    const crew = cs.active ? (cs.staff==null ? '👤?' : `👤${cs.staff}`) : '';
    const crewShort = cs.active && cs.staff!=null && cs.staff<need;
    return {color: st.color, alarm: st.alarm, sub: [crew, st.mins!=null?fmtShort(st.mins):''].filter(Boolean).join(' '), subRed: crewShort || cs.staff==null && cs.active, dim: st.label==='Idle'};
  }
  if(sp.type==='side'){
    const run = openSideRuns(todayStr()).find(s=>s.machine===sp.id);
    if(!run) return {color:'var(--nowork)', dim:true, sub:''};
    return {color:'var(--amber)', sub:`👤${run.pack}${run.trim?`+${run.trim}T`:''}`};
  }
  const waiting = linesWaitingOn(sp.dept);
  if(sp.id==='MAREL'){
    const d = dayLogFor(todayStr()) || {};
    if(waiting.length) return {color:'var(--wait)', alarm:true, sub:`⚠${waiting.length}`};
    if(d.marelStart && !d.marelEnd) return {color:'var(--run)', sub:'cutting'}; // v116: green = working (blue now means Break)
    if(d.marelEnd) return {color:'var(--nowork)', dim:true, sub:'done'};
    return {color:'var(--nowork)', dim:true, sub:''};
  }
  if(waiting.length) return {color:'var(--wait)', alarm:true, sub:`⚠${waiting.length}`};
  return {color:'var(--nowork)', dim:true, sub:''};
}

function nowHHMM(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
/* ---- PLH Reporting (aggregates the structured plh data attached to finished Live Entry runs) ---- */
/* v157: kind 'lines' (default — Variovacs + Manual Pack, same as before) or 'side' (side-machine jobs: sealing + packing) */
const plhKindOk = (r, kind)=> (kind==='side') ? !!r.side : !r.side;
function plhRecordsInRange(startDate, endDate, kind){
  return Store.records.filter(r=>r.plh && r.plh.grossPLH!=null && r.date>=startDate && r.date<=endDate && plhKindOk(r, kind));
}
/* Live Entry runs that finished without Quantity/Weight entered — still have full staffing/timing detail preserved, just missing the numbers needed to compute PLH */
function incompletePLHRecordsInRange(startDate, endDate, kind){
  return Store.records.filter(r=>r.plh && r.plh.grossPLH==null && r.date>=startDate && r.date<=endDate && plhKindOk(r, kind));
}
/* v99: Same product run in several pieces on the same machine on the same day (e.g. stopped waiting for strogi/trim, then restarted) is ONE job. Runs are combined by date + machine + product (product ID if set, otherwise the product name). Combined PLH = total lbs ÷ total labour hours across all its runs — never an average of the runs' PLH, so a short run can't skew it. Each run is still kept (job.runs) so its time window and staffing stay visible. Single runs pass through unchanged. */
function plhJobKey(r){
  const pid = String((r.plh && r.plh.productId) || '').trim().toLowerCase();
  const pname = String((r.plh && r.plh.product) || r.product || '').trim().toLowerCase();
  return `${r.date}|${r.machine}|${pid || pname}`;
}
function groupPLHJobs(recs){
  const groups = {};
  recs.slice().sort((a,b)=> a.date.localeCompare(b.date) || toMin(a.startTime)-toMin(b.startTime)).forEach(r=>{
    (groups[plhJobKey(r)] = groups[plhJobKey(r)] || []).push(r);
  });
  return Object.values(groups).map(runs=>{
    if(runs.length===1) return {...runs[0], runs, ids:[runs[0].id]};
    const first = runs[0];
    const weightLbs = runs.reduce((a,r)=>a+(r.plh.weightLbs||0),0);
    const quantity = runs.reduce((a,r)=>a+(r.plh.quantity||0),0);
    const grossLaborHours = runs.reduce((a,r)=>a+(r.plh.grossLaborHours||0),0);
    const netLaborHours = runs.reduce((a,r)=>a+(r.plh.netLaborHours||0),0);
    const tgt = runs.find(r=>r.plh.targetPLH);
    return {
      ...first, runs, ids: runs.map(r=>r.id),
      endTime: runs[runs.length-1].endTime,
      plh: {
        ...first.plh, weightLbs, quantity, grossLaborHours, netLaborHours,
        grossPLH: grossLaborHours>0 ? weightLbs/grossLaborHours : 0,
        netPLH: netLaborHours>0 ? weightLbs/netLaborHours : null,
        targetPLH: tgt ? tgt.plh.targetPLH : null,
        segments: runs.flatMap((r,ri)=>(r.plh.segments||[]).map(seg=>({...seg, run:ri+1}))),
        downtimeSegments: runs.flatMap((r,ri)=>(r.plh.downtimeSegments||[]).map(d=>({...d, run:ri+1})))
      }
    };
  });
}
function computePLHSummary(recs){
  const totalWeight = recs.reduce((a,r)=>a+(r.plh.weightLbs||0),0);
  const totalQty = recs.reduce((a,r)=>a+(r.plh.quantity||0),0);
  const totalGrossHours = recs.reduce((a,r)=>a+(r.plh.grossLaborHours||0),0);
  const totalNetHours = recs.reduce((a,r)=>a+(r.plh.netLaborHours||0),0);
  const grossPLH = totalGrossHours>0 ? totalWeight/totalGrossHours : 0;
  const netPLH = totalNetHours>0 ? totalWeight/totalNetHours : 0;
  const jobs = groupPLHJobs(recs);
  let best=null, worst=null;
  jobs.forEach(r=>{ if(!best || r.plh.grossPLH>best.plh.grossPLH) best=r; if(!worst || r.plh.grossPLH<worst.plh.grossPLH) worst=r; });
  const withTarget = jobs.filter(r=>r.plh.targetPLH);
  const avgTarget = withTarget.length ? withTarget.reduce((a,r)=>a+r.plh.targetPLH,0)/withTarget.length : null;
  return {totalWeight, totalQty, totalGrossHours, totalNetHours, grossPLH, netPLH, best, worst, avgTarget, runCount:jobs.length, rawRunCount:recs.length}; // runCount = jobs (same product combined)
}

    ${summary.best ? `<div class="statrow"><span class="lbl">Best Product</span><span class="val" style="color:var(--run);font-size:12px;">${escapeHtml(summary.best.plh.product||summary.best.product||'')} — ${summary.best.plh.grossPLH.toFixed(0)} PLH</span></div>` : ''}

  </div>`;
}
function dailyPLHSeries(startDate, endDate){

function renderPLHTrendChart(series){

  const maxVal = Math.max(1, ...series.map(d=>d.plh));
  const n=series.length, barGap=4;

    const h=(d.plh/maxVal)*chartH;
    const y=padT+(chartH-h);
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(1,h).toFixed(1)}" rx="2" fill="var(--brk)"><title>${fmtDate(d.date)}: ${d.plh.toFixed(0)} PLH</title></rect>`;

    }
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;">

}

/* Shared HTML→PDF builder for the PLH and Upstream Impact reports.
v92 fixes (found from a real iPhone export):
 1. Blank space above the header + content cut mid-card: html2canvas captures relative to the page's CURRENT scroll position, so exporting after scrolling down (the Export button sits at the bottom of a long view) shifted the whole report down the page and threw off the page breaks. Fix: scroll to the top first and pass scrollX/scrollY 0, then restore the user's scroll.
 2. White strip down the right side: a Letter page is 816px wide in html2pdf's layout, but the reports were 720px — so they never filled the page. Fix: the report is widened to the page width.
 3. Content touching the paper edge on page 2+: a 20pt top/bottom page margin on every page. */
const PDF_PAGE_WIDTH_PX = 816;
async function buildHtmlReportPDF(html, filename){
  const savedScroll = window.scrollY;
  window.scrollTo(0, 0);
  const backdrop = document.createElement('div');
  backdrop.style.cssText = 'position:fixed;inset:0;z-index:99997;background:#111;display:block;overflow:auto;padding:30px 0;'; // v93: report pinned to the LEFT edge (was centred). On a wide screen (MacBook) centring put it ~300px from the left, but html2canvas re-draws the page at the report's own 816px width (where it sits at x=0) while still cropping from the original ~300px offset, so the PDF came out shifted left with a blank strip on the right. Phones never showed it because their screen is narrower than the report, so it already started at x=0.
  const banner = document.createElement('div');
  banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#1e3a5f;color:#fff;text-align:center;padding:10px;font-family:Arial;font-size:13px;';
  banner.textContent = 'Building your PDF report…';
  const container = document.createElement('div');
  container.innerHTML = html;
  const reportEl = container.firstElementChild;
  reportEl.style.width = PDF_PAGE_WIDTH_PX + 'px';
  reportEl.style.boxSizing = 'border-box';
  backdrop.appendChild(container);
  document.body.appendChild(backdrop);
  document.body.appendChild(banner);
  toast('Building PDF…');
  try{
    const pdfBlob = await html2pdf().set({
      margin: [20, 0, 20, 0],
      filename,
      html2canvas: {scale:2, useCORS:true, scrollX:0, scrollY:0, windowWidth: Math.max(window.innerWidth, PDF_PAGE_WIDTH_PX)}, // v94: html2pdf centres its own capture box in the window (margin:auto). On a wide screen (MacBook) that box sits ~300px from the left; forcing the snapshot window to 816px moved it to 0 while the crop still started at ~300px, so the PDF came out shifted left. The snapshot window must match the real window when it's wider than the page; phones (narrower) still use 816px, which already worked.
      jsPDF: {unit:'pt', format:'letter', orientation:'portrait'},
      pagebreak: {mode:['css','avoid-all']}
    }).from(reportEl).outputPdf('blob');
    showPLHReportPreview(pdfBlob, filename);
  }catch(e){
    console.error('PDF export failed', e);
    toast('PDF export failed');
  }finally{
    backdrop.remove(); banner.remove();
    window.scrollTo(0, savedScroll);
  }
}

/* Safari (iOS and macOS alike) is unreliable at rendering a PDF purely from an in-memory blob: URL, whether embedded in an iframe or opened directly in a new tab — confirmed blank on both approaches, on both devices, even with pop-ups explicitly allowed. The one thing that's always been reliable is a real file: triggering an actual download, so Preview.app / the Files app / the iOS share sheet are handling a genuine saved PDF rather than a transient in-browser reference. */
function showPLHReportPreview(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename || 'PLH-Report.pdf';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
  toast('PDF saved — open it from Downloads (Mac) or your Files app (iPhone)');
}

  };

  const machineOrder = [...MACHINES, ...[...new Set(recs.map(r=>r.machine))].filter(m=>!MACHINES.includes(m)).sort()];
  const lines = [headers.join(',')];
  machineOrder.forEach(m=>{
    const machineRecs = recs.filter(r=>r.machine===m).sort((a,b)=> a.date===b.date ? toMin(a.startTime)-toMin(b.startTime) : a.date.localeCompare(b.date));

async function quickMetalDetector(m){

/* ============ v154: ONE-TAP BREAK (all lines) ============
☕ Start Break puts every line on the Live Floor on Break at the same minute. Each line remembers what it was doing

function breakAllCandidates(){
  return MACHINES.filter(m=>{ const l = Store.liveRuns[m]; if(!l || isStaleLive(l)) return false;
    const o = (l.downtimeSegments||[])[l.downtimeSegments.length-1];

}
function openBreakAll(){

async function startBreakAll(){

      if(live.status==='RUNNING'){ const ls = live.segments[live.segments.length-1]; if(ls && !ls.end) ls.end = now; }
      else { const o = live.downtimeSegments[live.downtimeSegments.length-1];
        if(o && !o.end){ o.end = now; resumeTo = {status:o.status, reasonCategory:o.reasonCategory||'', reason:o.reason||'', classification:o.classification||''};
          if(o.resumeTo) resumeTo.resumeTo = o.resumeTo; if(o.group) resumeTo.group = o.group; } }

async function endBreakAll(){

async function startAllLineStop(){
  if(allLineBusy) return;
  const a = allLineSetup;
  if(!a.machines.length){ toast('Check at least one line, or tick the people'); return; }
  const reason = a.reason==='Other' ? (a.other.trim()||'Other') : a.reason;
  allLineBusy = true;
  try{
    const now = nowHHMM(), gid = uid();
    a.machines.forEach(m=>{
      let live = Store.liveRuns[m];
      if(!live){
        live = Store.liveRuns[m] = {machine:m, status:'DOWNTIME', product:'', productId:'', date: todayStr(), startedAt: now, employees:0, segments:[], downtimeSegments:[]};
      } else if(live.status==='RUNNING'){
        const lastSeg = live.segments[live.segments.length-1];
        if(lastSeg && !lastSeg.end) lastSeg.end = now;
      }
      let resumeTo = null;
      if(live.status!=='RUNNING'){
        // Line was already stopped (e.g. Waiting for Trimmed Meat): remember that reason so Resume All puts it back, instead of wrongly marking it Running
        const lastDt = live.downtimeSegments[live.downtimeSegments.length-1];
        if(lastDt && !lastDt.end){ lastDt.end = now; resumeTo = {status:lastDt.status, reasonCategory:lastDt.reasonCategory||'', reason:lastDt.reason||'', classification:lastDt.classification||''}; }
      }
      live.downtimeSegments.push({start: now, end:null, status:'PLANNED', reasonCategory:'Planned Stop', reason, classification:'', notes:'', group: gid, resumeTo});
      live.status = 'DOWNTIME';
    });
    if(liveDowntimeSetup && a.machines.includes(liveDowntimeSetup.machine)) liveDowntimeSetup = null;
    const ok = await Store.saveLiveRuns();
    if(!ok){ toast('Save failed — check connection'); return; }
    allLineSetup = null;
    toast(`${reason} — ${a.machines.length} line${a.machines.length===1?'':'s'} stopped`);
    render();
  } finally { allLineBusy = false; }
}
/* Open all-line stops, grouped by their shared id — only lines still sitting in that same planned segment count. */
function openAllLineStops(){
  const groups = {};
  MACHINES.forEach(m=>{
    const live = Store.liveRuns[m];
    if(!live || live.status==='RUNNING') return;
    const lastDt = (live.downtimeSegments||[])[live.downtimeSegments.length-1];
    if(!lastDt || lastDt.end || lastDt.status!=='PLANNED' || !lastDt.group) return;
    const g = groups[lastDt.group] || (groups[lastDt.group] = {id:lastDt.group, reason:lastDt.reason, start:lastDt.start, machines:[]});
    g.machines.push(m);
  });
  return Object.values(groups);
}
function renderAllLineBanners(){

    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">

async function resumeAllLineStop(gid){
  if(allLineBusy) return;
  const g = openAllLineStops().find(x=>x.id===gid);
  if(!g) return;
  allLineBusy = true;
  try{
    const now = nowHHMM();
    let resumed = 0, ended = 0, restored = 0;
    for(const m of g.machines){
      const live = Store.liveRuns[m];
      const plannedDt = live.downtimeSegments[live.downtimeSegments.length-1];
      if(plannedDt.resumeTo){
        // Line was stopped for another reason before the event — go back to that same reason, still stopped
        plannedDt.end = now;
        live.downtimeSegments.push({start: now, end:null, ...plannedDt.resumeTo, notes:''});
        restored++;
      } else if(live.segments.length){
        // Line was producing before the event — close the planned segment and carry on producing
        const lastDt = live.downtimeSegments[live.downtimeSegments.length-1];
        lastDt.end = now;
        const lastSeg = live.segments[live.segments.length-1];
        const emp = (live.pendingEmployees!=null) ? live.pendingEmployees : lastSeg.employees;
        live.segments.push({start: now, end:null, employees: emp, ...nextNamesOf(live)}); delete live.pendingNames;
        delete live.pendingEmployees;
        live.status = 'RUNNING';
        resumed++;
      } else {
        // Line had no production run (idle before the event) — save the planned stop to History and clear the line
        const result = await closeOutLiveRun(m, {});
        if(!result){ toast('Save failed — check connection'); return; }
        delete Store.liveRuns[m];
        ended++;
      }
    }
    const ok = await Store.saveLiveRuns();
    if(!ok){ toast('Save failed — check connection'); return; }
    toast(`${g.reason} ended — ${resumed} resumed${restored?`, ${restored} back to previous reason`:''}${ended?`, ${ended} saved`:''}`);
    render();
  } finally { allLineBusy = false; }
}

/* Scans the whole library for entries that share the same ID or the same name (trimmed, case-insensitive) — catches the common real-world case of a product saved twice with slightly different capitalization or spacing that an exact-match check would miss */
function findDuplicateProductGroups(){
  const byId = {}; const byName = {};
  Store.productLibrary.forEach((item,i)=>{
    const idKey = (item.id||'').trim().toLowerCase();
    const nameKey = (item.name||'').trim().toLowerCase();
    if(idKey){ (byId[idKey]=byId[idKey]||[]).push(i); }
    if(nameKey){ (byName[nameKey]=byName[nameKey]||[]).push(i); }
  });
  const dupeIdxSet = new Set();
  const groups = [];
  Object.values(byId).forEach(idxs=>{ if(idxs.length>1){ groups.push({type:'Same ID', idxs}); idxs.forEach(i=>dupeIdxSet.add(i)); } });
  Object.values(byName).forEach(idxs=>{ if(idxs.length>1){ groups.push({type:'Same Name', idxs}); idxs.forEach(i=>dupeIdxSet.add(i)); } });
  return {groups, dupeIdxSet};
}

async function confirmStartRun(){

  const nm = namesOn() ? {names: s.names.slice()} : {};
  const existing = Store.liveRuns[s.machine];
  if(existing && existing.segments.length===0){
    // Machine was logging a standalone downtime (started idle, no production yet) — close that downtime out right as production begins, keep it on record, and start the first running segment without losing anything already logged
    const lastDt = existing.downtimeSegments[existing.downtimeSegments.length-1];

    existing.status = 'RUNNING';

const PAID_BREAK_MIN = 30;
function runLabourMinutes(segments, downtimeSegments, paidLeft, extraGross){
  if(paidLeft==null) paidLeft = PAID_BREAK_MIN;

function recalcLiveRunRecord(rec, newStart, newEnd){

/* Breaks are always 30 minutes — auto-fill End Time from Start Time so it doesn't need to be scrolled separately. Doesn't touch other statuses since their durations vary. */
function onStartTimeChanged(){
  if(draft.status!=='BREAK' || !draft.startTime) return;
  let mins = toMin(draft.startTime) + 30;
  if(mins>=1440) mins -= 1440;
  const h = String(Math.floor(mins/60)).padStart(2,'0');
  const m = String(mins%60).padStart(2,'0');
  draft.endTime = `${h}:${m}`;
  const endInput = document.getElementById('endTimeInput');
  if(endInput) endInput.value = draft.endTime;
}
function rangesOverlap(aStart,aEnd,bStart,bEnd){ return aStart < bEnd && bStart < aEnd; }
/* Warns if a record about to be saved overlaps an existing entry for the same machine/date — catches accidental double-logging before it skews a report. Returns true to proceed, false to cancel. */
/* v116: a Live Floor run only occupies its running segments — its own stops sit in the gaps, so they are not overlaps */
function busySpans(r){
  if(r.status==='RUNNING' && r.plh && Array.isArray(r.plh.segments) && r.plh.segments.length) return r.plh.segments.map(sg=>[toMin(sg.start), toMin(sg.end)]);
  return [[toMin(r.startTime), toMin(r.endTime)]];
}
function confirmNoOverlap(newRecords, excludeId){
  const conflicts = [];
  newRecords.forEach(nr=>{
    Store.records.filter(r=>r.machine===nr.machine && r.date===nr.date && r.id!==excludeId).forEach(r=>{
      if(busySpans(nr).some(([a,b])=>busySpans(r).some(([c,d])=>rangesOverlap(a,b,c,d)))){
        conflicts.push(`${nr.machine}: ${fmtTime12(nr.startTime)}–${fmtTime12(nr.endTime)} overlaps existing ${statusInfo(r.status).label} (${fmtTime12(r.startTime)}–${fmtTime12(r.endTime)})`);
      }
    });
  });
  if(!conflicts.length) return true;
  return confirm(`This overlaps with an existing entry:\n\n${conflicts.join('\n')}\n\nSave anyway?`);
}
let isSaving = false;
/* Re-reads the actual on-screen time values right before saving — some desktop browsers don't reliably fire the input event per keystroke on segmented time fields, so trusting only the stored draft can miss a value that's visibly filled in */
function syncTimeFieldsFromDOM(){
  const startEl = document.getElementById('startTimeInput');
  const endEl = document.getElementById('endTimeInput');
  if(startEl && startEl.value) draft.startTime = startEl.value;

async function saveRecord(){

  syncTimeFieldsFromDOM();
  if(!draft.startTime || !draft.endTime){ toast('Set start and end time'); return; }
  const dur = duration(draft.startTime, draft.endTime);
  if(dur<=0){ toast('End time must be after start'); return; }
  if(draft.status==='BREAK' && draft.breakMachines.length===0){ toast('Select which machine(s) this break applies to'); return; }
  isSaving = true;
  const btn = document.getElementById('saveRecordBtn');
  if(btn){ btn.disabled = true; btn.style.opacity = '0.6'; btn.textContent = 'Saving…'; }

    return await _saveRecordInner();

}
async function _saveRecordInner(){
  const dur = duration(draft.startTime, draft.endTime);
  const base = {
    date: draft.date || todayStr(), startTime: draft.startTime, endTime: draft.endTime, durationMin: dur,
    status: draft.status, notes: draft.notes||'', createdAt: Date.now()
  };
  let toSave = [];
  if(draft.status==='BREAK'){
    const machines = draft.breakMachines;
    machines.forEach(m=>{ toSave.push({...base, id:uid(), machine:m, product:'', reasonCategory:'', reason:'', classification:''}); });
  } else {
    const product = draft.product==='Other' ? (draft.productOther||'Other') : draft.product;
    let reasonCategory='', reason='', classification='';
    if(draft.status==='CHANGEOVER'){ reason = draft.changeReason==='Other' ? (draft.changeReasonOther||'Other') : draft.changeReason; }
    if(draft.status==='PLANNED'){ reasonCategory = 'Planned Stop'; reason = draft.plannedReason==='Other' ? (draft.plannedReasonOther||'Other') : draft.plannedReason; }
    if(draft.status==='WAITING'){ reasonCategory = draft.waitCategory; const wr = draft.waitReason || reasonsForMachine(draft.waitCategory, draft.machine)[0]; reason = wr==='Other' ? (draft.waitReasonOther||'Other') : wr; classification = reasonClassification(draft.waitCategory); }
    toSave.push({...base, id:uid(), machine:draft.machine, product, reasonCategory, reason, classification});
  }
  if(!confirmNoOverlap(toSave)) return;
  await Store.refreshRecords();
  Store.records = Store.records.concat(toSave);
  const ok = await Store.saveRecords();
  if(!ok){ toast('Save failed — storage unavailable'); return; }
  const savedDate = base.date;
  const isToday = savedDate===todayStr();
  lastEndTime = draft.endTime;
  toast(isToday ? 'Record Saved' : `Record Saved to ${fmtDate(savedDate)}`);
  draft = freshDraft();
  if(isToday){
    histFilters = {date: savedDate, machine:'', product:'', status:'', category:''};
    Router.go('history'); // v182: back to History, where the record now shows
  } else {
    histFilters = {date: savedDate, machine:'', product:'', status:'', category:''};
    Router.go('history');
  }
}

/* v187: SIDE-MACHINE HISTORY — view-only cards built from what was tapped on Live (dayLog.side + where log):
set-up, each pause/wait, break pause, dismantle, clean. Head counts only — names stay in Crew Hours.
They are NOT records: Downtime / Efficiency / Upstream / CSV totals never see them, so nothing is counted twice. */
const SIDE_NAMES = SIDE_MACHINES.map(x=>x.name);
function sideHistoryItems(dates){
  const out = [], hh = v=>String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0');
  dates.forEach(date=>{
    const d = dayLogFor(date); if(!d) return;
    const jobs = Store.records.filter(r=>r.side && r.date===date);
    const jobFor = (m, start, kind)=>{ const js = jobs.filter(r=>r.machine===m); if(!js.length) return null; const t = toMin(start);
      if(kind==='before'){ const a = js.filter(r=>toMin(r.startTime)>=t).sort((x,y)=>toMin(x.startTime)-toMin(y.startTime)); if(a.length) return a[0]; }
      if(kind==='after'){ const a = js.filter(r=>toMin(r.endTime)<=t+1).sort((x,y)=>toMin(y.endTime)-toMin(x.endTime)); if(a.length) return a[0]; }
      return js.find(r=>toMin(r.startTime)<=t && t<=toMin(r.endTime)) || js[0]; };
    const order = (job, start, above)=> job ? job.createdAt + (above ? 0.5 : -0.5 + (1440-toMin(start))/4000) : Date.parse(date+'T'+start+':00') || 0;
    const es = (d.side||[]).slice().sort((a,b)=>toMin(a.start)-toMin(b.start));
    es.forEach((e,i)=>{
      (e.waits||[]).forEach((w,k)=>{ const b = w.end || e.end; if(!b) return; const mn = Math.max(0, toMin(b)-toMin(w.start)); if(!mn) return;
        const job = jobFor(e.machine, w.start);
        out.push({syn:true, id:'shw-'+e.id+'-'+k, date, machine:e.machine, status:'WAITING', label:'Paused', reason: REASON_RENAMES[w.reason]||w.reason, start:w.start, end:b, min:mn, people:(e.names||[]).length || (e.pack||0), createdAt: order(job, w.start)}); });
      const nx = es.slice(i+1).find(x=>(x.jobId||x.id)===(e.jobId||e.id));
      if(e.breakPaused && e.end && nx && toMin(nx.start)>toMin(e.end)){ const job = jobFor(e.machine, e.end);
        out.push({syn:true, id:'shb-'+e.id, date, machine:e.machine, status:'BREAK', label:'Break pause', reason:'Break', start:e.end, end:nx.start, min:toMin(nx.start)-toMin(e.end), people:0, createdAt: order(job, e.end)}); }
    });
    let pd = null; try{ pd = personDay(date); }catch(err){ pd = null; }
    if(pd){
      const groups = {};
      pd.people.forEach(p=>p.segs.forEach(sg=>{ const m = /^(Set-up|Dismantle|Clean-up) · (.+)$/.exec(sg.w||''); if(!m || !SIDE_NAMES.includes(m[2]) || sg.b<=sg.a) return; (groups[sg.w] = groups[sg.w] || []).push({a:sg.a, b:sg.b, n:p.name}); }));
      Object.keys(groups).forEach(w=>{
        const [kind, m] = w.split(' · '), list = groups[w].sort((x,y)=>x.a-y.a), cl = [];
        list.forEach(x=>{ const c = cl[cl.length-1]; if(c && x.a <= c.b+5){ c.b = Math.max(c.b, x.b); c.names.add(x.n); c.pm += x.b-x.a; } else cl.push({a:x.a, b:x.b, names:new Set([x.n]), pm:x.b-x.a}); });
        cl.forEach((c,k)=>{ const st = hh(c.a), job = jobFor(m, st, kind==='Set-up'?'before':'after');
          out.push({syn:true, id:'shp-'+w+'-'+k, date, machine:m, status: kind==='Set-up' ? 'CHANGEOVER' : 'PLANNED', label: kind==='Set-up' ? '🔧 Set-up' : kind==='Dismantle' ? '🔩 '+disLabel(m) : '🧽 Clean-up', reason:'',
            start:st, end:hh(c.b), min:c.b-c.a, people:c.names.size, pm:c.pm, createdAt: order(job, st, kind==='Set-up')}); });
      });
    }
  });
  return out;
}

saveRecord = async function(){
  if(isSaving) return;
  syncTimeFieldsFromDOM();

    if(!draft.startTime || !draft.endTime){ toast('Set start and end time'); return; }

    try{
      await Store.refreshRecords();
      const idx = Store.records.findIndex(r=>r.id===draft._editId);
      if(idx>-1){
        const product = draft.product==='Other' ? (draft.productOther||'Other') : draft.product;
        let reasonCategory='', reason='', classification='';
        if(draft.status==='CHANGEOVER'){ reason = draft.changeReason==='Other' ? (draft.changeReasonOther||'Other') : draft.changeReason; }
        if(draft.status==='PLANNED'){ reasonCategory = 'Planned Stop'; reason = draft.plannedReason==='Other' ? (draft.plannedReasonOther||'Other') : draft.plannedReason; }
        if(draft.status==='WAITING'){ reasonCategory = draft.waitCategory; const wr = draft.waitReason || reasonsForMachine(draft.waitCategory, draft.machine)[0]; reason = wr==='Other' ? (draft.waitReasonOther||'Other') : wr; classification = reasonClassification(draft.waitCategory); }
        const old = Store.records[idx];
        let upd = {...old, date: draft.date||todayStr(), machine:draft.machine, product, startTime:draft.startTime, endTime:draft.endTime, durationMin:dur, status:draft.status, reasonCategory, reason, classification, notes:draft.notes};
        const isLiveRun = old.status==='RUNNING' && old.plh && Array.isArray(old.plh.segments) && old.plh.segments.length;
        if(isLiveRun && draft.status==='RUNNING'){
          // v116: a Live Floor run keeps its real running minutes (its stops are separate records). If its start/finish changed, trim/stretch its segments and recalculate labour + PLH.
          const timesChanged = draft.startTime!==old.startTime || draft.endTime!==old.endTime;
          const plh = {...old.plh};
          if(product!==old.product){ plh.product = product; plh.productId = ''; plh.targetPLH = null; }
          upd.plh = plh; upd.durationMin = old.durationMin;
          if(timesChanged){
            const rc = recalcLiveRunRecord({...old, plh}, draft.startTime, draft.endTime);
            if(rc.durationMin<=0){ toast('No running time left in that window'); return; }
            upd = {...upd, plh: rc.plh, durationMin: rc.durationMin, startTime: rc.startTime, endTime: rc.endTime};

        } else if(isLiveRun && draft.status!=='RUNNING'){
          delete upd.plh; // no longer a production run, so it must not feed PLH
        }
        if(!confirmNoOverlap([upd], draft._editId)) return;
        Store.records[idx] = upd;
        await Store.saveRecords();
        toast('Record Updated');
      }
      draft = freshDraft();
      Router.go('history');
    } finally {
      isSaving = false;
    }
    return;
  }
  return _origSave();
};

/* Weekly version of the suggestion engine — factors in the upstream/internal split and secondary bottleneck across the whole range, not just one day's top reason */
function craftWeeklySuggestions(rep){
  if(!rep.bottlenecks.length){
    return ['No bottleneck data recorded in this range yet — log entries daily so patterns can surface here.'];
  }
  const ideas = [];
  const [topName, topMin] = rep.bottlenecks[0];
  const topCategory = (rep.bottleneckMeta && rep.bottleneckMeta[topName]) || categoryForReason(topName);
  ideas.push(`Run a root-cause (5-Whys) session on "${topName}" — it was the biggest single driver this period at ${fmtDur(topMin)} across ${rep.daysWithData} day(s) with data.`);

  const t = rep.totals;
  const totalDelay = t.upstream + t.internal;
  if(totalDelay>0){
    const upstreamShare = t.upstream/totalDelay;
    if(upstreamShare >= 0.6){
      ideas.push(`Upstream delays are driving most of this period's downtime (${Math.round(upstreamShare*100)}%) — consider a small in-process buffer or batch-sequencing with the upstream station so packaging isn't stalled directly by its switchovers.`);
    } else if(upstreamShare <= 0.4){
      ideas.push(topCategory && CATEGORY_ACTIONS[topCategory] ? CATEGORY_ACTIONS[topCategory] : 'Standardize the top recurring task with a visual checklist so deviations are caught immediately rather than after the fact.');
    } else {
      ideas.push('Delay is fairly evenly split between upstream and packaging this period — worth reviewing both sides together rather than assuming one is the sole cause.');
    }
  }

  if(rep.bottlenecks.length>1){
    const [name2,min2] = rep.bottlenecks[1];
    ideas.push(`"${name2}" was the second-largest driver at ${fmtDur(min2)} — track whether it's a separate issue or connected to the top one before committing resources to just one fix.`);
  } else if(rep.machineMostAffected.machine && rep.machineMostAffected.minutes>0){
    ideas.push(`${rep.machineMostAffected.machine} carried the most downtime this period (${fmtDur(rep.machineMostAffected.minutes)}) — review its staffing and scheduling pattern for recurring gaps.`);
  }
  return ideas.slice(0,3);
}

/* Renders a simple SVG bar chart of daily Waiting minutes so a trend (e.g. a fix taking effect) is visible at a glance instead of scanning numbers */
function renderTrendChart(dayTrend){
  if(!dayTrend.length) return '<div class="empty">No data in this range yet.</div>';
  const W = 340, H = 130, padL = 4, padR = 4, padB = 22, padT = 10;
  const chartW = W - padL - padR, chartH = H - padT - padB;
  const maxVal = Math.max(1, ...dayTrend.map(d=>d.waiting));
  const n = dayTrend.length;
  const barGap = 4;
  const barW = Math.max(3, (chartW - barGap*(n-1)) / n);
  let bars = '';
  let labels = '';
  const labelEvery = n>14 ? Math.ceil(n/7) : (n>7 ? 2 : 1);
  dayTrend.forEach((d,i)=>{
    const x = padL + i*(barW+barGap);
    const h = (d.waiting/maxVal)*chartH;
    const y = padT + (chartH-h);
    const color = d.waiting===maxVal && maxVal>0 ? 'var(--wait)' : 'var(--amber)';
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(1,h).toFixed(1)}" rx="2" fill="${color}"><title>${fmtDate(d.date)}: ${fmtDur(d.waiting)}</title></rect>`;
    if(i % labelEvery === 0 || i===n-1){
      const dLabel = new Date(d.date+'T00:00:00').toLocaleDateString('en-US',{month:'numeric',day:'numeric'});
      labels += `<text x="${(x+barW/2).toFixed(1)}" y="${H-6}" font-size="8" fill="var(--muted2)" text-anchor="middle" font-family="IBM Plex Mono">${dLabel}</text>`;
    }
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;">
    <line x1="${padL}" y1="${padT+chartH}" x2="${W-padR}" y2="${padT+chartH}" stroke="var(--line)" stroke-width="1"/>
    ${bars}${labels}
  </svg>
  <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px;"><span>Daily Waiting/Downtime (min)</span><span>Peak: ${fmtDur(maxVal)}</span></div>`;
}

async function deleteRangeRecords(){
  const count = recordsInRange(weeklyRange.start, weeklyRange.end).length;
  const dayKeys = Object.keys(Store.dayLog||{}).filter(d=>d>=weeklyRange.start && d<=weeklyRange.end);
  if(count===0 && !dayKeys.length){ toast('No records in this range to delete'); return; }
  const label = weeklyRange.start===weeklyRange.end ? fmtDate(weeklyRange.start) : `${fmtDate(weeklyRange.start)} – ${fmtDate(weeklyRange.end)}`;
  if(!confirm(`Delete all ${count} record(s) from ${label}? This also removes any saved Daily Reports${dayKeys.length?` and Crew Board entries (crew, MAREL, side machines, lead hand / yield) for ${dayKeys.length} day${dayKeys.length===1?'':'s'}`:''} in that range. This cannot be undone.`)) return;

  await Store.refreshRecords();
  Store.records = Store.records.filter(r=> !(r.date>=weeklyRange.start && r.date<=weeklyRange.end));
  Store.dailyReports = Store.dailyReports.filter(r=> !(r.date>=weeklyRange.start && r.date<=weeklyRange.end));

  await Store.saveDailyReports();
  if(dayKeys.length){ dayKeys.forEach(k=>delete Store.dayLog[k]); await Store.saveDayLog(); }
  toast(`Deleted ${count} record(s)${dayKeys.length?` + Crew Board entries for ${dayKeys.length} day${dayKeys.length===1?'':'s'}`:''}`);
  render();
}

async function closeAllOpenForEndShift(){
  const o = endShiftOpenItems();
  if(!o.n) return true;
  // 1) Variovac / line live runs → records (today: now, capped 4:30 PM; older day: 4:30 PM on that day)
  for(const m of o.runs){
    const l = Store.liveRuns[m]; if(!l) continue;
    const at = isStaleLive(l) ? (toMin(staleLatestStart(l)) > SHIFT_END_MIN ? staleLatestStart(l) : '16:30') : openEndToday(staleLatestStart(l)||l.startedAt||'00:00');
    const r = await closeOutLiveRun(m, {endAt: at});
    if(!r) return false;
    delete Store.liveRuns[m];
  }
  if(o.runs.length && !(await Store.saveLiveRuns())) return false;
  // 2) side machines and Lead Hand / Yield
  const d = dayLogFor(todayStr());
  if(d){
    o.side.forEach(x=>{ x.end = openEndToday(x.start); closeSideWaits(x, x.end); });
    o.offl.forEach(x=>{ x.end = openEndToday(x.start); });
    (d.garbage||[]).forEach(x=>{ if(!x.end) x.end = openEndToday(x.start); });
    d.breakPause = null; // nothing restarts after End Shift
    (d.side||[]).forEach(x=>{ if(!x.jobId) x.jobId = x.id; });
    if(!(await Store.saveDayLog())) return false;
    await saveLooseSideJobs(todayStr()); // v157: side-machine jobs closed here are saved for PLH (weight can be added in History)
  }
  return true;
}

function craftSuggestions(rep){

    return ['No bottleneck data recorded yet — log waiting and changeover reasons on the floor tomorrow so patterns can surface here.'];

  const [reasonName, minutes] = rep.bottlenecks[0];
  const category = (rep.bottleneckMeta && rep.bottleneckMeta[reasonName]) || categoryForReason(reasonName);
  const cls = reasonClassification(category);
  const ideas = [];
  ideas.push(`Run a 5-Whys session on "${reasonName}" with the ${cls==='upstream' && category!=='Changeover' ? 'upstream production' : 'packaging'} team to find the root cause behind today's ${fmtDur(minutes)}.`);
  ideas.push(category && CATEGORY_ACTIONS[category] ? CATEGORY_ACTIONS[category] : 'Document the standard sequence for this task and confirm the operator followed it — deviations often hide the real cause.');
  if(rep.machineMostAffected.machine && rep.machineMostAffected.minutes>0){

function plhHeadline(date){
  const x = computePLHSummary(plhRecordsInRange(date, date));

    main: `PLH today: ${x.grossPLH.toFixed(1)} lbs/hr gross · ${x.netPLH.toFixed(1)} net · ${Math.round(x.totalWeight).toLocaleString('en-US')} lbs · ${x.runCount} job${x.runCount===1?'':'s'}.`,
    note: 'Full breakdown in the attached PLH report.'
  };
}

Machine with Most Downtime:
${rep.machineMostAffected.machine||'--'} — ${fmtDur(rep.machineMostAffected.minutes||0)}
${plhBlock}

/* v150: storage meter — every cloud document has a 1 MB limit; warn at 80% */
const DOC_LIMIT = 1048576;
function storageUsage(){
  const sz = v=>{ try{ return new Blob([typeof v==='string' ? v : JSON.stringify(v)]).size; }catch(e){ return 0; } };
  const rows = Object.keys(Store.recMonths||{}).sort().map(m=>({name:`Records · ${m==='undated'?'no date':fmtDate(m+'-01').replace(/\s\d+,/, '')}`, bytes: sz(Store.recSaved[m] || JSON.stringify(Store.recMonths[m]||[]))}));

  rows.forEach(r=>r.pct = r.bytes/DOC_LIMIT*100);
  return rows;
}

async function copyDataText(format){
  let text;
  if(format==='json'){
    text = JSON.stringify({records:Store.records, dailyReports:Store.dailyReports, exportedAt:new Date().toISOString()}, null, 2);
  } else {
    const headers = ['Date','Machine','Product','Start Time','End Time','Duration (min)','Status','Reason Category','Reason','Upstream/Internal','Notes'];
    const machineOrder = [...MACHINES, ...[...new Set(Store.records.map(r=>r.machine))].filter(m=>!MACHINES.includes(m)).sort()];
    const lines = [headers.join(',')];
    machineOrder.forEach(m=>{
      const recs = Store.records.filter(r=>r.machine===m).sort((a,b)=> a.date===b.date ? toMin(a.startTime)-toMin(b.startTime) : a.date.localeCompare(b.date));
      if(!recs.length) return;
      lines.push(`== ${m} ==`);
      recs.forEach(r=>{ lines.push([r.date,r.machine,r.product,r.startTime,r.endTime,r.durationMin,r.status,r.reasonCategory,r.reason,r.classification,(r.notes||'').replace(/,/g,';')].join(',')); });
      lines.push('');
    });
    text = lines.join('\n');
  }
  try{
    await navigator.clipboard.writeText(text);
    toast('Copied to clipboard — paste into Notes or Files');
  }catch(e){
    // Clipboard blocked too — fall back to a selectable text prompt
    window.prompt('Copy this text manually (Cmd/Ctrl+A, then Copy):', text);
  }
}
function downloadBlob(content, filename, type){
  const blob = new Blob([content], {type});

async function importData(evt){
  const file = evt.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    const incoming = data.records || [];
    const existingIds = new Set(Store.records.map(r=>r.id));
    const newOnes = incoming.filter(r=>!existingIds.has(r.id));
    if(!confirm(`${incoming.length} records found (${newOnes.length} new). Merge with existing data?`)) return;
    await Store.refreshRecords();
    const freshIds = new Set(Store.records.map(r=>r.id));
    const trulyNew = incoming.filter(r=>!freshIds.has(r.id));
    Store.records = Store.records.concat(trulyNew);
    if(data.dailyReports){
      data.dailyReports.forEach(rep=>{ if(!Store.dailyReports.find(r=>r.date===rep.date)) Store.dailyReports.push(rep); });
    }
    await Store.saveRecords(); await Store.saveDailyReports();
    toast('Data merged'); render();
  }catch(e){ toast('Invalid backup file'); }
  evt.target.value='';
}

/* ============ UPSTREAM IMPACT SUMMARY ============
One-page summary of packaging WAITING time caused by upstream departments, for cross-department meetings. Packaging measures; the owning department decides the fix — so the page states measured facts only. (Agreed Actions table removed in v96: planning is handled by the manager/supervisor with the departments involved.)
Department mapping is fixed here. Any upstream reason not listed (incl. future new reasons) falls into "Others" so it's never silently dropped. Matching uses the renamed label (REASON_RENAMES) so old records map correctly too. */
const UPSTREAM_DEPARTMENTS = [
  {name:'MAREL', match:r=>/^MAREL - /.test(r)},
  {name:'MAREL / Trimmers (strogi)', reasons:['Waiting for strogi meat']}, // v167: Fajita strogi = MAREL leftovers + trimmers
  {name:'Trimmers', match:r=>/^TRIMMERS - /.test(r) && !/^TRIMMERS - Schedule Change/.test(r)},
  {name:'Trimmers · Planned Schedule Change (not a delay)', match:r=>/^TRIMMERS - Schedule Change/.test(r)}, // v185: planned decisions, shown apart so trimmers aren't blamed
  {name:'Band Saw', reasons:['Waiting for Band Saw Product','Waiting for Band Saw Cut Meat (for Slicer)']},
  {name:'Burger Room', reasons:['Waiting for Burger Room Product']},
  {name:'Side Machines', reasons:['Waiting for Fajita','Waiting for Cutlet','Waiting for Slicer']}, // v107: Fajita/Cutlet/Slicer are run by packaging staff — grouped so the report ties to the side-machine labour section
  {name:'Warehouse', reasons:['Waiting for Warehouse to Scan In Product']},
  {name:'Production Planning', reasons:['Product Not Thawed/Ready','Production Department Behind Schedule','Product Shortage']}
