<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CI Tracker">
<title>Packaging CI Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#181B1E; --panel:#22262A; --panel2:#2B3034; --line:#383E43;
  --text:#EDEFF1; --muted:#9AA1A6; --muted2:#6D7377;
  --amber:#E0A030; --amber-dim:#3A2F1C;
  --run:#3FA35B; --run-dim:#1D3323;
  --change:#D98F2B; --change-dim:#3A2A14;
  --wait:#D6534A; --wait-dim:#3A1E1C;
  --brk:#4A90D9; --brk-dim:#1C2A3A;
  --nowork:#7C848A; --nowork-dim:#26292C;
  --up:#C77DD6; --int:#4FB3C2;
  --radius:14px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;height:100%;overscroll-behavior-y:none;}
body{padding-bottom:env(safe-area-inset-bottom);}
h1,h2,h3{font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.03em; margin:0;}
.mono{font-family:'IBM Plex Mono',monospace;}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;}
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg) 80%,transparent);padding:14px 16px 8px;display:flex;align-items:center;justify-content:space-between;}
.topbar .brand{display:flex;flex-direction:column;line-height:1;}
.topbar .brand .eyebrow{font-size:10px;letter-spacing:0.18em;color:var(--amber);font-weight:600;text-transform:uppercase;}
.topbar h1{font-size:19px;color:var(--text);margin-top:2px;}
.iconbtn{width:40px;height:40px;border-radius:10px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text);}
main{flex:1;padding:0 16px 100px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
.card h3{font-size:12px;color:var(--muted);letter-spacing:0.1em;margin-bottom:10px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.machine-card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:18px 10px;text-align:center;min-width:0;position:relative;}
@keyframes borderChase{ from { stroke-dashoffset:0; } to { stroke-dashoffset:-100; } }
.machine-card .chase-rect{ animation:borderChase 2.5s linear infinite; }
.machine-card .mname{font-family:'Oswald';font-size:15px;color:var(--text);letter-spacing:0.05em;}
.machine-card .mstat{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:8px;}
.pill{font-size:10px;padding:3px 7px;border-radius:20px;font-weight:600;letter-spacing:0.02em;display:inline-flex;align-items:center;gap:4px;}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;}
.pill.run{background:var(--run-dim);color:var(--run);}
.pill.change{background:var(--change-dim);color:var(--change);}
.pill.wait{background:var(--wait-dim);color:var(--wait);}
.pill.brk{background:var(--brk-dim);color:var(--brk);}
.pill.nowork{background:var(--nowork-dim);color:var(--nowork);}
.bignum{font-family:'IBM Plex Mono';font-size:28px;font-weight:600;}
.statrow{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;}
.statrow:last-child{border-bottom:none;}
.statrow .lbl{color:var(--muted);}
.statrow .val{font-family:'IBM Plex Mono';font-weight:600;}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:12px;border:none;font-family:'Oswald';font-size:16px;letter-spacing:0.04em;text-transform:uppercase;font-weight:600;cursor:pointer;}
.btn-primary{background:var(--amber);color:#1A1500;}
.btn-secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line);}
.btn-danger{background:var(--wait-dim);color:var(--wait);border:1px solid var(--wait);}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line);}
.btn:active{transform:scale(0.98);}
.btnrow{display:flex;gap:8px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:11px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:6px;font-weight:600;}
select,input[type=text],input[type=time],input[type=number],textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:16px;border-radius:10px;font-size:18px;font-family:'Inter';appearance:none;}
select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='8'><path d='M1 1l6 6 6-6' stroke='%239AA1A6' stroke-width='2' fill='none'/></svg>");background-repeat:no-repeat;background-position:right 14px center;}
textarea{min-height:70px;resize:vertical;font-size:15px;}
.timerow{display:flex;gap:10px;}
.timerow .field{flex:1;}
.duration-badge{background:var(--panel2);border:1px dashed var(--line);border-radius:10px;padding:10px 14px;text-align:center;margin:-4px 0 16px;font-family:'IBM Plex Mono';color:var(--amber);font-size:14px;}
.statusgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.statusopt{padding:16px 8px;border-radius:12px;border:2px solid var(--line);background:var(--panel2);text-align:center;font-family:'Oswald';font-size:13px;letter-spacing:0.03em;color:var(--muted);}
.statusopt .dot{width:10px;height:10px;margin:0 auto 6px;}
.statusopt.sel{border-color:var(--sc);color:var(--text);background:var(--scdim);}
.machinechecks{display:flex;gap:8px;}
.mchip{flex:1;text-align:center;padding:12px 4px;border-radius:10px;border:2px solid var(--line);background:var(--panel2);color:var(--muted);font-family:'Oswald';font-size:13px;}
.mchip.sel{border-color:var(--amber);color:var(--amber);background:var(--amber-dim);}
nav.tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;z-index:30;}
nav.tabbar .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted2);font-size:10px;letter-spacing:0.04em;text-transform:uppercase;font-family:'Oswald';}
nav.tabbar .tab.active{color:var(--amber);}
nav.tabbar .tab .ic{font-size:18px;}
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:var(--run);color:#08150C;padding:10px 20px;border-radius:30px;font-weight:600;font-size:14px;z-index:50;box-shadow:0 6px 18px rgba(0,0,0,0.4);opacity:0;transition:opacity .25s, transform .25s;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
.hist-item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;}
.hist-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.hist-top .mach{font-family:'Oswald';font-size:13px;letter-spacing:0.03em;}
.hist-mid{font-size:13px;color:var(--muted);margin-bottom:6px;}
.hist-bot{display:flex;justify-content:space-between;align-items:center;}
.hist-actions{display:flex;gap:6px;}
.iconsmall{width:30px;height:30px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;}
.filterbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;}
.filterbar select{width:auto;flex:0 0 auto;font-size:12px;padding:8px 10px;}
.rank-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);}
.rank-item:last-child{border-bottom:none;}
.rank-num{font-family:'IBM Plex Mono';font-weight:600;color:var(--amber);width:20px;}
.rank-bar-wrap{flex:1;}
.rank-name{font-size:13px;margin-bottom:4px;}
.rank-bar-bg{background:var(--panel2);border-radius:6px;height:6px;overflow:hidden;}
.rank-bar-fill{height:100%;background:var(--amber);}
.rank-min{font-family:'IBM Plex Mono';font-size:12px;color:var(--muted);width:52px;text-align:right;}
.hidden{display:none !important;}
.warnbanner{background:var(--wait-dim);border:1px solid var(--wait);color:var(--wait);padding:12px 14px;border-radius:10px;font-size:13px;margin-bottom:12px;font-weight:600;}
.live-card{background:var(--panel);border:2px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
.live-card.running{border-color:var(--run);}
.live-card.downtime{border-color:var(--change);}
.live-badge{font-size:11px;padding:4px 10px;border-radius:20px;font-weight:700;letter-spacing:0.04em;display:inline-flex;align-items:center;gap:5px;}
.live-badge.idle{background:var(--nowork-dim);color:var(--nowork);}
.live-badge.running{background:var(--run-dim);color:var(--run);}
.live-badge.downtime{background:var(--change-dim);color:var(--change);}
.live-timer{font-family:'IBM Plex Mono';font-size:34px;font-weight:600;color:var(--brk);margin:8px 0 4px;}
.live-segrow{font-size:12.5px;color:var(--muted);line-height:1.5;}
.classtag{font-size:10px;padding:2px 7px;border-radius:6px;font-weight:700;letter-spacing:0.04em;}
.classtag.up{color:var(--up);background:rgba(199,125,214,0.12);}
.classtag.int{color:var(--int);background:rgba(79,179,194,0.12);}
.reporthead{text-align:center;padding:14px 0 20px;}
.reporthead .eyebrow{color:var(--amber);font-size:11px;letter-spacing:0.16em;font-weight:600;}
.reporthead h2{font-size:20px;margin-top:4px;}
.reporthead .sub{color:var(--muted);font-size:13px;margin-top:6px;}
.obs{background:var(--panel2);border-left:3px solid var(--amber);padding:12px 14px;border-radius:8px;font-size:13px;line-height:1.5;color:var(--text);}
.linkrow{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);}
.linkrow:last-child{border-bottom:none;}
.empty{text-align:center;color:var(--muted2);padding:40px 10px;font-size:14px;}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">
      <span class="eyebrow" id="shiftClock">--:--</span>
      <h1 id="pageTitle">Dashboard</h1>
    </div>
    <button class="iconbtn" onclick="Router.go('settings')">⚙</button>
  </div>
  <main id="main"></main>
  <div class="toast" id="toast"></div>
  <nav class="tabbar">
    <div class="tab" data-tab="dashboard" onclick="Router.go('dashboard')"><span class="ic">▦</span>Dashboard</div>
    <div class="tab" data-tab="live" onclick="Router.go('live')"><span class="ic">●</span>Live</div>
    <div class="tab" data-tab="new" onclick="Router.go('new')"><span class="ic">＋</span>New</div>
    <div class="tab" data-tab="history" onclick="Router.go('history')"><span class="ic">☰</span>History</div>
    <div class="tab" data-tab="reports" onclick="Router.go('reports')"><span class="ic">▤</span>Reports</div>
  </nav>
</div>

<script>
/* ============ DATA / CONSTANTS ============ */
const APP_VERSION = 'v67 - 2026-08-19 (NEW: Downtime Analysis report — flags recurring/high-impact downtime by reason)';
/* RGB colors matching the app's on-screen status colors, used to keep PDF exports visually consistent and scannable */
const PDF_COLOR = {
  amber:[224,160,48], run:[63,163,91], wait:[214,83,74], change:[217,143,43],
  brk:[74,144,217], nowork:[124,132,138], upstream:[178,110,190], internal:[70,158,172]
};
const MACHINES = ['Variovac 1','Variovac 2','Variovac 3','Manual Pack'];
const PRODUCTS = ['Steak','Burger','Ground Beef','Ground Pork','Ground Bison','Ground Venison','Diced Beef','Diced Pork','Diced Bison','Diced Venison','Meat Box','Rebox','Rework','Relabel','Other'];
const STATUSES = [
  {key:'RUNNING', label:'Running', color:'var(--run)', dim:'var(--run-dim)', pillClass:'run'},
  {key:'CHANGEOVER', label:'Changeover', color:'var(--change)', dim:'var(--change-dim)', pillClass:'change'},
  {key:'WAITING', label:'Waiting', color:'var(--wait)', dim:'var(--wait-dim)', pillClass:'wait'},
  {key:'NO_WORK', label:'No Work Scheduled', color:'var(--nowork)', dim:'var(--nowork-dim)', pillClass:'nowork'},
  {key:'BREAK', label:'Break', color:'var(--brk)', dim:'var(--brk-dim)', pillClass:'brk'},
];
const CHANGEOVER_REASONS = ['Product Changeover','Machine Setup','Plate Change','Film Change','Label Change','Cleaning Between Products','Weight Adjustment','Recipe/Program Change','Other'];
const WAITING_CATEGORIES = {
  'Upstream / Product': {cls:'upstream', reasons:['Waiting for Trimmed Meat','Waiting for MAREL Cut Meat','MAREL Switching Product','MAREL Cutting Meat for Variovac 1','MAREL Cutting Meat for Variovac 2','MAREL Cutting Chicken Muscle','Waiting for Ground Meat','Waiting for Diced Meat','Waiting for Chicken Diced','Waiting for Bison','Waiting for Venison','Waiting for Beef Slice','Waiting for Band Saw Product','Waiting for Product','Waiting for Burger Room Product','Product Not Thawed/Ready','Waiting for Rework','Waiting for Rebox','Waiting for Warehouse to Scan In Product','Product Shortage','Production Department Behind Schedule']},
  'Materials / Warehouse': {cls:'internal', reasons:['Waiting for Boxes','Waiting for Labels','Waiting for Film','Waiting for Skid/Pallet','Waiting for Warehouse Materials','Wrong/Missing Materials']},
  'Machine / Equipment': {cls:'internal', reasons:['Machine Breakdown','Machine Adjustment','Machine Jam','Scale Problem','Sealer Problem','Film/Feed Problem','Electrical/Control Issue','Maintenance','Troubleshooting']},
  'Labour / Operational': {cls:'internal', reasons:['Employee Shortage','Employee Reassigned','Waiting for Operator','Training','Crew Talk','Town Hall Meeting','Break Coverage Issue','Weighing/Scooping Issue','Box Building','Labeling Issue','Other Operational Delay']},
  'Cleaning / Sanitation': {cls:'internal', reasons:['Required Cleaning','Sanitation Delay','Cleanup After Product','Waiting for Sanitation']},
  'QA / Pre-Op': {cls:'internal', reasons:['Pre-Op Inspection','QA Inspection','QA Crew Talk','Metal Detector Test','QA Approval Pending','Product Hold','Weight/Label Verification','Packaging Verification','Allergen Check','Temperature Check','Corrective Action','QA Recheck','Waiting for QA','Other QA Issue']},
};
function statusInfo(key){ return STATUSES.find(s=>s.key===key); }
function reasonClassification(category){ return WAITING_CATEGORIES[category] ? WAITING_CATEGORIES[category].cls : 'internal'; }
/* When a generic "Other" reason was picked, use the operator's note as the specific label wherever reasons are shown or ranked */
function effectiveReasonLabel(r){
  if(r.reason && /other/i.test(r.reason) && r.notes && r.notes.trim()){ return r.notes.trim(); }
  return r.reason;
}

/* ============ STORAGE LAYER — Firebase Firestore (real-time, cloud-synced across every device) ============ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDRttvEVYAKjZIUTtjtmVOBXbveH2kbiKY",
  authDomain: "packaging-ci-tracker.firebaseapp.com",
  projectId: "packaging-ci-tracker",
  storageBucket: "packaging-ci-tracker.firebasestorage.app",
  messagingSenderId: "929311010987",
  appId: "1:929311010987:web:e66eacb5ab03d85f2987ee"
};
const Store = {
  ready:false, records:[], dailyReports:[], liveRuns:{}, productLibrary:[], persisted:true, db:null, _initialLoadDone:false,
  async init(){
    try{
      firebase.initializeApp(FIREBASE_CONFIG);
      this.db = firebase.firestore();
      try{ await this.db.enablePersistence({synchronizeTabs:true}); }catch(e){ /* fine — offline cache just won't work in a second open tab */ }

      const recRef = this.db.collection('tracker').doc('records');
      const repRef = this.db.collection('tracker').doc('dailyReports');
      const liveRef = this.db.collection('tracker').doc('liveRuns');
      const prodRef = this.db.collection('tracker').doc('productLibrary');

      const recSnap = await recRef.get();
      this.records = (recSnap.exists && recSnap.data().data) ? JSON.parse(recSnap.data().data) : [];
      const repSnap = await repRef.get();
      this.dailyReports = (repSnap.exists && repSnap.data().data) ? JSON.parse(repSnap.data().data) : [];

      // Live Floor state gets its own local safety net: an in-progress run (segments, staffing, downtime not yet Finished) exists only in memory until it saves. If the network is down right when the app loads or reloads, recover the last known state from this device instead of losing it.
      try{
        const liveSnap = await liveRef.get();
        this.liveRuns = (liveSnap.exists && liveSnap.data().data) ? JSON.parse(liveSnap.data().data) : {};
        safeLocalSet('pct_live_runs_backup', JSON.stringify(this.liveRuns));
      }catch(e){
        console.error('liveRuns fetch failed, falling back to local mirror', e);
        const backupL = safeLocalGet('pct_live_runs_backup');
        try{ this.liveRuns = backupL ? (JSON.parse(backupL)||{}) : {}; }catch(e2){ this.liveRuns = {}; }
        if(backupL && Object.keys(this.liveRuns).length) toast('Offline — recovered your live run from this device');
      }

      const prodSnap = await prodRef.get();
      this.productLibrary = (prodSnap.exists && prodSnap.data().data) ? JSON.parse(prodSnap.data().data) : [];

      // One-time local recovery net: if the cloud looks empty but an old local mirror has data (e.g. mid-migration), restore it up to the cloud
      if(this.records.length===0){
        const backupR = safeLocalGet('pct_records_backup');
        if(backupR){
          try{ const parsed = JSON.parse(backupR); if(Array.isArray(parsed) && parsed.length>0){ this.records = parsed; await recRef.set({data: JSON.stringify(this.records), updatedAt: Date.now()}); toast('Recovered records from local backup'); } }catch(e){}
        }
      }
      this._initialLoadDone = true;
      this.ready = true;

      // Real-time sync: any device that saves updates every other open device automatically
      recRef.onSnapshot(snap=>{
        if(!this._initialLoadDone) return;
        if(snap.exists && snap.data().data){
          this.records = JSON.parse(snap.data().data);
          safeLocalSet('pct_records_backup', snap.data().data);
          if(typeof Router!=='undefined' && Router.current!=='new') render();
        }
      }, err=>{ console.error('records listener error', err); });
      repRef.onSnapshot(snap=>{
        if(!this._initialLoadDone) return;
        if(snap.exists && snap.data().data){
          this.dailyReports = JSON.parse(snap.data().data);
          if(typeof Router!=='undefined' && Router.current!=='new') render();
        }
      }, err=>{ console.error('reports listener error', err); });
      liveRef.onSnapshot(snap=>{
        if(!this._initialLoadDone) return;
        if(snap.exists && snap.data().data){
          this.liveRuns = JSON.parse(snap.data().data);
          safeLocalSet('pct_live_runs_backup', snap.data().data);
          if(typeof Router!=='undefined' && (Router.current==='live'||Router.current==='dashboard')) render();
        }
      }, err=>{ console.error('liveRuns listener error', err); });
      prodRef.onSnapshot(snap=>{
        if(!this._initialLoadDone) return;
        if(snap.exists && snap.data().data){
          this.productLibrary = JSON.parse(snap.data().data);
          if(typeof Router!=='undefined' && (Router.current==='live'||Router.current==='products')) render();
        }
      }, err=>{ console.error('productLibrary listener error', err); });
    }catch(e){
      console.error('Storage init failed', e);
      window._lastStorageError = String(e && e.message || e);
      this.ready = false;
      showStorageWarning();
    }
  },
  async refreshRecords(){
    try{
      const snap = await this.db.collection('tracker').doc('records').get({source:'server'});
      if(snap.exists && snap.data().data) this.records = JSON.parse(snap.data().data);
      return true;
    }catch(e){
      try{
        const snap = await this.db.collection('tracker').doc('records').get();
        if(snap.exists && snap.data().data) this.records = JSON.parse(snap.data().data);
        return true;
      }catch(e2){ console.error('refreshRecords failed', e2); return false; }
    }
  },
  async saveRecords(){
    try{
      const json = JSON.stringify(this.records);
      await this.db.collection('tracker').doc('records').set({data: json, updatedAt: Date.now()});
      safeLocalSet('pct_records_backup', json);
      hideStorageWarning();
      return true;
    }catch(e){ console.error('save records failed', e); window._lastStorageError = String(e && e.message || e); showStorageWarning(); return false; }
  },
  async saveProductLibrary(){
    try{
      await this.db.collection('tracker').doc('productLibrary').set({data: JSON.stringify(this.productLibrary), updatedAt: Date.now()});
      return true;
    }catch(e){ console.error('save productLibrary failed', e); toast('Save failed — check connection'); return false; }
  },
  async saveDailyReports(){
    try{
      await this.db.collection('tracker').doc('dailyReports').set({data: JSON.stringify(this.dailyReports), updatedAt: Date.now()});
      hideStorageWarning();
      return true;
    }catch(e){ console.error('save reports failed', e); window._lastStorageError = String(e && e.message || e); showStorageWarning(); return false; }
  },
  async saveLiveRuns(){
    const json = JSON.stringify(this.liveRuns);
    safeLocalSet('pct_live_runs_backup', json); // mirror locally first — this is what keeps an in-progress run safe even if the network write below fails
    try{
      await this.db.collection('tracker').doc('liveRuns').set({data: json, updatedAt: Date.now()});
      return true;
    }catch(e){ console.error('save liveRuns failed', e); toast('Live sync failed — kept safe on this device, will sync next time you update this run'); return false; }
  }
};
function safeLocalGet(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
function safeLocalSet(key, val){ try{ localStorage.setItem(key, val); return true; }catch(e){ return false; } }
function showStorageWarning(){
  const isTerminated = String(window._lastStorageError||'').toLowerCase().includes('terminated');
  const banner = isTerminated

function localDateStr(d){ d = d || new Date(); const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function todayStr(){ return localDateStr(new Date()); }
function fmtDate(iso){ const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function toMin(t){ if(!t) return null; const [h,m]=t.split(':').map(Number); return h*60+m; }
function duration(start,end){ let s=toMin(start), e=toMin(end); if(s==null||e==null) return 0; let d=e-s; if(d<0) d+=1440; return d; }
function fmtDur(min){ min=Math.round(min); const h=Math.floor(min/60), m=min%60; return h>0? `${h}h ${m}m` : `${m}m`; }
function fmtTime12(t){ if(!t) return '--'; const parts=t.split(':'); let h=Number(parts[0]), m=Number(parts[1]); if(isNaN(h)||isNaN(m)) return '--'; const ap=h>=12?'PM':'AM'; h=h%12; if(h===0)h=12; return `${h}:${String(m).padStart(2,'0')} ${ap}`; }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),1600); }
function uid(){ return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ============ AGGREGATION HELPERS ============ */
function recordsForDate(date){ return Store.records.filter(r=>r.date===date); }
function machineTotals(recs, machine){
  const t = {RUNNING:0,CHANGEOVER:0,WAITING:0,NO_WORK:0,BREAK:0};
  recs.filter(r=>r.machine===machine).forEach(r=>{ t[r.status]=(t[r.status]||0)+r.durationMin; });
  return t;
}
/* Efficiency = Running ÷ (Running + Waiting + Changeover) — excludes No Work Scheduled and Break, which aren't the machine's fault */
function efficiencyPct(mt){
  const scheduled = (mt.RUNNING||0)+(mt.WAITING||0)+(mt.CHANGEOVER||0);
  if(scheduled<=0) return null;
  return Math.round((mt.RUNNING||0)/scheduled*100);
}
function efficiencyColor(pct){
  if(pct===null) return 'var(--muted)';
  if(pct>=85) return 'var(--run)';
  if(pct>=60) return 'var(--change)';
  return 'var(--wait)';
}
/* Merges overlapping/adjacent time windows into their real combined span — e.g. 9:30-10:00, 9:45-10:15, 10:00-10:30 across three machines becomes one 9:30-10:30 span, not three separate 30-min blocks summed */
function mergeIntervals(intervals){
  if(!intervals.length) return [];
  const sorted = intervals.slice().sort((a,b)=>a.start-b.start);
  const merged = [{...sorted[0]}];
  for(let i=1;i<sorted.length;i++){
    const last = merged[merged.length-1];
    const cur = sorted[i];
    if(cur.start <= last.end){ last.end = Math.max(last.end, cur.end); }
    else { merged.push({...cur}); }
  }
  return merged;
}
/* Total real-world break time for the whole shift — staggered breaks across machines merge into actual elapsed time rather than being summed per-machine. Groups by date first so a multi-day range (Weekly Summary) doesn't merge across different days. */
function totalBreakMinutes(recs){
  const byDate = {};
  recs.filter(r=>r.status==='BREAK').forEach(r=>{
    if(!byDate[r.date]) byDate[r.date]=[];
    let s=toMin(r.startTime), e=toMin(r.endTime); if(e<s) e+=1440;
    byDate[r.date].push({start:s,end:e});
  });
  let total = 0;
  Object.values(byDate).forEach(intervals=>{
    mergeIntervals(intervals).forEach(iv=>{ total += (iv.end-iv.start); });
  });
  return total;
}
function dayTotals(recs){
  const t = {RUNNING:0,CHANGEOVER:0,WAITING:0,NO_WORK:0,BREAK:0, upstream:0, internal:0};
  recs.forEach(r=>{
    if(r.status!=='BREAK'){ t[r.status]=(t[r.status]||0)+r.durationMin; }
    if(r.status==='WAITING'){ if(r.classification==='upstream') t.upstream+=r.durationMin; else t.internal+=r.durationMin; }
  });
  t.BREAK = totalBreakMinutes(recs);
  return t;
}
/* Groups all Waiting/Changeover time across a date range by specific reason (not per-machine, unless a machine filter is applied) — this is what lets a plant-wide recurring pattern like "MAREL Switching Product" show its true combined impact instead of being hidden across 3 separate machine totals. Tracks which machines it actually hit so an isolated-machine issue is still distinguishable from a systemic one. */
function computeDowntimeAnalysis(start, end, machineFilter){
  let recs = Store.records.filter(r=>r.date>=start && r.date<=end && (r.status==='WAITING'||r.status==='CHANGEOVER'));
  if(machineFilter) recs = recs.filter(r=>r.machine===machineFilter);
  const groups = {};
  recs.forEach(r=>{
    const label = effectiveReasonLabel(r) || r.status;
    if(!groups[label]) groups[label] = {reason:label, classification:r.classification, status:r.status, totalMin:0, count:0, machines:new Set()};
    groups[label].totalMin += r.durationMin;
    groups[label].count++;
    groups[label].machines.add(r.machine);
  });
  const totalDowntimeMin = recs.reduce((a,r)=>a+r.durationMin,0);
  const list = Object.values(groups).map(g=>({...g, machines:[...g.machines].sort(), avgMin: g.totalMin/g.count})).sort((a,b)=>b.totalMin-a.totalMin);
  return {list, totalDowntimeMin};
}
/* Flags a downtime reason as needing priority attention based on two independent signals: it keeps recurring (count) or it's quietly eating large total time (totalMin) — either alone is worth flagging, since a short-but-frequent issue and a rare-but-long one are both real problems, just different shapes. Top-3 by total time always counts as highest priority regardless of count, since that's the biggest lever regardless of pattern. */
function downtimeSeverityFlag(item, rankIndex){
  if(rankIndex<3 || item.count>=5 || item.totalMin>=120) return {level:'critical', label:'🔴 HIGHEST PRIORITY', color:'var(--wait)'};
  if(item.count>=3 || item.totalMin>=60) return {level:'watch', label:'🟡 WATCH', color:'var(--change)'};
  return {level:'normal', label:'', color:'var(--amber)'};
}
function bottlenecks(recs, limit){
  const map = {};
  recs.filter(r=>r.status==='WAITING' || r.status==='CHANGEOVER').forEach(r=>{
    const key = effectiveReasonLabel(r) || r.status;
    map[key] = (map[key]||0)+r.durationMin;
  });
  return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,limit||5);
}
/* Collects a couple of real operator notes behind each ranked bottleneck, so reports show the actual floor context (e.g. which specific product/machine) rather than just the bucket label */
function bottleneckNotesFor(recs, label, max){
  max = max || 2;
  const seen = new Set(); const notes = [];
  recs.filter(r=>(r.status==='WAITING'||r.status==='CHANGEOVER') && effectiveReasonLabel(r)===label && r.notes && r.notes.trim()).forEach(r=>{
    const n = r.notes.trim();
    if(n===label) return; // avoid echoing the label back when it was itself sourced from this note (the "Other" case)
    if(!seen.has(n) && notes.length<max){ seen.add(n); notes.push(n); }
  });
  return notes;
}
/* Finds which category/status a bottleneck label came from, for the suggestion engine — looks past the "Other"-swap to the real underlying record */
function bottleneckCategory(recs, label){
  const rec = recs.find(r=>(r.status==='WAITING'||r.status==='CHANGEOVER') && effectiveReasonLabel(r)===label);
  if(!rec) return null;
  return rec.status==='CHANGEOVER' ? 'Changeover' : rec.reasonCategory;
}
function machineMostWaiting(recs){
  let best=null,bestMin=-1;
  MACHINES.forEach(m=>{
    const min = recs.filter(r=>r.machine===m && r.status==='WAITING').reduce((s,r)=>s+r.durationMin,0);
    if(min>bestMin){bestMin=min;best=m;}
  });
  return {machine:best, minutes:bestMin};
}

function nowHHMM(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
/* ---- PLH Reporting (aggregates the structured plh data attached to finished Live Entry runs) ---- */
function plhRecordsInRange(startDate, endDate){
  return Store.records.filter(r=>r.plh && r.plh.grossPLH!=null && r.date>=startDate && r.date<=endDate);
}
/* Live Entry runs that finished without Quantity/Weight entered — still have full staffing/timing detail preserved, just missing the numbers needed to compute PLH */
function incompletePLHRecordsInRange(startDate, endDate){
  return Store.records.filter(r=>r.plh && r.plh.grossPLH==null && r.date>=startDate && r.date<=endDate);
}
function computePLHSummary(recs){
  const totalWeight = recs.reduce((a,r)=>a+(r.plh.weightLbs||0),0);
  const totalQty = recs.reduce((a,r)=>a+(r.plh.quantity||0),0);
  const totalGrossHours = recs.reduce((a,r)=>a+(r.plh.grossLaborHours||0),0);
  const totalNetHours = recs.reduce((a,r)=>a+(r.plh.netLaborHours||0),0);
  const grossPLH = totalGrossHours>0 ? totalWeight/totalGrossHours : 0;
  const netPLH = totalNetHours>0 ? totalWeight/totalNetHours : 0;
  let best=null, worst=null;
  recs.forEach(r=>{ if(!best || r.plh.grossPLH>best.plh.grossPLH) best=r; if(!worst || r.plh.grossPLH<worst.plh.grossPLH) worst=r; });
  const withTarget = recs.filter(r=>r.plh.targetPLH);
  const avgTarget = withTarget.length ? withTarget.reduce((a,r)=>a+r.plh.targetPLH,0)/withTarget.length : null;
  return {totalWeight, totalQty, totalGrossHours, totalNetHours, grossPLH, netPLH, best, worst, avgTarget, runCount:recs.length};
}
function renderPLHCard(summary, title){

function dailyPLHSeries(startDate, endDate){

function renderPLHTrendChart(series){
  if(!series.length) return '<div class="empty">No PLH data in this range yet.</div>';
  const W=340,H=110,padL=4,padR=4,padB=20,padT=8;
  const chartW=W-padL-padR, chartH=H-padT-padB;
  const maxVal = Math.max(1, ...series.map(d=>d.plh));
  const n=series.length, barGap=4;
  const barW = Math.max(3,(chartW-barGap*(n-1))/n);
  let bars='', labels='';
  const labelEvery = n>14?Math.ceil(n/7):(n>7?2:1);
  series.forEach((d,i)=>{
    const x=padL+i*(barW+barGap);
    const h=(d.plh/maxVal)*chartH;
    const y=padT+(chartH-h);
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(1,h).toFixed(1)}" rx="2" fill="var(--brk)"><title>${fmtDate(d.date)}: ${d.plh.toFixed(0)} PLH</title></rect>`;
    if(i%labelEvery===0||i===n-1){
      const dl = new Date(d.date+'T00:00:00').toLocaleDateString('en-US',{month:'numeric',day:'numeric'});
      labels += `<text x="${(x+barW/2).toFixed(1)}" y="${H-4}" font-size="8" fill="var(--muted2)" text-anchor="middle" font-family="IBM Plex Mono">${dl}</text>`;
    }
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;">
    <line x1="${padL}" y1="${padT+chartH}" x2="${W-padR}" y2="${padT+chartH}" stroke="var(--line)" stroke-width="1"/>
    ${bars}${labels}
  </svg><div style="font-size:11px;color:var(--muted);margin-top:6px;">Daily Gross PLH</div>`;
}

let plhLogFilters = {machine:'', product:''};
let plhLogDetailId = null;
function plhPresetRange(preset){
  const now = new Date(); const today = localDateStr(now);
  if(preset==='yesterday'){ const d=new Date(now); d.setDate(d.getDate()-1); const s=localDateStr(d); return {start:s,end:s}; }
  if(preset==='7days'){ const d=new Date(now); d.setDate(d.getDate()-6); return {start:localDateStr(d), end:today}; }
  if(preset==='30days'){ const d=new Date(now); d.setDate(d.getDate()-29); return {start:localDateStr(d), end:today}; }
  if(preset==='thisWeek'){ const d=new Date(now); const day=d.getDay(); const diffToMon=(day===0?6:day-1); const mon=new Date(d); mon.setDate(d.getDate()-diffToMon); return {start:localDateStr(mon), end:today}; }
  return {start:today, end:today}; // 'today' / default
}
function setPLHLogPreset(preset){

    <div style="color:var(--muted);font-size:13px;">${recs.length} run${recs.length===1?'':'s'}</div>

function exportPLHLogCSV(){
  const allRecs = plhRecordsInRange(plhLogRange.start, plhLogRange.end);
  let recs = allRecs;
  if(plhLogFilters.machine) recs = recs.filter(r=>r.machine===plhLogFilters.machine);
  if(plhLogFilters.product) recs = recs.filter(r=>r.plh.product===plhLogFilters.product);
  const headers = ['Date','Start Time','End Time','Product','Quantity','Weight (lbs)','Gross PLH','Net PLH','Labour Hrs (Gross)','Labour Hrs (Net)','Downtime (min)','Target PLH'];
  const rowFor = r=>{
    const p = r.plh;
    const downtimeMin = (p.downtimeSegments||[]).reduce((a,d)=>a+duration(d.start,d.end),0);
    const segs = p.segments||[];
    const startTime = segs.length ? fmtTime12(segs[0].start) : '';
    let lastEndRaw = segs.length ? segs[segs.length-1].end : '';
    (p.downtimeSegments||[]).forEach(d=>{ if(d.end && (!lastEndRaw || toMin(d.end)>toMin(lastEndRaw))) lastEndRaw = d.end; });
    const endTime = lastEndRaw ? fmtTime12(lastEndRaw) : '';
    return [r.date, startTime, endTime, p.product||r.product, p.quantity||0, p.weightLbs, p.grossPLH.toFixed(1), p.netPLH!=null?p.netPLH.toFixed(1):'', p.grossLaborHours.toFixed(2), p.netLaborHours.toFixed(2), downtimeMin, p.targetPLH||''];
  };
  // Group by machine (Variovac 1, 2, 3 first, then any others), and within each machine sort chronologically — same organization as the main History CSV export
  const machineOrder = [...MACHINES, ...[...new Set(recs.map(r=>r.machine))].filter(m=>!MACHINES.includes(m)).sort()];
  const lines = [headers.join(',')];
  machineOrder.forEach(m=>{
    const machineRecs = recs.filter(r=>r.machine===m).sort((a,b)=> a.date===b.date ? toMin(a.startTime)-toMin(b.startTime) : a.date.localeCompare(b.date));
    if(!machineRecs.length) return;
    lines.push(`"== ${m} =="`);
    machineRecs.forEach(r=>{ lines.push(rowFor(r).map(v=>`"${v}"`).join(',')); });
    lines.push('');
  });
  const csv = lines.join('\n');
  downloadBlob(csv, `PLH_Production_Log_${plhLogRange.start}_to_${plhLogRange.end}.csv`, 'text/csv');
  toast('CSV exported');
}

function elapsedMinutesSince(hhmm){
  const d = duration(hhmm, nowHHMM());
  return d;
}
function laborHoursSoFar(live){
  let mins = 0;
  (live.segments||[]).forEach(seg=>{
    const end = seg.end || nowHHMM();
    mins += duration(seg.start, end) * (seg.employees||1);
  });
  return (mins/60).toFixed(1);
}
function machineIdSafe(m){ return m.replace(/\s+/g,'-'); }

async function confirmAddProduct(){
  const p = liveProductPicker;
  const name = (p.newName||'').trim();
  if(!name){ toast('Enter a product description'); return; }
  const id = (p.newId||'').trim();
  const targetPLH = parseFloat(p.newTargetPLH)||null;
  if(p.editIndex!=null){
    Store.productLibrary[p.editIndex] = {id, name, category:'', targetPLH};
    await Store.saveProductLibrary();
    liveProductPicker = null;
    toast('Product updated');
    render();
    return;
  }
  const exists = Store.productLibrary.find(item=> item.name.toLowerCase()===name.toLowerCase() && (item.id||'')===(id||''));
  if(!exists){
    Store.productLibrary.push({id, name, category:'', targetPLH});
    await Store.saveProductLibrary();
  }
  if(p.target==='library'){ liveProductPicker=null; toast('Product added'); render(); return; }
  applyPickedProduct(id ? `${id} ${name}` : name, id);
}
async function applyPickedProduct(display, id){
  const p = liveProductPicker;
  if(p.target==='setup'){
    liveSetup.product = display;
    liveSetup.productId = id||'';
  } else if(p.target==='active'){
    Store.liveRuns[p.machine].product = display;
    Store.liveRuns[p.machine].productId = id||'';
    await Store.saveLiveRuns();
  } else if(p.target==='addPLHData'){
    await Store.refreshRecords();
    const idx = Store.records.findIndex(rec=>rec.id===p.machine);
    if(idx>-1){
      const rec = {...Store.records[idx], product: display};
      rec.plh = {...(rec.plh||{}), product: display, productId: id||''};
      Store.records[idx] = rec;
      await Store.saveRecords();
    }
  }
  liveProductPicker = null;
  render();
}

  let s1=toMin(aStart), e1=toMin(aEnd||nowHHMM()); if(e1<s1) e1+=1440;
  let s2=toMin(bStart), e2=toMin(bEnd||nowHHMM()); if(e2<s2) e2+=1440;

  return Math.max(0, ovE-ovS);

/* Closes out the current run's segments/downtime and saves them to History — shared by Finish Product (which stops there) and Switch Product (which immediately starts a new run right after). Quantity/weight/notes are optional; when skipped, the run still saves with full timing/staffing data and can be completed later from History, same as Finish Product's own "add later" path. */
async function closeOutLiveRun(m, opts){
  opts = opts || {};
  const live = Store.liveRuns[m];
  if(!live) return null;
  const now = nowHHMM();
  const lastSeg = live.segments.length ? live.segments[live.segments.length-1] : null;
  if(lastSeg && !lastSeg.end) lastSeg.end = now;
  const lastDt = live.downtimeSegments[live.downtimeSegments.length-1];
  if(lastDt && !lastDt.end) lastDt.end = now;

  let netLaborMin = 0;
  live.segments.forEach(seg=>{ netLaborMin += duration(seg.start, seg.end) * seg.employees; });
  let downtimeLaborMin = 0;
  (live.downtimeSegments||[]).forEach(d=>{
    if(d.status==='NO_WORK') return;
    const durMin = duration(d.start, d.end);
    const precedingSeg = live.segments.find(seg=>seg.end===d.start) || live.segments[live.segments.length-1];
    const emp = precedingSeg ? precedingSeg.employees : 1;
    downtimeLaborMin += durMin * emp;
  });
  const grossLaborMin = netLaborMin + downtimeLaborMin;
  const grossLaborHours = grossLaborMin/60, netLaborHours = netLaborMin/60;
  const weightNum = parseFloat(opts.weight)||0;
  const grossPLH = weightNum>0 && grossLaborHours>0 ? weightNum/grossLaborHours : null;
  const netPLH = weightNum>0 && netLaborHours>0 ? weightNum/netLaborHours : null;
  const target = live.productId ? Store.productLibrary.find(p=>p.id===live.productId) : null;

  const extras = [];
  if(opts.quantity) extras.push(`Qty: ${opts.quantity}`);
  if(opts.weight) extras.push(`Weight: ${opts.weight} lbs`);
  if(grossPLH!=null){
    extras.push(`Labour: ${grossLaborHours.toFixed(1)}h gross / ${netLaborHours.toFixed(1)}h net`);
    extras.push(`PLH: ${grossPLH.toFixed(0)} gross${netPLH!=null?' / '+netPLH.toFixed(0)+' net':''}`);
    if(target && target.targetPLH){
      const variance = grossPLH - target.targetPLH;
      const pct = variance/target.targetPLH*100;
      extras.push(`vs Target ${target.targetPLH}: ${variance>=0?'+':''}${variance.toFixed(0)} PLH (${pct>=0?'+':''}${pct.toFixed(0)}%)`);
    }
  } else {
    extras.push('Qty/Weight not entered yet — add later from History');
  }
  if(opts.notes) extras.push(opts.notes);
  const extraNote = extras.join(' · ');
  const plhData = {
    weightLbs: weightNum, quantity: parseFloat(opts.quantity)||0,
    grossLaborHours, netLaborHours, grossPLH, netPLH,
    targetPLH: (target && target.targetPLH) ? target.targetPLH : null,
    productId: live.productId||'', product: live.product||'',
    machine: m, segments: live.segments.map(seg=>({start:seg.start, end:seg.end, employees:seg.employees})),
    downtimeSegments: (live.downtimeSegments||[]).filter(d=>d.status!=='NO_WORK').map(d=>({start:d.start, end:d.end, status:d.status, reason:d.reason}))
  };

  const toSave = [];
  const validSegments = live.segments.filter(seg=>duration(seg.start, seg.end)>0);
  if(validSegments.length){
    const totalSegMin = validSegments.reduce((a,seg)=>a+duration(seg.start,seg.end),0);
    const empCounts = [...new Set(validSegments.map(s=>s.employees))];
    const empNote = empCounts.length===1 ? `${empCounts[0]} employee${empCounts[0]===1?'':'s'} on station` : `${Math.min(...empCounts)}–${Math.max(...empCounts)} employees on station (staff changed)`;
    const baseNote = `${empNote} (Live Entry)`;
    const rec = {id:uid(), date:live.date, machine:m, product:live.product, startTime:validSegments[0].start, endTime:validSegments[validSegments.length-1].end, durationMin:totalSegMin, status:'RUNNING', reasonCategory:'', reason:'', classification:'', notes: extraNote ? `${baseNote} · ${extraNote}` : baseNote, createdAt:Date.now(), plh: plhData};
    toSave.push(rec);
  }
  (live.downtimeSegments||[]).forEach(d=>{
    const dur = duration(d.start, d.end);
    if(dur<=0) return;
    toSave.push({id:uid(), date:live.date, machine:m, product:live.product, startTime:d.start, endTime:d.end, durationMin:dur, status:d.status, reasonCategory:d.reasonCategory, reason:d.reason, classification:d.classification, notes:d.notes||'', createdAt:Date.now()});
  });

  if(toSave.length===0) return {count:0, grossPLH:null};

  await Store.refreshRecords();
  Store.records = Store.records.concat(toSave);
  const okR = await Store.saveRecords();
  if(!okR) return null;
  return {count: toSave.length, grossPLH};
}

/* Breaks are always 30 minutes — auto-fill End Time from Start Time so it doesn't need to be scrolled separately. Doesn't touch other statuses since their durations vary. */
function onStartTimeChanged(){
  if(draft.status!=='BREAK' || !draft.startTime) return;
  let mins = toMin(draft.startTime) + 30;
  if(mins>=1440) mins -= 1440;
  const h = String(Math.floor(mins/60)).padStart(2,'0');
  const m = String(mins%60).padStart(2,'0');
  draft.endTime = `${h}:${m}`;
  const endInput = document.getElementById('endTimeInput');
  if(endInput) endInput.value = draft.endTime;

function rangesOverlap(aStart,aEnd,bStart,bEnd){ return aStart < bEnd && bStart < aEnd; }
/* Warns if a record about to be saved overlaps an existing entry for the same machine/date — catches accidental double-logging before it skews a report. Returns true to proceed, false to cancel. */
function confirmNoOverlap(newRecords, excludeId){
  const conflicts = [];
  newRecords.forEach(nr=>{
    const nStart = toMin(nr.startTime), nEnd = toMin(nr.endTime) < nStart ? toMin(nr.endTime)+1440 : toMin(nr.endTime);
    Store.records.filter(r=>r.machine===nr.machine && r.date===nr.date && r.id!==excludeId).forEach(r=>{
      const eStart = toMin(r.startTime), eEnd = toMin(r.endTime) < eStart ? toMin(r.endTime)+1440 : toMin(r.endTime);
      if(rangesOverlap(nStart,nEnd,eStart,eEnd)){
        conflicts.push(`${nr.machine}: ${fmtTime12(nr.startTime)}–${fmtTime12(nr.endTime)} overlaps existing ${statusInfo(r.status).label} (${fmtTime12(r.startTime)}–${fmtTime12(r.endTime)})`);
      }
    });
  });
  if(!conflicts.length) return true;
  return confirm(`This overlaps with an existing entry:\n\n${conflicts.join('\n')}\n\nSave anyway?`);
}
let isSaving = false;
/* Re-reads the actual on-screen time values right before saving — some desktop browsers don't reliably fire the input event per keystroke on segmented time fields, so trusting only the stored draft can miss a value that's visibly filled in */
function syncTimeFieldsFromDOM(){
  const startEl = document.getElementById('startTimeInput');
  const endEl = document.getElementById('endTimeInput');
  if(startEl && startEl.value) draft.startTime = startEl.value;
  if(endEl && endEl.value) draft.endTime = endEl.value;
}
async function saveRecord(){
  if(isSaving) return;
  syncTimeFieldsFromDOM();
  if(!draft.startTime || !draft.endTime){ toast('Set start and end time'); return; }
  const dur = duration(draft.startTime, draft.endTime);
  if(dur<=0){ toast('End time must be after start'); return; }
  if(draft.status==='BREAK' && draft.breakMachines.length===0){ toast('Select which machine(s) this break applies to'); return; }
  isSaving = true;
  const btn = document.getElementById('saveRecordBtn');
  if(btn){ btn.disabled = true; btn.style.opacity = '0.6'; btn.textContent = 'Saving…'; }
  try{
    return await _saveRecordInner();
  } finally {
    isSaving = false;
  }
}
async function _saveRecordInner(){
  const dur = duration(draft.startTime, draft.endTime);
  const base = {
    date: draft.date || todayStr(), startTime: draft.startTime, endTime: draft.endTime, durationMin: dur,
    status: draft.status, notes: draft.notes||'', createdAt: Date.now()
  };
  let toSave = [];
  if(draft.status==='BREAK'){
    const machines = draft.breakMachines;
    machines.forEach(m=>{ toSave.push({...base, id:uid(), machine:m, product:'', reasonCategory:'', reason:'', classification:''}); });
  } else {
    const product = draft.product==='Other' ? (draft.productOther||'Other') : draft.product;
    let reasonCategory='', reason='', classification='';
    if(draft.status==='CHANGEOVER'){ reason = draft.changeReason==='Other' ? (draft.changeReasonOther||'Other') : draft.changeReason; }
    if(draft.status==='WAITING'){ reasonCategory = draft.waitCategory; const wr = draft.waitReason || WAITING_CATEGORIES[draft.waitCategory].reasons[0]; reason = wr==='Other' ? (draft.waitReasonOther||'Other') : wr; classification = reasonClassification(draft.waitCategory); }
    toSave.push({...base, id:uid(), machine:draft.machine, product, reasonCategory, reason, classification});
  }
  if(!confirmNoOverlap(toSave)) return;
  await Store.refreshRecords();
  Store.records = Store.records.concat(toSave);
  const ok = await Store.saveRecords();
  if(!ok){ toast('Save failed — storage unavailable'); return; }
  const savedDate = base.date;
  const isToday = savedDate===todayStr();
  lastEndTime = draft.endTime;
  toast(isToday ? 'Record Saved' : `Record Saved to ${fmtDate(savedDate)}`);
  draft = freshDraft();
  if(isToday){
    Router.go('dashboard');
  } else {
    histFilters = {date: savedDate, machine:'', product:'', status:'', category:''};
    Router.go('history');
  }
}

async function confirmAddPLHData(){
  const weightNum = parseFloat(document.getElementById('plhWeightInput').value)||0;
  const qtyNum = parseFloat(document.getElementById('plhQtyInput').value)||0;
  if(weightNum<=0){ toast('Enter a weight to compute PLH'); return; }
  await Store.refreshRecords();
  const idx = Store.records.findIndex(r=>r.id===plhDataFormId);
  if(idx===-1){ toast('Record not found — it may have been deleted'); Router.go('history'); return; }
  const r = Store.records[idx];
  let p = r.plh;
  if(!p || p.grossLaborHours==null){
    // No staffing/segment data exists yet (a manual/backdated entry, not from Live Floor) — build it from this record's own duration and the employee count just entered
    const laborHours = (r.durationMin/60) * plhFormEmployees;
    p = {
      weightLbs: 0, quantity: 0, grossLaborHours: laborHours, netLaborHours: laborHours,
      grossPLH: null, netPLH: null, targetPLH: (p && p.targetPLH) || null,
      productId: (p && p.productId) || '', product: r.product || '',
      machine: r.machine, segments: [{start:r.startTime, end:r.endTime, employees:plhFormEmployees}], downtimeSegments: []
    };
  }
  const grossPLH = p.grossLaborHours>0 ? weightNum/p.grossLaborHours : null;
  const netPLH = p.netLaborHours>0 ? weightNum/p.netLaborHours : null;
  const updatedPLH = {...p, weightLbs: weightNum, quantity: qtyNum, grossPLH, netPLH};
  let notes = (r.notes||'').replace('Qty/Weight not entered yet — add later from History', '').replace(/ · $/,'').replace(/^ · /,'');
  const extras = [`Qty: ${qtyNum}`, `Weight: ${weightNum} lbs`, `Labour: ${p.grossLaborHours.toFixed(1)}h gross / ${p.netLaborHours.toFixed(1)}h net`, `PLH: ${grossPLH.toFixed(0)} gross${netPLH!=null?' / '+netPLH.toFixed(0)+' net':''}`];
  if(updatedPLH.targetPLH){
    const variance = grossPLH - updatedPLH.targetPLH;
    const pct = variance/updatedPLH.targetPLH*100;
    extras.push(`vs Target ${updatedPLH.targetPLH}: ${variance>=0?'+':''}${variance.toFixed(0)} PLH (${pct>=0?'+':''}${pct.toFixed(0)}%)`);
  }
  notes = notes ? `${notes} · ${extras.join(' · ')}` : extras.join(' · ');
  Store.records[idx] = {...r, plh: updatedPLH, notes};
  const ok = await Store.saveRecords();
  if(!ok) return;
  plhDataFormId = null;
  toast(`PLH saved — ${grossPLH.toFixed(0)} PLH`);
  Router.go('history');
}

function buildReport(date){
  const recs = recordsForDate(date);
  const dt = dayTotals(recs);
  const bn = bottlenecks(recs,5);
  const bottleneckMeta = {};
  const bottleneckNotes = {};
  bn.forEach(([label])=>{ bottleneckMeta[label] = bottleneckCategory(recs, label); bottleneckNotes[label] = bottleneckNotesFor(recs, label); });
  const mmw = machineMostWaiting(recs);
  const perMachine = {};
  MACHINES.forEach(m=>{ perMachine[m]=machineTotals(recs,m); });
  const shiftTimes = recs.length ? {start: recs.reduce((a,r)=>a<r.startTime?a:r.startTime, recs[0].startTime), end: recs.reduce((a,r)=>a>r.endTime?a:r.endTime, recs[0].endTime)} : {start:'--:--', end:'--:--'};
  let observation = 'No production data recorded for this shift.';
  if(bn.length){
    const top = bn[0];
    observation = `Today's largest source of lost production time was ${top[0].toLowerCase()}, accounting for ${fmtDur(top[1])}${dt.upstream>dt.internal?' of upstream delay':''}.`;

function recordsInRange(startDate, endDate){

function buildRangeReport(startDate, endDate){
  const recs = recordsInRange(startDate, endDate);
  const dt = dayTotals(recs);
  const bn = bottlenecks(recs,5);
  const bottleneckMeta = {};
  const bottleneckNotes = {};
  bn.forEach(([label])=>{ bottleneckMeta[label] = bottleneckCategory(recs, label); bottleneckNotes[label] = bottleneckNotesFor(recs, label); });
  const mmw = machineMostWaiting(recs);
  const perMachine = {};
  MACHINES.forEach(m=>{ perMachine[m]=machineTotals(recs,m); });
  const dayMap = {};
  recs.forEach(r=>{ if(!dayMap[r.date]) dayMap[r.date]={WAITING:0,RUNNING:0,CHANGEOVER:0}; if(dayMap[r.date][r.status]!==undefined) dayMap[r.date][r.status]+=r.durationMin; });
  const dayTrend = Object.keys(dayMap).sort().map(d=>({date:d, waiting:dayMap[d].WAITING, running:dayMap[d].RUNNING}));
  const daysWithData = Object.keys(dayMap).length;
  let observation = 'No production data recorded in this date range.';
  if(bn.length){
    const top = bn[0];
    observation = `Across ${daysWithData} day${daysWithData===1?'':'s'}, the largest recurring source of lost time was ${top[0].toLowerCase()}, totaling ${fmtDur(top[1])}${dt.upstream>dt.internal?' of upstream delay':''}.`;
    if(mmw.minutes>0) observation += ` ${mmw.machine} accumulated the most waiting time overall at ${fmtDur(mmw.minutes)}.`;
    const worstDay = dayTrend.slice().sort((a,b)=>b.waiting-a.waiting)[0];
    if(worstDay && worstDay.waiting>0) observation += ` ${fmtDate(worstDay.date)} was the worst single day for downtime, at ${fmtDur(worstDay.waiting)}.`;
  }
  return {startDate, endDate, totals:dt, perMachine, bottlenecks:bn, bottleneckMeta, bottleneckNotes, machineMostAffected:mmw, dayTrend, daysWithData, observation, recordCount: recs.length};
}
/* Weekly version of the suggestion engine — factors in the upstream/internal split and secondary bottleneck across the whole range, not just one day's top reason */
function craftWeeklySuggestions(rep){
  if(!rep.bottlenecks.length){
    return ['No bottleneck data recorded in this range yet — log entries daily so patterns can surface here.'];
  }
  const ideas = [];
  const [topName, topMin] = rep.bottlenecks[0];
  const topCategory = (rep.bottleneckMeta && rep.bottleneckMeta[topName]) || categoryForReason(topName);
  ideas.push(`Run a root-cause (5-Whys) session on "${topName}" — it was the biggest single driver this period at ${fmtDur(topMin)} across ${rep.daysWithData} day(s) with data.`);

  const t = rep.totals;
  const totalDelay = t.upstream + t.internal;
  if(totalDelay>0){
    const upstreamShare = t.upstream/totalDelay;
    if(upstreamShare >= 0.6){
      ideas.push(`Upstream delays are driving most of this period's downtime (${Math.round(upstreamShare*100)}%) — consider a small in-process buffer or batch-sequencing with the upstream station so packaging isn't stalled directly by its switchovers.`);
    } else if(upstreamShare <= 0.4){
      ideas.push(topCategory && CATEGORY_ACTIONS[topCategory] ? CATEGORY_ACTIONS[topCategory] : 'Standardize the top recurring task with a visual checklist so deviations are caught immediately rather than after the fact.');
    } else {
      ideas.push('Delay is fairly evenly split between upstream and packaging this period — worth reviewing both sides together rather than assuming one is the sole cause.');
    }
  }

  if(rep.bottlenecks.length>1){
    const [name2,min2] = rep.bottlenecks[1];
    ideas.push(`"${name2}" was the second-largest driver at ${fmtDur(min2)} — track whether it's a separate issue or connected to the top one before committing resources to just one fix.`);
  } else if(rep.machineMostAffected.machine && rep.machineMostAffected.minutes>0){
    ideas.push(`${rep.machineMostAffected.machine} carried the most downtime this period (${fmtDur(rep.machineMostAffected.minutes)}) — review its staffing and scheduling pattern for recurring gaps.`);
  }
  return ideas.slice(0,3);
}

/* Renders a simple SVG bar chart of daily Waiting minutes so a trend (e.g. a fix taking effect) is visible at a glance instead of scanning numbers */
function renderTrendChart(dayTrend){
  if(!dayTrend.length) return '<div class="empty">No data in this range yet.</div>';
  const W = 340, H = 130, padL = 4, padR = 4, padB = 22, padT = 10;
  const chartW = W - padL - padR, chartH = H - padT - padB;
  const maxVal = Math.max(1, ...dayTrend.map(d=>d.waiting));
  const n = dayTrend.length;
  const barGap = 4;
  const barW = Math.max(3, (chartW - barGap*(n-1)) / n);
  let bars = '';
  let labels = '';
  const labelEvery = n>14 ? Math.ceil(n/7) : (n>7 ? 2 : 1);
  dayTrend.forEach((d,i)=>{
    const x = padL + i*(barW+barGap);
    const h = (d.waiting/maxVal)*chartH;
    const y = padT + (chartH-h);
    const color = d.waiting===maxVal && maxVal>0 ? 'var(--wait)' : 'var(--amber)';
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(1,h).toFixed(1)}" rx="2" fill="${color}"><title>${fmtDate(d.date)}: ${fmtDur(d.waiting)}</title></rect>`;
    if(i % labelEvery === 0 || i===n-1){
      const dLabel = new Date(d.date+'T00:00:00').toLocaleDateString('en-US',{month:'numeric',day:'numeric'});
      labels += `<text x="${(x+barW/2).toFixed(1)}" y="${H-6}" font-size="8" fill="var(--muted2)" text-anchor="middle" font-family="IBM Plex Mono">${dLabel}</text>`;
    }
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;">
    <line x1="${padL}" y1="${padT+chartH}" x2="${W-padR}" y2="${padT+chartH}" stroke="var(--line)" stroke-width="1"/>
    ${bars}${labels}
  </svg>
  <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px;"><span>Daily Waiting/Downtime (min)</span><span>Peak: ${fmtDur(maxVal)}</span></div>`;
}

const CATEGORY_ACTIONS = {
  'Upstream / Product': 'Set up a short daily sync between packaging and the trim/cutting/grinding stations to align production timing before the shift starts.',
  'Materials / Warehouse': 'Set a par-level check for boxes, film, and labels each morning so material shortages are caught before they stop the line.',
  'Machine / Equipment': 'Schedule a preventive-maintenance review for the affected machine and log recurring fault codes to spot a pattern.',
  'Labour / Operational': 'Cross-train a backup operator for this station and review shift staffing coverage during peak changeover windows.',
  'Cleaning / Sanitation': 'Standardize the cleaning changeover sequence with a visual checklist to shorten the changeover-to-clean transition.',
  'QA / Pre-Op': 'Align QA inspection timing with the production start so approvals happen in parallel rather than blocking the line.',
  'Changeover': 'Apply a SMED-style review to the changeover sequence to identify prep steps that can happen before the line actually stops.'
};
function categoryForReason(reasonName){
  if(CHANGEOVER_REASONS.includes(reasonName)) return 'Changeover';
  for(const [cat, info] of Object.entries(WAITING_CATEGORIES)){ if(info.reasons.includes(reasonName)) return cat; }
  return null;
}
function craftSuggestions(rep){
  if(!rep.bottlenecks.length){
    return ['No bottleneck data recorded yet — log waiting and changeover reasons on the floor tomorrow so patterns can surface here.'];
  }
  const [reasonName, minutes] = rep.bottlenecks[0];
  const category = (rep.bottleneckMeta && rep.bottleneckMeta[reasonName]) || categoryForReason(reasonName);
  const cls = reasonClassification(category);
  const ideas = [];
  ideas.push(`Run a 5-Whys session on "${reasonName}" with the ${cls==='upstream' && category!=='Changeover' ? 'upstream production' : 'packaging'} team to find the root cause behind today's ${fmtDur(minutes)}.`);
  ideas.push(category && CATEGORY_ACTIONS[category] ? CATEGORY_ACTIONS[category] : 'Document the standard sequence for this task and confirm the operator followed it — deviations often hide the real cause.');
  if(rep.machineMostAffected.machine && rep.machineMostAffected.minutes>0){
    ideas.push(`Review ${rep.machineMostAffected.machine}'s schedule and staffing for tomorrow's shift — it accounted for ${fmtDur(rep.machineMostAffected.minutes)} of today's waiting time.`);
  } else {
    ideas.push('Post today\'s top bottleneck on the floor visual board so the team can flag it in real time if it recurs tomorrow.');
  }
  return ideas.slice(0,3);
}

function exportReportPDF(date){
  const rep = getReportForView(date);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'letter'});
  doc.setFillColor(...PDF_COLOR.amber); doc.rect(0,0,612,6,'F');
  let y = 50;
  doc.setTextColor(...PDF_COLOR.amber); doc.setFont('helvetica','bold'); doc.setFontSize(11);
  doc.text('PACKAGING CONTINUOUS IMPROVEMENT', 40, y); y+=18;
  doc.setTextColor(0); doc.setFontSize(16);
  doc.text('DAILY PRODUCTION & BOTTLENECK REPORT', 40, y); y+=24;
  doc.setFont('helvetica','normal'); doc.setFontSize(11);
  doc.text(`Date: ${fmtDate(rep.date)}    Shift Start: ${fmtTime12(rep.shiftStart)}    Shift End: ${fmtTime12(rep.shiftEnd)}`, 40, y); y+=26;

  function section(title){ doc.setTextColor(0); doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.text(title, 40, y); y+=6; doc.setDrawColor(...PDF_COLOR.amber); doc.setLineWidth(1.3); doc.line(40,y,570,y); doc.setLineWidth(0.5); y+=16; doc.setFont('helvetica','normal'); doc.setFontSize(10.5); }
  function row(label, val){ doc.setTextColor(0); doc.text(label, 46, y); doc.text(String(val), 400, y); y+=15; }
  function rowC(label, val, rgb){ doc.setTextColor(0); doc.text(label, 46, y); doc.setTextColor(...rgb); doc.text(String(val), 400, y); doc.setTextColor(0); y+=15; }
  function ensure(space){ if(y+space>760){ doc.addPage(); y=50; } }

  section('MACHINE SUMMARY');
  MACHINES.forEach(m=>{
    ensure(90);
    doc.setFont('helvetica','bold'); doc.setTextColor(0); doc.text(m,46,y); y+=15; doc.setFont('helvetica','normal');
    const mt = rep.perMachine[m]||{};
    rowC('Running Time', fmtDur(mt.RUNNING||0), PDF_COLOR.run);
    rowC('Waiting/Downtime', fmtDur(mt.WAITING||0), PDF_COLOR.wait);
    rowC('Changeover Time', fmtDur(mt.CHANGEOVER||0), PDF_COLOR.change);
    rowC('Break Time', fmtDur(mt.BREAK||0), PDF_COLOR.brk);
    rowC('No Work Scheduled', fmtDur(mt.NO_WORK||0), PDF_COLOR.nowork);
    y+=6;
  });

  ensure(120); section('TOTAL SHIFT SUMMARY');
  const t = rep.totals;
  rowC('Total Running Time', fmtDur(t.RUNNING), PDF_COLOR.run);
  rowC('Total Waiting/Downtime', fmtDur(t.WAITING), PDF_COLOR.wait);
  rowC('Total Changeover', fmtDur(t.CHANGEOVER), PDF_COLOR.change);
  rowC('Total Break Time', fmtDur(t.BREAK), PDF_COLOR.brk);
  rowC('Total No Work Scheduled', fmtDur(t.NO_WORK), PDF_COLOR.nowork);

  ensure(120); y+=6; section('DOWNTIME ANALYSIS');
  const tot = t.upstream+t.internal;
  const upPct = tot? t.upstream/tot*100 : 0, intPct = 100-upPct;
  rowC('Total Upstream Delay', fmtDur(t.upstream), PDF_COLOR.upstream);
  rowC('Total Packaging/Internal Delay', fmtDur(t.internal), PDF_COLOR.internal);
  if(tot>0){
    const barW=300;
    doc.setFillColor(...PDF_COLOR.upstream); doc.rect(46,y,barW*upPct/100,10,'F');
    doc.setFillColor(...PDF_COLOR.internal); doc.rect(46+barW*upPct/100,y,barW*intPct/100,10,'F');
    y+=14;
    doc.setFontSize(9); doc.setTextColor(...PDF_COLOR.upstream); doc.text(`Upstream ${Math.round(upPct)}%`,46,y);
    doc.setTextColor(...PDF_COLOR.internal); doc.text(`Internal ${Math.round(intPct)}%`,46+barW-80,y);
    doc.setTextColor(0); doc.setFontSize(10.5); y+=16;
  }

  ensure(140); y+=6; section('TOP BOTTLENECKS');
  if(rep.bottlenecks.length){
    const maxMin = rep.bottlenecks[0][1]||1;
    rep.bottlenecks.forEach(([name,min],i)=>{
      ensure(46);
      row(`${i+1}. ${name}`, fmtDur(min));
      doc.setFillColor(...PDF_COLOR.amber); doc.rect(46, y-11, 300*(min/maxMin), 3, 'F'); y+=4;
      const notes = (rep.bottleneckNotes && rep.bottleneckNotes[name]) || [];
      if(notes.length){
        doc.setFontSize(9); doc.setTextColor(120);
        notes.forEach(n=>{ ensure(20); const lines = doc.splitTextToSize(`— ${n}`, 480); doc.text(lines, 56, y); y += lines.length*12; });
        doc.setFontSize(10.5); doc.setTextColor(0);
      }
    });
  }
  else { doc.text('No bottlenecks recorded.',46,y); y+=15; }

  ensure(60); y+=6; section('MACHINE WITH MOST DOWNTIME');
  doc.text(`${rep.machineMostAffected.machine||'--'} — ${fmtDur(rep.machineMostAffected.minutes||0)}`, 46, y); y+=20;

  ensure(90); section('CONTINUOUS IMPROVEMENT OBSERVATION');
  const obsLines = doc.splitTextToSize(rep.observation, 520);
  doc.text(obsLines, 46, y); y += obsLines.length*14+10;

  {
    const plhSummary = computePLHSummary(plhRecordsInRange(rep.date, rep.date));
    ensure(120); y+=6; section('PLH SUMMARY (TODAY)');
    if(plhSummary.runCount===0){ doc.text('No finished runs with weight recorded yet.',46,y); y+=15; }
    else{
      row('Gross PLH (lbs/labour-hr)', plhSummary.grossPLH.toFixed(0));
      row('Net PLH (lbs/labour-hr)', plhSummary.netPLH.toFixed(0));
      row('Total Pounds', Math.round(plhSummary.totalWeight));
      row('Total Quantity', Math.round(plhSummary.totalQty));
      row('Labour Hours (gross)', plhSummary.totalGrossHours.toFixed(1));
      row('Production Runs', plhSummary.runCount);
      if(plhSummary.avgTarget!=null){ const variance=plhSummary.grossPLH-plhSummary.avgTarget; const pct=variance/plhSummary.avgTarget*100; row('vs Target', `${variance>=0?'+':''}${variance.toFixed(0)} PLH (${pct>=0?'+':''}${pct.toFixed(0)}%)`); }
      if(plhSummary.best) row('Best Product', `${plhSummary.best.plh.product||''} — ${plhSummary.best.plh.grossPLH.toFixed(0)} PLH`);
      if(plhSummary.worst && plhSummary.worst!==plhSummary.best) row('Lowest Product', `${plhSummary.worst.plh.product||''} — ${plhSummary.worst.plh.grossPLH.toFixed(0)} PLH`);
    }
  }

  ensure(90); section('CI ACTION / FOLLOW-UP');
  const actLines = doc.splitTextToSize(rep.ciAction || '(none entered)', 520);
  doc.text(actLines, 46, y); y += actLines.length*14+10;

  try{
    doc.save(`Packaging_CI_Report_${rep.date}.pdf`);
    toast('PDF exported');
  }catch(e){
    console.error('PDF save failed, trying fallback', e);
    try{
      const url = doc.output('bloburl');
      window.open(url, '_blank');
      toast('PDF opened in new tab — use Share/Save from there');
    }catch(e2){
      console.error('PDF fallback failed', e2);
      toast('PDF export not available here — try after hosting on a real website');
    }
  }
}

async function copyDataText(format){
  let text;
  if(format==='json'){
    text = JSON.stringify({records:Store.records, dailyReports:Store.dailyReports, exportedAt:new Date().toISOString()}, null, 2);
  } else {
    const headers = ['Date','Machine','Product','Start Time','End Time','Duration (min)','Status','Reason Category','Reason','Upstream/Internal','Notes'];
    const machineOrder = [...MACHINES, ...[...new Set(Store.records.map(r=>r.machine))].filter(m=>!MACHINES.includes(m)).sort()];
    const lines = [headers.join(',')];
    machineOrder.forEach(m=>{
      const recs = Store.records.filter(r=>r.machine===m).sort((a,b)=> a.date===b.date ? toMin(a.startTime)-toMin(b.startTime) : a.date.localeCompare(b.date));
      if(!recs.length) return;
      lines.push(`== ${m} ==`);
      recs.forEach(r=>{ lines.push([r.date,r.machine,r.product,r.startTime,r.endTime,r.durationMin,r.status,r.reasonCategory,r.reason,r.classification,(r.notes||'').replace(/,/g,';')].join(',')); });
      lines.push('');
    });
    text = lines.join('\n');
  }
  try{
    await navigator.clipboard.writeText(text);
    toast('Copied to clipboard — paste into Notes or Files');
  }catch(e){
    // Clipboard blocked too — fall back to a selectable text prompt
    window.prompt('Copy this text manually (Cmd/Ctrl+A, then Copy):', text);
  }
}
function downloadBlob(content, filename, type){
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 200);
}
function exportJSON(){
  const data = {records:Store.records, dailyReports:Store.dailyReports, exportedAt:new Date().toISOString()};
  downloadBlob(JSON.stringify(data,null,2), `Packaging_CI_Data_${todayStr()}.json`, 'application/json');
  toast('Data exported');
}
function exportCSV(){
  const headers = ['Date','Shift Start','Shift End','Machine','Product','Start Time','End Time','Duration (min)','Status','Reason Category','Reason','Upstream/Internal','Notes'];
  const rowFor = r=>{
    const rep = Store.dailyReports.find(d=>d.date===r.date);
    return [r.date, rep?rep.shiftStart:'', rep?rep.shiftEnd:'', r.machine, r.product, r.startTime, r.endTime, r.durationMin, r.status, r.reasonCategory, r.reason, r.classification, (r.notes||'').replace(/"/g,'""')];
  };
  // Group by machine (Variovac 1, 2, 3 first, then any others), and within each machine sort by date then start time — so each machine reads as one continuous timeline instead of interleaved with the others
  const machineOrder = [...MACHINES, ...[...new Set(Store.records.map(r=>r.machine))].filter(m=>!MACHINES.includes(m)).sort()];
  const lines = [headers.join(',')];
  machineOrder.forEach(m=>{
    const recs = Store.records.filter(r=>r.machine===m).sort((a,b)=> a.date===b.date ? toMin(a.startTime)-toMin(b.startTime) : a.date.localeCompare(b.date));
    if(!recs.length) return;
    lines.push(`"== ${m} =="`);
    recs.forEach(r=>{ lines.push(rowFor(r).map(v=>`"${v}"`).join(',')); });
    lines.push('');
  });
  const csv = lines.join('\n');
  downloadBlob(csv, `Packaging_CI_Data_${todayStr()}.csv`, 'text/csv');
  toast('CSV exported');
}
function backupToday(){
  const recs = recordsForDate(todayStr());
  const data = {records:recs, dailyReports: Store.dailyReports.filter(r=>r.date===todayStr()), exportedAt:new Date().toISOString()};
  downloadBlob(JSON.stringify(data,null,2), `Packaging_CI_Backup_${todayStr()}.json`, 'application/json');
  toast('Today backed up');
}
async function importData(evt){
  const file = evt.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    const incoming = data.records || [];
    const existingIds = new Set(Store.records.map(r=>r.id));
    const newOnes = incoming.filter(r=>!existingIds.has(r.id));
    if(!confirm(`${incoming.length} records found (${newOnes.length} new). Merge with existing data?`)) return;
    await Store.refreshRecords();
    const freshIds = new Set(Store.records.map(r=>r.id));
    const trulyNew = incoming.filter(r=>!freshIds.has(r.id));
    Store.records = Store.records.concat(trulyNew);
    if(data.dailyReports){
      data.dailyReports.forEach(rep=>{ if(!Store.dailyReports.find(r=>r.date===rep.date)) Store.dailyReports.push(rep); });
    }
    await Store.saveRecords(); await Store.saveDailyReports();
    toast('Data merged'); render();
  }catch(e){ toast('Invalid backup file'); }
  evt.target.value='';
}
async function clearAllData(){
  if(!confirm('WARNING: This will permanently delete all production records. Are you sure?')) return;
  if(!confirm('This cannot be undone. Confirm delete ALL data?')) return;
  Store.records = []; Store.dailyReports = [];
  await Store.saveRecords(); await Store.saveDailyReports();
  toast('All data cleared'); render();
}

/* ============ ROUTING GLUE ============ */
let liveScrollTarget = null;
function goToLiveMachine(m){
  liveScrollTarget = m;
  Router.go('live');
}
function afterRender(){
  if(Router.current==='endShift'){ document.getElementById('main').innerHTML = renderEndShiftConfirm(); }
  if(Router.current==='live' && liveScrollTarget){
    const el = document.getElementById('live-card-'+machineIdSafe(liveScrollTarget));
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
    liveScrollTarget = null;
  }
}
const _origGo = Router.go.bind(Router);
Router.go = function(view,arg){ _origGo(view,arg); if(view==='endShift'){ document.getElementById('main').innerHTML = renderEndShiftConfirm(); } if(view==='new'){ if(!draft) draft=freshDraft(); } };

/* ============ INIT ============ */
(async function init(){
  await Store.init();
  render();
  setInterval(updateClock, 30000);
  setInterval(()=>{ if(Router.current==='live'||Router.current==='dashboard') render(); }, 30000);

  /* Self-heal a stale Firestore connection: iOS can tear down the connection while the tab is backgrounded (phone locked, app switched away). Rather than wait for a save to fail with "client has already been terminated," proactively check the connection when the app becomes visible again, and reload automatically if it's actually broken. */
  let wasHidden = false;
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='hidden'){ wasHidden = true; return; }
    if(document.visibilityState==='visible' && wasHidden && Store.db){
      wasHidden = false;
      Store.db.collection('tracker').doc('records').get().catch(e=>{
        const msg = String(e && e.message || e).toLowerCase();
        if(msg.includes('terminated') || msg.includes('client is offline')){
          toast('Reconnecting…');
          setTimeout(()=>location.reload(), 600);
        }
      });
    }
  });
})();
