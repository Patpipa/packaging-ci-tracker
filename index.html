<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CI Tracker">
<title>Packaging CI Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{
  --bg:#181B1E; --panel:#22262A; --panel2:#2B3034; --line:#383E43;
  --text:#EDEFF1; --muted:#9AA1A6; --muted2:#6D7377;
  --amber:#E0A030; --amber-dim:#3A2F1C;
  --run:#3FA35B; --run-dim:#1D3323;
  --change:#D98F2B; --change-dim:#3A2A14;
  --wait:#D6534A; --wait-dim:#3A1E1C;
  --brk:#4A90D9; --brk-dim:#1C2A3A;
  --nowork:#7C848A; --nowork-dim:#26292C;
  --planned:#B8A06A; --planned-dim:#302A1E;
  --up:#C77DD6; --int:#4FB3C2;
  --radius:14px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;height:100%;overscroll-behavior-y:none;}
body{padding-bottom:env(safe-area-inset-bottom);}
h1,h2,h3{font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.03em; margin:0;}
.mono{font-family:'IBM Plex Mono',monospace;}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;}
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg) 80%,transparent);padding:14px 16px 8px;display:flex;align-items:center;justify-content:space-between;}
.topbar .brand{display:flex;flex-direction:column;line-height:1;}
.topbar .brand .eyebrow{font-size:10px;letter-spacing:0.18em;color:var(--amber);font-weight:600;text-transform:uppercase;}
.topbar h1{font-size:19px;color:var(--text);margin-top:2px;}
.iconbtn{width:40px;height:40px;border-radius:10px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text);}
main{flex:1;padding:0 16px 100px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
.card h3{font-size:12px;color:var(--muted);letter-spacing:0.1em;margin-bottom:10px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.machine-card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:18px 10px;text-align:center;min-width:0;position:relative;}
@keyframes breathingGlow{
  0%,100% { box-shadow:0 0 3px 0px var(--glow-color); }
  50% { box-shadow:0 0 9px 2px var(--glow-color); }
}
.machine-card.glow-running{ animation:breathingGlow 2.8s ease-in-out infinite; }
@keyframes alarmFlash{
  0%,100% { box-shadow:0 0 6px 1px var(--wait); background:var(--panel2); }
  50% { box-shadow:0 0 18px 5px var(--wait); background:rgba(224,90,80,0.14); }
}
.machine-card.alarm-flash{ animation:alarmFlash 1s ease-in-out infinite; border-width:2px; }
@media (prefers-reduced-motion: reduce){
  .machine-card.glow-running{ animation:none; box-shadow:0 0 4px 0px var(--glow-color); }
  .machine-card.alarm-flash{ animation:none; box-shadow:0 0 10px 2px var(--wait); background:rgba(224,90,80,0.12); }
}
.machine-card .mname{font-family:'Oswald';font-size:15px;color:var(--text);letter-spacing:0.05em;}
.machine-card .mstat{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:8px;}
.pill{font-size:10px;padding:3px 7px;border-radius:20px;font-weight:600;letter-spacing:0.02em;display:inline-flex;align-items:center;gap:4px;}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;}
.pill.run{background:var(--run-dim);color:var(--run);}
.pill.change{background:var(--change-dim);color:var(--change);}
.pill.wait{background:var(--wait-dim);color:var(--wait);}
.pill.brk{background:var(--brk-dim);color:var(--brk);}
.pill.nowork{background:var(--nowork-dim);color:var(--nowork);}
.pill.planned{background:var(--planned-dim);color:var(--planned);}
.bignum{font-family:'IBM Plex Mono';font-size:28px;font-weight:600;}
.statrow{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;}
.statrow:last-child{border-bottom:none;}
.statrow .lbl{color:var(--muted);}
.statrow .val{font-family:'IBM Plex Mono';font-weight:600;}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:12px;border:none;font-family:'Oswald';font-size:16px;letter-spacing:0.04em;text-transform:uppercase;font-weight:600;cursor:pointer;}
.btn-primary{background:var(--amber);color:#1A1500;}
.btn-secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line);}
.btn-danger{background:var(--wait-dim);color:var(--wait);border:1px solid var(--wait);}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line);}
.btn:active{transform:scale(0.98);}
.btnrow{display:flex;gap:8px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:11px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:6px;font-weight:600;}
select,input[type=text],input[type=time],input[type=number],input[type=password],input[type=email],textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:16px;border-radius:10px;font-size:18px;font-family:'Inter';appearance:none;}
select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='8'><path d='M1 1l6 6 6-6' stroke='%239AA1A6' stroke-width='2' fill='none'/></svg>");background-repeat:no-repeat;background-position:right 14px center;}
textarea{min-height:70px;resize:vertical;font-size:15px;}
.timerow{display:flex;gap:10px;}
.timerow .field{flex:1;}
.duration-badge{background:var(--panel2);border:1px dashed var(--line);border-radius:10px;padding:10px 14px;text-align:center;margin:-4px 0 16px;font-family:'IBM Plex Mono';color:var(--amber);font-size:14px;}
.statusgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.statusopt{padding:16px 8px;border-radius:12px;border:2px solid var(--line);background:var(--panel2);text-align:center;font-family:'Oswald';font-size:13px;letter-spacing:0.03em;color:var(--muted);}
.statusopt .dot{width:10px;height:10px;margin:0 auto 6px;}
.statusopt.sel{border-color:var(--sc);color:var(--text);background:var(--scdim);}
.machinechecks{display:flex;gap:8px;}
.mchip{flex:1;text-align:center;padding:12px 4px;border-radius:10px;border:2px solid var(--line);background:var(--panel2);color:var(--muted);font-family:'Oswald';font-size:13px;}
.mchip.sel{border-color:var(--amber);color:var(--amber);background:var(--amber-dim);}
nav.tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;z-index:30;}
nav.tabbar .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted2);font-size:10px;letter-spacing:0.04em;text-transform:uppercase;font-family:'Oswald';}
nav.tabbar .tab.active{color:var(--amber);}
nav.tabbar .tab .ic{font-size:18px;}
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:var(--run);color:#08150C;padding:10px 20px;border-radius:30px;font-weight:600;font-size:14px;z-index:50;box-shadow:0 6px 18px rgba(0,0,0,0.4);opacity:0;transition:opacity .25s, transform .25s;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
.hist-item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;}
.hist-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.hist-top .mach{font-family:'Oswald';font-size:13px;letter-spacing:0.03em;}
.hist-mid{font-size:13px;color:var(--muted);margin-bottom:6px;}
.hist-bot{display:flex;justify-content:space-between;align-items:center;}
.hist-actions{display:flex;gap:6px;}
.iconsmall{width:30px;height:30px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;}
.filterbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;}
.filterbar select{width:auto;flex:0 0 auto;font-size:12px;padding:8px 10px;}
.rank-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);}
.rank-item:last-child{border-bottom:none;}
.rank-num{font-family:'IBM Plex Mono';font-weight:600;color:var(--amber);width:20px;}
.rank-bar-wrap{flex:1;}
.rank-name{font-size:13px;margin-bottom:4px;}
.rank-bar-bg{background:var(--panel2);border-radius:6px;height:6px;overflow:hidden;}
.rank-bar-fill{height:100%;background:var(--amber);}
.rank-min{font-family:'IBM Plex Mono';font-size:12px;color:var(--muted);width:52px;text-align:right;}
.hidden{display:none !important;}
.fp-wrap{position:relative;border-radius:12px;border:1px solid var(--line);-webkit-overflow-scrolling:touch;}
.fp-inner{position:relative;}
.fp-img{display:block;width:100%;height:auto;border-radius:11px;}
.fp-vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:11px;pointer-events:none;}
.fp-spot{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;}
.fp-dot{width:16px;height:16px;border-radius:50%;background:var(--c);border:2.5px solid #fff;box-shadow:0 0 0 3px color-mix(in srgb, var(--c) 45%, transparent),0 1px 4px rgba(0,0,0,.6);}
.fp-tag{position:absolute;white-space:nowrap;background:rgba(17,20,23,.86);color:#fff;font-size:10px;line-height:1.2;padding:2px 6px;border-radius:7px;border:2px solid var(--c);font-family:'Inter',sans-serif;pointer-events:none;}
.fp-tag b{font-weight:700;}
.fp-alarm .fp-dot{animation:fpPulse 1s ease-in-out infinite;}
@keyframes fpPulse{0%,100%{box-shadow:0 0 0 3px color-mix(in srgb, var(--c) 45%, transparent);}50%{box-shadow:0 0 0 9px color-mix(in srgb, var(--c) 30%, transparent);}}
@media (prefers-reduced-motion: reduce){ .fp-alarm .fp-dot{animation:none;} }
.fp-key{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin:0 3px 0 6px;vertical-align:-1px;}
.fp-key:first-child{margin-left:0;}
.fp-switch{font-family:'Inter',sans-serif;font-size:11px;letter-spacing:0;text-transform:none;padding:4px 10px;border-radius:20px;border:1px solid var(--line);color:var(--muted);cursor:pointer;}
.fp-switch.on{border-color:var(--amber);color:var(--amber);background:var(--amber-dim);}
.fp-sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;}
.fp-sheet{width:100%;max-width:560px;max-height:82vh;overflow:auto;background:var(--panel);border-top:2px solid var(--amber);border-radius:18px 18px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom));}
.fp-sheet .machine-card{cursor:default;}
.cb-hd{border:1.5px solid;border-radius:12px;padding:12px 14px;margin-bottom:10px;}
.cb-big{font-family:'Oswald',sans-serif;font-size:22px;letter-spacing:0.02em;text-transform:uppercase;line-height:1.1;}
.cb-sub{font-size:12.5px;color:var(--muted);margin-top:4px;}
.cb-lbl{font-size:10.5px;color:var(--muted);letter-spacing:0.1em;margin:10px 2px 6px;font-weight:600;}
.cb-row{display:flex;align-items:center;justify-content:space-between;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:6px;}
.cb-nm{font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:0.03em;}
.cb-mut{font-size:12px;color:var(--muted);}
.cb-ppl{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end;}
.cb-p{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;}
.cb-p.ok{background:var(--run-dim);color:var(--run);}
.cb-p.miss{border:1.5px dashed var(--wait);color:var(--wait);}
.cb-p.side{background:var(--amber-dim);color:var(--amber);}
.cb-p.tr{background:rgba(199,125,214,0.15);color:var(--up);}
.cb-tag{font-family:'Inter',sans-serif;font-size:10.5px;padding:2px 8px;border-radius:20px;background:var(--amber-dim);color:var(--amber);margin-left:4px;letter-spacing:0;}
.cb-btn{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 8px;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:0.03em;text-transform:uppercase;cursor:pointer;}
.cb-btn:active{transform:scale(0.97);}
.cb-link{font-size:12px;color:var(--brk);cursor:pointer;text-decoration:underline;}
.cb-legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:10px;}
.cb-legend .cb-p{width:16px;height:16px;}
.cb-legend .cb-p svg{width:9px;height:9px;}
.warnbanner{background:var(--wait-dim);border:1px solid var(--wait);color:var(--wait);padding:12px 14px;border-radius:10px;font-size:13px;margin-bottom:12px;font-weight:600;}
.live-card{background:var(--panel);border:2px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
.live-card.running{border-color:var(--run);}
.live-card.downtime{border-color:var(--change);}
.live-badge{font-size:11px;padding:4px 10px;border-radius:20px;font-weight:700;letter-spacing:0.04em;display:inline-flex;align-items:center;gap:5px;}
.live-badge.idle{background:var(--nowork-dim);color:var(--nowork);}
.live-badge.running{background:var(--run-dim);color:var(--run);}
.live-badge.downtime{background:var(--change-dim);color:var(--change);}
.live-timer{font-family:'IBM Plex Mono';font-size:34px;font-weight:600;color:var(--brk);margin:8px 0 4px;}
.live-segrow{font-size:12.5px;color:var(--muted);line-height:1.5;}
.classtag{font-size:10px;padding:2px 7px;border-radius:6px;font-weight:700;letter-spacing:0.04em;}
.classtag.up{color:var(--up);background:rgba(199,125,214,0.12);}
.classtag.int{color:var(--int);background:rgba(79,179,194,0.12);}
.reporthead{text-align:center;padding:14px 0 20px;}
.reporthead .eyebrow{color:var(--amber);font-size:11px;letter-spacing:0.16em;font-weight:600;}
.reporthead h2{font-size:20px;margin-top:4px;}
.reporthead .sub{color:var(--muted);font-size:13px;margin-top:6px;}
.obs{background:var(--panel2);border-left:3px solid var(--amber);padding:12px 14px;border-radius:8px;font-size:13px;line-height:1.5;color:var(--text);}
.linkrow{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);}
.linkrow:last-child{border-bottom:none;}
.empty{text-align:center;color:var(--muted2);padding:40px 10px;font-size:14px;}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">
      <span class="eyebrow" id="shiftClock">--:--</span>
      <h1 id="pageTitle">Dashboard</h1>
    </div>
    <button class="iconbtn" onclick="Router.go('settings')">⚙</button>
  </div>
  <main id="main"></main>
  <div class="toast" id="toast"></div>
  <nav class="tabbar">
    <div class="tab" data-tab="dashboard" onclick="Router.go('dashboard')"><span class="ic">▦</span>Dashboard</div>
    <div class="tab" data-tab="live" onclick="Router.go('live')"><span class="ic">●</span>Live</div>
    <div class="tab" data-tab="new" onclick="Router.go('new')"><span class="ic">＋</span>New</div>
    <div class="tab" data-tab="history" onclick="Router.go('history')"><span class="ic">☰</span>History</div>
    <div class="tab" data-tab="reports" onclick="Router.go('reports')"><span class="ic">▤</span>Reports</div>
  </nav>
</div>

<script>
/* ============ DATA / CONSTANTS ============ */
const APP_VERSION = 'v125 - 2026-10-21 (Lead Hand / Yield Operator: Move to another station without Off and On again; 3D floor v6: Slicer and Vacuum Sealer get banners like Fajita / Cutlet, bigger and closer together)';
/* RGB colors matching the app's on-screen status colors, used to keep PDF exports visually consistent and scannable */
const PDF_COLOR = {
  amber:[224,160,48], run:[63,163,91], wait:[214,83,74], change:[217,143,43],
  brk:[74,144,217], nowork:[124,132,138], planned:[160,138,84], upstream:[178,110,190], internal:[70,158,172]
};
const MACHINES = ['Variovac 1','Variovac 2','Variovac 3','Manual Pack'];
const PRODUCTS = ['Steak','Burger','Ground Beef','Ground Pork','Ground Bison','Ground Venison','Diced Beef','Diced Pork','Diced Bison','Diced Venison','Meat Box','Rebox','Rework','Relabel','Other'];
const STATUSES = [
  {key:'RUNNING', label:'Running', color:'var(--run)', dim:'var(--run-dim)', pillClass:'run'},
  {key:'CHANGEOVER', label:'Changeover', color:'var(--change)', dim:'var(--change-dim)', pillClass:'change'},
  {key:'WAITING', label:'Waiting', color:'var(--wait)', dim:'var(--wait-dim)', pillClass:'wait'},
  {key:'NO_WORK', label:'No Work Scheduled', color:'var(--nowork)', dim:'var(--nowork-dim)', pillClass:'nowork'},
  {key:'BREAK', label:'Break', color:'var(--brk)', dim:'var(--brk-dim)', pillClass:'brk'},
  {key:'PLANNED', label:'Planned Stop', color:'var(--planned)', dim:'var(--planned-dim)', pillClass:'planned'},
];
const CHANGEOVER_REASONS = ['Product Changeover','Machine Setup','Plate Change','Film Change','Label Change','Cleaning Between Products','Weight Adjustment','Recipe/Program Change','Other'];
/* v98: Planned stops (stretching, crew talk, town hall…) — recorded and shown in reports as their own line, but like Break / No Work they are NOT counted against efficiency, NOT in bottleneck rankings or the Upstream report, and never trigger the red downtime alarm. They still count as paid labour time, so PLH gross includes them and PLH net excludes them, same as any stop. */
const PLANNED_REASONS = ['Scheduled Stretching','Crew Talk','Town Hall Meeting','QA Crew Talk','Metal Detector Test'];
const METAL_DETECTOR_MACHINES = ['Variovac 1','Variovac 2','Variovac 3']; // v100: one-tap Metal Detector button shows on these lines
const WAITING_CATEGORIES = {
  'Upstream / Product': {cls:'upstream', reasons:['Waiting for Trimmer to Start','Waiting for Trimmed Meat','MAREL - Meat Being Cut, Not Ready Yet','MAREL - Meat Ready, but Cutting for Variovac 1','MAREL - Meat Ready, but Cutting for Variovac 2','MAREL - Meat Ready, but Cutting Chicken Muscle for Variovac 3','MAREL - Switching Product','MAREL - Operator on Break','MAREL - Waiting for Trimmed Meat','Waiting for Chicken Muscle (Trimmer Cutting by Hand)','Waiting for Ground Meat','Waiting for Diced Meat','Waiting for Diced Chicken','Waiting for Bison','Waiting for Venison','Waiting for Band Saw Product','Waiting for Band Saw Cut Meat (for Slicer)','Waiting for Fajita','Waiting for Cutlet','Waiting for Slicer','Waiting for End Cut','Waiting for Tenderloin Byproduct','Waiting for Byproduct','Waiting for Product','Waiting for Burger Room Product','Product Not Thawed/Ready','Waiting for Rework','Waiting for Rebox','Waiting for Warehouse to Scan In Product','Product Shortage','Production Department Behind Schedule']},
  'Materials / Warehouse': {cls:'internal', reasons:['Waiting for Boxes','Waiting for Labels','Waiting for Film','Waiting for Skid/Pallet','Waiting for Warehouse Materials','Wrong/Missing Materials']},
  'Machine / Equipment': {cls:'internal', reasons:['Machine Breakdown','Machine Adjustment','Machine Jam','Scale Problem','Sealer Problem','Film/Feed Problem','Electrical/Control Issue','Maintenance','Troubleshooting']},
  'Labour / Operational': {cls:'internal', reasons:['Employee Shortage','Employee Reassigned','Waiting for Operator','Training','Waiting for Management Confirmation/Decision','Label Boxes','Break Coverage Issue','Weighing/Scooping Issue','Box Building','Labeling Issue','Other Operational Delay']},
  'Cleaning / Sanitation': {cls:'internal', reasons:['Required Cleaning','Sanitation Delay','Cleanup After Product','Waiting for Sanitation']},
  'QA / Pre-Op': {cls:'internal', reasons:['Pre-Op Inspection','Waiting for QA','QA Inspection','QA Approval Pending','Product Hold','Weight/Label Verification','Packaging Verification','Allergen Check','Temperature Check','Corrective Action','QA Recheck','Other QA Issue']},
};
function statusInfo(key){ return STATUSES.find(s=>s.key===key); }
function reasonClassification(category){ return WAITING_CATEGORIES[category] ? WAITING_CATEGORIES[category].cls : 'internal'; }
/* When a generic "Other" reason was picked, use the operator's note as the specific label wherever reasons are shown or ranked */
/* v97: MAREL only feeds Variovac 1, 2 and 3 (chicken muscle goes to Variovac 3), so MAREL reasons are hidden on any other machine (Manual Pack). A "Meat Ready, but Cutting … for Variovac N" reason is hidden on Variovac N itself, since a line can't wait on its own meat. If a record being edited already uses a hidden reason, it is still shown (appended) so editing never silently changes saved data. */
const MAREL_MACHINES = ['Variovac 1','Variovac 2','Variovac 3'];
function reasonAllowedForMachine(reason, machine){
  if(!/^MAREL - /.test(reason)) return true;
  if(!MAREL_MACHINES.includes(machine)) return false;
  const m = reason.match(/for (Variovac \d)$/);
  return !(m && m[1]===machine);
}
function reasonsForMachine(cat, machine, current){
  const all = WAITING_CATEGORIES[cat].reasons;
  const list = all.filter(r=>reasonAllowedForMachine(r, machine));
  if(current && all.includes(current) && !list.includes(current)) list.push(current);
  return list;
}
function effectiveReasonLabel(r){
  if(r.reason && /other/i.test(r.reason) && r.notes && r.notes.trim()){ return r.notes.trim(); }
  return REASON_RENAMES[r.reason] || r.reason;
}
/* v88 reason cleanup: old label -> new label. Existing records are migrated on load (migrateReasonLabels) so totals stay combined under one name; effectiveReasonLabel also maps them as a fallback in case an older app version on another device writes an old label. The two removed reasons ("MAREL Cutting Meat for Variovac 1/2") are merged into their closest remaining reason. */
const REASON_RENAMES = {
  'Waiting for MAREL Cut Meat':'MAREL - Meat Being Cut, Not Ready Yet',
  'MAREL Switching Product':'MAREL - Switching Product',
  'MAREL Cutting Chicken Muscle':'MAREL - Meat Ready, but Cutting Chicken Muscle for Variovac 3',
  'Meat Ready but MAREL Cutting for Variovac 1':'MAREL - Meat Ready, but Cutting for Variovac 1',
  'Meat Ready but MAREL Cutting for Variovac 2':'MAREL - Meat Ready, but Cutting for Variovac 2',
  'MAREL Cutting Meat for Variovac 1':'MAREL - Meat Ready, but Cutting for Variovac 1',
  'MAREL Cutting Meat for Variovac 2':'MAREL - Meat Ready, but Cutting for Variovac 2',
  'MAREL Waiting for Trimmed Meat':'MAREL - Waiting for Trimmed Meat',
  'Waiting for Chicken Muscle':'Waiting for Chicken Muscle (Trimmer Cutting by Hand)',
  'Waiting for Chicken Diced':'Waiting for Diced Chicken',
  'Waiting for Band Saw Cut Meat for SLICER':'Waiting for Band Saw Cut Meat (for Slicer)',
  'Waiting for Tenderloin BYPRODUCT':'Waiting for Tenderloin Byproduct',
  'Waiting for BYPRODUCT':'Waiting for Byproduct',
  // v97: MAREL wording — speed vs. priority made explicit
  'MAREL - Waiting for It to Cut Meat':'MAREL - Meat Being Cut, Not Ready Yet',
  'MAREL - Cutting Chicken Muscle':'MAREL - Meat Ready, but Cutting Chicken Muscle for Variovac 3',
  // v108: beef slice comes off the Slicer — merged so those waits sit in one place
  'Waiting for Beef Slice':'Waiting for Slicer'
};
/* Replaces any string value that EXACTLY equals an old reason label, anywhere inside a record (incl. PLH downtime segments). Notes and other free text are never touched because they never match exactly. Returns the number of replacements. */
function renameReasonsDeep(obj){
  let n=0;
  if(Array.isArray(obj)){ obj.forEach((v,i)=>{ if(typeof v==='string' && REASON_RENAMES[v]){ obj[i]=REASON_RENAMES[v]; n++; } else if(v && typeof v==='object') n+=renameReasonsDeep(v); }); }
  else if(obj && typeof obj==='object'){ Object.keys(obj).forEach(k=>{ const v=obj[k]; if(typeof v==='string' && REASON_RENAMES[v]){ obj[k]=REASON_RENAMES[v]; n++; } else if(v && typeof v==='object') n+=renameReasonsDeep(v); }); }
  return n;
}
async function migrateReasonLabels(){
  try{
    if(!Store.ready) return;
    const nR = renameReasonsDeep(Store.records);
    const nD = renameReasonsDeep(Store.dailyReports);
    const nL = renameReasonsDeep(Store.liveRuns);
    if(nR) await Store.saveRecords();
    if(nD) await Store.saveDailyReports();
    if(nL) await Store.saveLiveRuns();
    if(nR+nD+nL) toast(`Updated ${nR+nD+nL} old downtime reason label${nR+nD+nL===1?'':'s'} to the new names`);
  }catch(e){ console.error('reason label migration failed', e); }
}

const Store = {
  ready:false, records:[], dailyReports:[], liveRuns:{}, productLibrary:[], dayLog:{}, settings:{downtimeAlarmMinutes:30}, persisted:true, db:null, _initialLoadDone:false,
  async init(){
    try{
      this.db = firebase.firestore();
      try{ await this.db.enablePersistence({synchronizeTabs:true}); }catch(e){ /* fine — offline cache just won't work in a second open tab */ }

      const recRef = this.db.collection('tracker').doc('records');
      const repRef = this.db.collection('tracker').doc('dailyReports');
      const liveRef = this.db.collection('tracker').doc('liveRuns');
      const prodRef = this.db.collection('tracker').doc('productLibrary');
      const settRef = this.db.collection('tracker').doc('settings');
      const dayRef = this.db.collection('tracker').doc('dayLog');

      const recSnap = await recRef.get();
      this.records = (recSnap.exists && recSnap.data().data) ? JSON.parse(recSnap.data().data) : [];
      const repSnap = await repRef.get();
      this.dailyReports = (repSnap.exists && repSnap.data().data) ? JSON.parse(repSnap.data().data) : [];

      // Live Floor state gets its own local safety net: an in-progress run (segments, staffing, downtime not yet Finished) exists only in memory until it saves. If the network is down right when the app loads or reloads, recover the last known state from this device instead of losing it.
      try{
        const liveSnap = await liveRef.get();
        this.liveRuns = (liveSnap.exists && liveSnap.data().data) ? JSON.parse(liveSnap.data().data) : {};
        safeLocalSet('pct_live_runs_backup', JSON.stringify(this.liveRuns));
      }catch(e){
        console.error('liveRuns fetch failed, falling back to local mirror', e);
        const backupL = safeLocalGet('pct_live_runs_backup');
        try{ this.liveRuns = backupL ? (JSON.parse(backupL)||{}) : {}; }catch(e2){ this.liveRuns = {}; }
        if(backupL && Object.keys(this.liveRuns).length) toast('Offline — recovered your live run from this device');
      }

      const prodSnap = await prodRef.get();
      this.productLibrary = (prodSnap.exists && prodSnap.data().data) ? JSON.parse(prodSnap.data().data) : [];

      try{ const daySnap = await dayRef.get(); this.dayLog = (daySnap.exists && daySnap.data().data) ? JSON.parse(daySnap.data().data) : {}; }catch(e){ this.dayLog = {}; }
      const settSnap = await settRef.get();
      this.settings = (settSnap.exists && settSnap.data().data) ? {...this.settings, ...JSON.parse(settSnap.data().data)} : this.settings;

      // One-time local recovery net: if the cloud looks empty but an old local mirror has data (e.g. mid-migration), restore it up to the cloud
      if(this.records.length===0){
        const backupR = safeLocalGet('pct_records_backup');
        if(backupR){
          try{ const parsed = JSON.parse(backupR); if(Array.isArray(parsed) && parsed.length>0){ this.records = parsed; await recRef.set({data: JSON.stringify(this.records), updatedAt: Date.now()}); toast('Recovered records from local backup'); } }catch(e){}
        }
      }
      this._initialLoadDone = true;
      this.ready = true;

      // Real-time sync: any device that saves updates every other open device automatically
      recRef.onSnapshot(snap=>{
        if(!this._initialLoadDone) return;
        if(snap.exists && snap.data().data){
          this.records = JSON.parse(snap.data().data);
          safeLocalSet('pct_records_backup', snap.data().data);
          if(typeof Router!=='undefined' && Router.current!=='new') render();
        }
      }, err=>{ console.error('records listener error', err); });
      repRef.onSnapshot(snap=>{
        if(!this._initialLoadDone) return;
        if(snap.exists && snap.data().data){
          this.dailyReports = JSON.parse(snap.data().data);
          if(typeof Router!=='undefined' && Router.current!=='new') render();
        }
      }, err=>{ console.error('reports listener error', err); });
      liveRef.onSnapshot(snap=>{
        if(!this._initialLoadDone) return;
        if(snap.exists && snap.data().data){
          this.liveRuns = JSON.parse(snap.data().data);
          safeLocalSet('pct_live_runs_backup', snap.data().data);
          if(typeof Router!=='undefined' && (Router.current==='live'||Router.current==='dashboard')) render();
        }
      }, err=>{ console.error('liveRuns listener error', err); });
      prodRef.onSnapshot(snap=>{
        if(!this._initialLoadDone) return;
        if(snap.exists && snap.data().data){
          this.productLibrary = JSON.parse(snap.data().data);
          if(typeof Router!=='undefined' && (Router.current==='live'||Router.current==='products')) render();
        }
      }, err=>{ console.error('productLibrary listener error', err); });
      dayRef.onSnapshot(snap=>{
        if(!this._initialLoadDone) return;
        if(snap.exists && snap.data().data){
          this.dayLog = JSON.parse(snap.data().data);
          if(typeof Router!=='undefined' && (Router.current==='live'||Router.current==='dashboard')) render();
        }
      }, err=>{ console.error('dayLog listener error', err); });
      settRef.onSnapshot(snap=>{
        if(!this._initialLoadDone) return;
        if(snap.exists && snap.data().data){
          this.settings = {...this.settings, ...JSON.parse(snap.data().data)};
          if(typeof Router!=='undefined' && Router.current==='dashboard') render();
        }
      }, err=>{ console.error('settings listener error', err); });
    }catch(e){
      console.error('Storage init failed', e);
      window._lastStorageError = String(e && e.message || e);
      this.ready = false;
      showStorageWarning();
    }
  },
  async refreshRecords(){
    try{
      const snap = await this.db.collection('tracker').doc('records').get({source:'server'});
      if(snap.exists && snap.data().data) this.records = JSON.parse(snap.data().data);
      return true;
    }catch(e){
      try{
        const snap = await this.db.collection('tracker').doc('records').get();
        if(snap.exists && snap.data().data) this.records = JSON.parse(snap.data().data);
        return true;
      }catch(e2){ console.error('refreshRecords failed', e2); return false; }
    }
  },
  async saveRecords(){
    try{
      const json = JSON.stringify(this.records);
      await this.db.collection('tracker').doc('records').set({data: json, updatedAt: Date.now()});
      safeLocalSet('pct_records_backup', json);
      hideStorageWarning();
      return true;
    }catch(e){ console.error('save records failed', e); window._lastStorageError = String(e && e.message || e); showStorageWarning(); return false; }
  },
  async saveProductLibrary(){
    try{
      await this.db.collection('tracker').doc('productLibrary').set({data: JSON.stringify(this.productLibrary), updatedAt: Date.now()});
      return true;
    }catch(e){ console.error('save productLibrary failed', e); toast('Save failed — check connection'); return false; }
  },
  async saveDayLog(){
    try{
      await this.db.collection('tracker').doc('dayLog').set({data: JSON.stringify(this.dayLog||{}), updatedAt: Date.now()});
      return true;
    }catch(e){ console.error('save dayLog failed', e); toast('Save failed — check connection'); return false; }
  },
  async saveSettings(){
    try{
      await this.db.collection('tracker').doc('settings').set({data: JSON.stringify(this.settings), updatedAt: Date.now()});
      return true;
    }catch(e){ console.error('save settings failed', e); toast('Save failed — check connection'); return false; }
  },
  async saveDailyReports(){
    try{
      await this.db.collection('tracker').doc('dailyReports').set({data: JSON.stringify(this.dailyReports), updatedAt: Date.now()});
      hideStorageWarning();
      return true;
    }catch(e){ console.error('save reports failed', e); window._lastStorageError = String(e && e.message || e); showStorageWarning(); return false; }
  },
  async saveLiveRuns(){
    const json = JSON.stringify(this.liveRuns);
    safeLocalSet('pct_live_runs_backup', json); // mirror locally first — this is what keeps an in-progress run safe even if the network write below fails
    try{
      await this.db.collection('tracker').doc('liveRuns').set({data: json, updatedAt: Date.now()});
      return true;
    }catch(e){ console.error('save liveRuns failed', e); toast('Live sync failed — kept safe on this device, will sync next time you update this run'); return false; }
  }
};
function safeLocalGet(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
function safeLocalSet(key, val){ try{ localStorage.setItem(key, val); return true; }catch(e){ return false; } }
function showStorageWarning(){
  const isTerminated = String(window._lastStorageError||'').toLowerCase().includes('terminated');
  const banner = isTerminated
    ? '<div class="warnbanner">CONNECTION NEEDS A REFRESH. Tap the ⟳ reload button in your browser (or pull down to refresh), then try saving again — your data is safe, this just needs a fresh connection.</div>'
    : '<div class="warnbanner">DATA STORAGE IS NOT AVAILABLE. DO NOT ENTER PRODUCTION DATA UNTIL STORAGE IS FIXED. Use Export/Backup in Settings to save your work manually, then reopen the app to retry.</div>';
  const m = document.getElementById('main');
  if(m && !document.getElementById('storageWarning')){
    const d = document.createElement('div'); d.id='storageWarning'; d.innerHTML = banner;
    m.prepend(d);
  }
  toast('Save failed — retrying was unsuccessful');
}
function hideStorageWarning(){
  const el = document.getElementById('storageWarning');
  if(el) el.remove();
}

function localDateStr(d){ d = d || new Date(); const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function todayStr(){ return localDateStr(new Date()); }
function fmtDate(iso){ const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function toMin(t){ if(!t) return null; const [h,m]=t.split(':').map(Number); return h*60+m; }
/* v116: no wrapping past midnight — the shift never crosses midnight, so a finish earlier than the start is a mistake and counts as 0 (it used to count as ~24 h) */
function duration(start,end){ let s=toMin(start), e=toMin(end); if(s==null||e==null) return 0; const d=e-s; return d>0 ? d : 0; }
/* v116: an entry left open on an earlier day is closed at the 4:30 PM shift end (or at its own start if it began after that) — never stretched overnight */
function pastOpenEnd(start){ return toMin(start) >= 16*60+30 ? start : '16:30'; }
function fmtDur(min){ min=Math.round(min); const h=Math.floor(min/60), m=min%60; return h>0? `${h}h ${m}m` : `${m}m`; }
function fmtTime12(t){ if(!t) return '--'; const parts=t.split(':'); let h=Number(parts[0]), m=Number(parts[1]); if(isNaN(h)||isNaN(m)) return '--'; const ap=h>=12?'PM':'AM'; h=h%12; if(h===0)h=12; return `${h}:${String(m).padStart(2,'0')} ${ap}`; }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),1600); }
function uid(){ return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ============ AGGREGATION HELPERS ============ */
function recordsForDate(date){ return Store.records.filter(r=>r.date===date); }
function machineTotals(recs, machine){
  const t = {RUNNING:0,CHANGEOVER:0,WAITING:0,NO_WORK:0,BREAK:0,PLANNED:0, upstream:0, internal:0};
  recs.filter(r=>r.machine===machine).forEach(r=>{
    t[r.status]=(t[r.status]||0)+r.durationMin;
    if(r.status==='WAITING'){ if(r.classification==='upstream') t.upstream+=r.durationMin; else t.internal+=r.durationMin; }
  });
  return t;
}
/* Efficiency = Running ÷ (Running + Waiting + Changeover) — excludes No Work Scheduled and Break, which aren't the machine's fault */
function efficiencyPct(mt){
  const scheduled = (mt.RUNNING||0)+(mt.WAITING||0)+(mt.CHANGEOVER||0);
  if(scheduled<=0) return null;
  return Math.round((mt.RUNNING||0)/scheduled*100);
}
function efficiencyColor(pct){
  if(pct===null) return 'var(--muted)';
  if(pct>=85) return 'var(--run)';
  if(pct>=60) return 'var(--change)';
  return 'var(--wait)';
}
/* Merges overlapping/adjacent time windows into their real combined span — e.g. 9:30-10:00, 9:45-10:15, 10:00-10:30 across three machines becomes one 9:30-10:30 span, not three separate 30-min blocks summed */
function mergeIntervals(intervals){
  if(!intervals.length) return [];
  const sorted = intervals.slice().sort((a,b)=>a.start-b.start);
  const merged = [{...sorted[0]}];
  for(let i=1;i<sorted.length;i++){
    const last = merged[merged.length-1];
    const cur = sorted[i];
    if(cur.start <= last.end){ last.end = Math.max(last.end, cur.end); }
    else { merged.push({...cur}); }
  }
  return merged;
}
/* Total real-world break time for the whole shift — staggered breaks across machines merge into actual elapsed time rather than being summed per-machine. Groups by date first so a multi-day range (Weekly Summary) doesn't merge across different days. */
function totalBreakMinutes(recs){
  const byDate = {};
  recs.filter(r=>r.status==='BREAK').forEach(r=>{
    if(!byDate[r.date]) byDate[r.date]=[];
    let s=toMin(r.startTime), e=toMin(r.endTime); if(e<s) e=s;
    byDate[r.date].push({start:s,end:e});
  });
  let total = 0;
  Object.values(byDate).forEach(intervals=>{
    mergeIntervals(intervals).forEach(iv=>{ total += (iv.end-iv.start); });
  });
  return total;
}
function dayTotals(recs){
  const t = {RUNNING:0,CHANGEOVER:0,WAITING:0,NO_WORK:0,BREAK:0,PLANNED:0, upstream:0, internal:0};
  recs.forEach(r=>{
    if(r.status!=='BREAK'){ t[r.status]=(t[r.status]||0)+r.durationMin; }
    if(r.status==='WAITING'){ if(r.classification==='upstream') t.upstream+=r.durationMin; else t.internal+=r.durationMin; }
  });
  t.BREAK = totalBreakMinutes(recs);
  return t;
}
/* Groups all Waiting/Changeover time across a date range by specific reason (not per-machine, unless a machine filter is applied) — this is what lets a plant-wide recurring pattern like "MAREL Switching Product" show its true combined impact instead of being hidden across 3 separate machine totals. Tracks which machines it actually hit so an isolated-machine issue is still distinguishable from a systemic one. */
function computeDowntimeAnalysis(start, end, machineFilter){
  let recs = Store.records.filter(r=>r.date>=start && r.date<=end && (r.status==='WAITING'||r.status==='CHANGEOVER'));
  if(machineFilter) recs = recs.filter(r=>r.machine===machineFilter);
  const groups = {};
  recs.forEach(r=>{
    const label = effectiveReasonLabel(r) || r.status;
    if(!groups[label]) groups[label] = {reason:label, classification:r.classification, status:r.status, totalMin:0, count:0, machines:new Set()};
    groups[label].totalMin += r.durationMin;
    groups[label].count++;
    groups[label].machines.add(r.machine);
  });
  const totalDowntimeMin = recs.reduce((a,r)=>a+r.durationMin,0);
  const list = Object.values(groups).map(g=>({...g, machines:[...g.machines].sort(), avgMin: g.totalMin/g.count})).sort((a,b)=>b.totalMin-a.totalMin);
  return {list, totalDowntimeMin};
}
/* Flags a downtime reason as needing priority attention based on two independent signals: it keeps recurring (count) or it's quietly eating large total time (totalMin) — either alone is worth flagging, since a short-but-frequent issue and a rare-but-long one are both real problems, just different shapes. Top-3 by total time always counts as highest priority regardless of count, since that's the biggest lever regardless of pattern. */
function downtimeSeverityFlag(item, rankIndex){
  if(rankIndex<3 || item.count>=5 || item.totalMin>=120) return {level:'critical', label:'🔴 HIGHEST PRIORITY', color:'var(--wait)'};
  if(item.count>=3 || item.totalMin>=60) return {level:'watch', label:'🟡 WATCH', color:'var(--change)'};
  return {level:'normal', label:'', color:'var(--amber)'};
}
function bottlenecks(recs, limit){
  const map = {};
  recs.filter(r=>r.status==='WAITING' || r.status==='CHANGEOVER').forEach(r=>{
    const key = effectiveReasonLabel(r) || r.status;
    map[key] = (map[key]||0)+r.durationMin;
  });
  return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,limit||5);
}
/* Collects a couple of real operator notes behind each ranked bottleneck, so reports show the actual floor context (e.g. which specific product/machine) rather than just the bucket label */
function bottleneckNotesFor(recs, label, max){
  max = max || 2;
  const seen = new Set(); const notes = [];
  recs.filter(r=>(r.status==='WAITING'||r.status==='CHANGEOVER') && effectiveReasonLabel(r)===label && r.notes && r.notes.trim()).forEach(r=>{
    const n = r.notes.trim();
    if(n===label) return; // avoid echoing the label back when it was itself sourced from this note (the "Other" case)
    if(!seen.has(n) && notes.length<max){ seen.add(n); notes.push(n); }
  });
  return notes;
}
/* Finds which category/status a bottleneck label came from, for the suggestion engine — looks past the "Other"-swap to the real underlying record */
function bottleneckCategory(recs, label){
  const rec = recs.find(r=>(r.status==='WAITING'||r.status==='CHANGEOVER') && effectiveReasonLabel(r)===label);
  if(!rec) return null;
  return rec.status==='CHANGEOVER' ? 'Changeover' : rec.reasonCategory;
}
function machineMostWaiting(recs){
  let best=null,bestMin=-1;
  MACHINES.forEach(m=>{
    const min = recs.filter(r=>r.machine===m && r.status==='WAITING').reduce((s,r)=>s+r.durationMin,0);
    if(min>bestMin){bestMin=min;best=m;}
  });
  return {machine:best, minutes:bestMin};
}

const SIDE_MACHINES = [ {name:'Fajita', max:2}, {name:'Slicer', max:1}, {name:'Cutlet', max:1}, {name:'Vacuum Sealer', max:2} ];
const LINE_NEED = {'Variovac 1':2, 'Variovac 2':2, 'Variovac 3':2, 'Manual Pack':2}; // v119: Manual Pack needs 2 — one can step to a side machine while one stays for reboxes

async function editOfflineTime(id, field, val){ const d = ensureDayLog(todayStr()); const cur = (d.offline||[]).find(x=>x.id===id); if(!cur || !val) return; cur[field] = val; await saveDayLogNow(); }

let offlineLogOpen = false;
let crewEdit = false, marelEdit = false, sideLogOpen = false;
function dayLogFor(date){ return (Store.dayLog||{})[date] || null; }
function ensureDayLog(date){ Store.dayLog = Store.dayLog || {}; return Store.dayLog[date] = Store.dayLog[date] || {crew:null, crewAt:'', marelStart:'', marelEnd:'', side:[]}; }
/* v119: crew timeline — dayLog[date].crewLog = [{id, at:'HH:MM', n, reason}]. Every change in the day is kept with its time (someone goes home, arrives late…). Older days that only have `crew` read as one entry. d.crew / d.crewAt always mirror the latest entry so older code keeps working. */
const CREW_REASONS = ['Went home','Arrived late','Moved to another department','Other'];
let crewChange = null, crewLogOpen = false;
function crewTimeline(date){
  const d = dayLogFor(date); if(!d) return [];
  if(Array.isArray(d.crewLog) && d.crewLog.length) return d.crewLog.slice().sort((a,b)=>toMin(a.at)-toMin(b.at));
  return d.crew!=null ? [{id:'c0', at: d.crewAt||'08:00', n: d.crew, reason:''}] : [];
}
function crewNowFor(date){ const t = crewTimeline(date); return t.length ? t[t.length-1].n : null; }
function crewLabel(date, short){
  const t = crewTimeline(date); if(!t.length) return '';
  if(t.length===1) return String(t[0].n);
  if(short) return t.map(e=>e.n).join('→');
  return t.map((e,i)=> `${e.n} from ${fmtTime12(e.at)}${i>0 && e.reason ? ` (${e.reason.toLowerCase()})` : ''}`).join(' → ');
}
function syncCrewMirror(d){ const t = (d.crewLog||[]).slice().sort((a,b)=>toMin(a.at)-toMin(b.at)); d.crewLog = t; d.crew = t.length ? t[t.length-1].n : null; d.crewAt = t.length ? t[t.length-1].at : ''; }
/* v119: lead hand / yield operator — in today (default) or off today */
function roleIn(date, role){ const d = dayLogFor(date); return !(d && d.roles && d.roles[role]==='off'); }
async function setRoleIn(role, isIn){
  if(!isIn && openOffline(todayStr()).some(o=>o.role===role)){ toast(`${role} is on the line — tap Off first`); return; }
  const d = ensureDayLog(todayStr()); d.roles = d.roles || {}; d.roles[role] = isIn ? 'in' : 'off';
  if(!isIn && offlineSetup && offlineSetup.role===role) offlineSetup = null;
  await saveDayLogNow();
}
function rolesLabel(date){
  return OFFLINE_ROLES.filter(r=>roleIn(date,r)).map(r=>{ const o = date===todayStr() ? openOffline(date).find(x=>x.role===r) : null; return o ? `${r} (on ${o.where})` : r; }).join(' + ');
}
/* v119: an entry still open today stops counting at the 4:30 PM shift end — the real time can be fixed in the log */
function openEndToday(start){ const n = nowHHMM(); return (toMin(n) > SHIFT_END_MIN && toMin(start) < SHIFT_END_MIN) ? '16:30' : n; }
function openAfterShift(){
  if(toMin(nowHHMM()) <= SHIFT_END_MIN) return [];
  const t = todayStr();
  return [...openOffline(t).filter(o=>toMin(o.start)<SHIFT_END_MIN).map(o=>`${o.role} (${o.where})`), ...openSideRuns(t).filter(x=>toMin(x.start)<SHIFT_END_MIN).map(x=>x.machine)];
}
function openSideRuns(date){ const d = dayLogFor(date); return d ? (d.side||[]).filter(s=>!s.end) : []; }
function lineStaffNow(m){
  const live = Store.liveRuns[m];
  if(!live || !live.segments || !live.segments.length) return {active:false};
  if(isStaleLive(live)) return {active:false, stale:true}; // v116: left open from an earlier day — not today's staffing
  const openDt = (live.downtimeSegments||[])[live.downtimeSegments.length-1];
  if(live.status!=='RUNNING' && openDt && !openDt.end && openDt.status==='NO_WORK') return {active:false, noWork:true}; // v116: No Work Scheduled needs nobody
  const lastSeg = live.segments[live.segments.length-1];
  const n = (live.pendingEmployees!=null && live.status!=='RUNNING') ? live.pendingEmployees : (lastSeg ? lastSeg.employees : null);
  return {active:true, staff: (n==null || isNaN(n)) ? null : Number(n), status: live.status};
}
function crewSnapshot(){
  const date = todayStr(), d = dayLogFor(date);
  const lines = MACHINES.map(m=>{ const s = lineStaffNow(m); return {m, ...s, need: s.active ? (LINE_NEED[m]||0) : 0}; });
  const side = openSideRuns(date);
  const sidePack = side.reduce((a,s)=>a+(s.pack||0),0), sideTrim = side.reduce((a,s)=>a+(s.trim||0),0);
  const counted = lines.filter(l=>l.active && l.staff!=null);
  const onLines = counted.reduce((a,l)=>a+l.staff,0);
  const needed = counted.reduce((a,l)=>a+l.need,0);
  const short = counted.reduce((a,l)=>a+Math.max(0, l.need-l.staff),0);
  const shortLines = counted.filter(l=>l.staff<l.need).map(l=>({m:l.m, d:l.need-l.staff}));
  const notEntered = lines.filter(l=>l.active && l.staff==null).map(l=>l.m);
  const crew = crewNowFor(date);
  // v116: lead hand / yield operator working a line are inside that line's headcount but not in the crew number, so add them back
  const offOnLines = openOffline(date).filter(o=>MACHINES.includes(o.where)).length;
  const spare = crew!=null ? crew - (onLines - offOnLines) - sidePack : null;
  return {date, d, lines, side, sidePack, sideTrim, onLines, needed, short, shortLines, notEntered, crew, spare};
}

/* v122: side machines follow the Variovac break. When every Variovac on the Live Floor is on Break, any side machine that is on
   pauses at the time the last Variovac went on break; when the first Variovac comes back from Break, it restarts with the same crew
   at that time. Times come from the Live Floor entries, so whichever device opens the tracker next fixes it, at the right times. */
const VARIOVACS = ['Variovac 1','Variovac 2','Variovac 3'];
function variovacBreakState(){
  const act = VARIOVACS.map(m=>({m, live:Store.liveRuns[m]})).filter(x=>x.live && !isStaleLive(x.live) && lineStaffNow(x.m).active);
  if(!act.length) return {any:false};
  const open = act.map(x=>{ const dts = x.live.downtimeSegments||[], o = dts[dts.length-1]; return (x.live.status!=='RUNNING' && o && !o.end && o.status==='BREAK') ? o : null; });

function breakEndAfter(t){
  const ends = [];
  VARIOVACS.forEach(m=>{ const live = Store.liveRuns[m]; if(!live) return; (live.downtimeSegments||[]).forEach(o=>{ if(o.status==='BREAK' && o.end && o.end>=t) ends.push(o.end); }); });
  return ends.sort()[0] || nowHHMM();
}
let sideBreakBusy = false;
async function syncSideBreaks(){
  if(sideBreakBusy || !Store.ready) return;
  const date = todayStr(), d = dayLogFor(date);
  if(!d) return;
  const b = variovacBreakState();
  let changed = false, msg = '';
  if(b.any && b.all && !d.breakPause){
    const runs = (d.side||[]).filter(x=>!x.end && x.start < b.start);
    if(runs.length){
      runs.forEach(x=>{ x.end = b.start; x.breakPaused = true; });
      d.breakPause = {start: b.start, ids: runs.map(x=>x.id)};
      changed = true; msg = `${runs.map(x=>x.machine).join(', ')} paused for break`;
    }

    const at = breakEndAfter(d.breakPause.start), back = [];
    (d.side||[]).filter(x=>d.breakPause.ids.includes(x.id)).forEach(x=>{
      if((d.side||[]).some(y=>y.machine===x.machine && !y.end)) return; // already restarted by hand
      d.side.push({id: uid(), machine: x.machine, start: at, end: null, pack: x.pack, trim: x.trim, afterBreak: true});
      back.push(x.machine);

function breakPausedRun(date, machine){

async function dontRestartSide(id){

  const info = lastDt ? statusInfo(lastDt.status) : null;
  const alarm = !!(lastDt && !lastDt.end && (lastDt.status==='WAITING'||lastDt.status==='CHANGEOVER') && elapsedMinutesSince(lastDt.start) >= (Store.settings.downtimeAlarmMinutes||30));
  return {color: info ? info.color : 'var(--change)', label: info ? info.label : 'Downtime', reason: lastDt && lastDt.reason, alarm, mins: lastDt && !lastDt.end ? elapsedMinutesSince(lastDt.start) : null};
}
/* Lines waiting right now on an upstream department (MAREL / Trimmers / Band Saw), from the open downtime on each Live Floor run */
function linesWaitingOn(dept){
  const out = [];
  MACHINES.forEach(m=>{
    const live = Store.liveRuns[m]; if(!live || live.status==='RUNNING') return;
    const d = (live.downtimeSegments||[])[live.downtimeSegments.length-1];
    if(d && !d.end && d.status==='WAITING' && upstreamDeptFor(d.reason)===dept) out.push({m, reason:REASON_RENAMES[d.reason]||d.reason, mins:elapsedMinutesSince(d.start)});

  MACHINES.forEach(m=>{ const live = Store.liveRuns[m]; if(!live || live.date!==today) return;
    (live.downtimeSegments||[]).forEach(d=>{ if(d.status==='WAITING' && upstreamDeptFor(d.reason)===dept) min += d.end ? duration(d.start,d.end) : elapsedMinutesSince(d.start); }); });

/* ============ LIVE FLOOR TRACKING ============ */
function nowHHMM(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
/* ---- PLH Reporting (aggregates the structured plh data attached to finished Live Entry runs) ---- */
function plhRecordsInRange(startDate, endDate){
  return Store.records.filter(r=>r.plh && r.plh.grossPLH!=null && r.date>=startDate && r.date<=endDate);
}
/* Live Entry runs that finished without Quantity/Weight entered — still have full staffing/timing detail preserved, just missing the numbers needed to compute PLH */
function incompletePLHRecordsInRange(startDate, endDate){
  return Store.records.filter(r=>r.plh && r.plh.grossPLH==null && r.date>=startDate && r.date<=endDate);
}
/* v99: Same product run in several pieces on the same machine on the same day (e.g. stopped waiting for strogi/trim, then restarted) is ONE job. Runs are combined by date + machine + product (product ID if set, otherwise the product name). Combined PLH = total lbs ÷ total labour hours across all its runs — never an average of the runs' PLH, so a short run can't skew it. Each run is still kept (job.runs) so its time window and staffing stay visible. Single runs pass through unchanged. */
function plhJobKey(r){
  const pid = String((r.plh && r.plh.productId) || '').trim().toLowerCase();
  const pname = String((r.plh && r.plh.product) || r.product || '').trim().toLowerCase();
  return `${r.date}|${r.machine}|${pid || pname}`;
}
function groupPLHJobs(recs){
  const groups = {};
  recs.slice().sort((a,b)=> a.date.localeCompare(b.date) || toMin(a.startTime)-toMin(b.startTime)).forEach(r=>{
    (groups[plhJobKey(r)] = groups[plhJobKey(r)] || []).push(r);
  });
  return Object.values(groups).map(runs=>{
    if(runs.length===1) return {...runs[0], runs, ids:[runs[0].id]};
    const first = runs[0];
    const weightLbs = runs.reduce((a,r)=>a+(r.plh.weightLbs||0),0);
    const quantity = runs.reduce((a,r)=>a+(r.plh.quantity||0),0);
    const grossLaborHours = runs.reduce((a,r)=>a+(r.plh.grossLaborHours||0),0);
    const netLaborHours = runs.reduce((a,r)=>a+(r.plh.netLaborHours||0),0);
    const tgt = runs.find(r=>r.plh.targetPLH);
    return {
      ...first, runs, ids: runs.map(r=>r.id),
      endTime: runs[runs.length-1].endTime,
      plh: {
        ...first.plh, weightLbs, quantity, grossLaborHours, netLaborHours,
        grossPLH: grossLaborHours>0 ? weightLbs/grossLaborHours : 0,
        netPLH: netLaborHours>0 ? weightLbs/netLaborHours : null,
        targetPLH: tgt ? tgt.plh.targetPLH : null,
        segments: runs.flatMap((r,ri)=>(r.plh.segments||[]).map(seg=>({...seg, run:ri+1}))),
        downtimeSegments: runs.flatMap((r,ri)=>(r.plh.downtimeSegments||[]).map(d=>({...d, run:ri+1})))
      }
    };
  });
}
function computePLHSummary(recs){
  const totalWeight = recs.reduce((a,r)=>a+(r.plh.weightLbs||0),0);
  const totalQty = recs.reduce((a,r)=>a+(r.plh.quantity||0),0);
  const totalGrossHours = recs.reduce((a,r)=>a+(r.plh.grossLaborHours||0),0);
  const totalNetHours = recs.reduce((a,r)=>a+(r.plh.netLaborHours||0),0);
  const grossPLH = totalGrossHours>0 ? totalWeight/totalGrossHours : 0;
  const netPLH = totalNetHours>0 ? totalWeight/totalNetHours : 0;
  const jobs = groupPLHJobs(recs);
  let best=null, worst=null;
  jobs.forEach(r=>{ if(!best || r.plh.grossPLH>best.plh.grossPLH) best=r; if(!worst || r.plh.grossPLH<worst.plh.grossPLH) worst=r; });
  const withTarget = jobs.filter(r=>r.plh.targetPLH);
  const avgTarget = withTarget.length ? withTarget.reduce((a,r)=>a+r.plh.targetPLH,0)/withTarget.length : null;
  return {totalWeight, totalQty, totalGrossHours, totalNetHours, grossPLH, netPLH, best, worst, avgTarget, runCount:jobs.length, rawRunCount:recs.length}; // runCount = jobs (same product combined)
}
function renderPLHCard(summary, title){
  if(summary.runCount===0) return `<div class="card"><h3>${title}</h3><div class="empty">No finished runs with weight recorded yet.</div></div>`;

    const variance = summary.grossPLH - summary.avgTarget;
    const pct = variance/summary.avgTarget*100;
    const good = variance>=0;
    return `<div style="color:${good?'var(--run)':'var(--wait)'};font-size:12.5px;font-weight:600;margin-top:6px;">${good?'+':''}${variance.toFixed(0)} PLH vs target (${summary.avgTarget.toFixed(0)}) · ${good?'+':''}${pct.toFixed(0)}%</div>`;
  })() : '<div style="color:var(--muted);font-size:12px;margin-top:6px;">No target data for this period</div>';
  return `<div class="card">
    <h3>${title}</h3>

function dailyPLHSeries(startDate, endDate){
  const recs = plhRecordsInRange(startDate, endDate);
  const byDate = {};
  recs.forEach(r=>{ if(!byDate[r.date]) byDate[r.date]={weight:0,hours:0}; byDate[r.date].weight+=r.plh.weightLbs; byDate[r.date].hours+=r.plh.grossLaborHours; });
  return Object.keys(byDate).sort().map(d=>({date:d, plh: byDate[d].hours>0 ? byDate[d].weight/byDate[d].hours : 0}));
}
function renderPLHTrendChart(series){
  if(!series.length) return '<div class="empty">No PLH data in this range yet.</div>';
  const W=340,H=110,padL=4,padR=4,padB=20,padT=8;
  const chartW=W-padL-padR, chartH=H-padT-padB;
  const maxVal = Math.max(1, ...series.map(d=>d.plh));
  const n=series.length, barGap=4;
  const barW = Math.max(3,(chartW-barGap*(n-1))/n);
  let bars='', labels='';
  const labelEvery = n>14?Math.ceil(n/7):(n>7?2:1);
  series.forEach((d,i)=>{
    const x=padL+i*(barW+barGap);
    const h=(d.plh/maxVal)*chartH;
    const y=padT+(chartH-h);
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(1,h).toFixed(1)}" rx="2" fill="var(--brk)"><title>${fmtDate(d.date)}: ${d.plh.toFixed(0)} PLH</title></rect>`;
    if(i%labelEvery===0||i===n-1){
      const dl = new Date(d.date+'T00:00:00').toLocaleDateString('en-US',{month:'numeric',day:'numeric'});
      labels += `<text x="${(x+barW/2).toFixed(1)}" y="${H-4}" font-size="8" fill="var(--muted2)" text-anchor="middle" font-family="IBM Plex Mono">${dl}</text>`;
    }
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;">
    <line x1="${padL}" y1="${padT+chartH}" x2="${W-padR}" y2="${padT+chartH}" stroke="var(--line)" stroke-width="1"/>
    ${bars}${labels}
  </svg><div style="font-size:11px;color:var(--muted);margin-top:6px;">Daily Gross PLH</div>`;
}

function plhPresetRange(preset){
  const now = new Date(); const today = localDateStr(now);
  if(preset==='yesterday'){ const d=new Date(now); d.setDate(d.getDate()-1); const s=localDateStr(d); return {start:s,end:s}; }
  if(preset==='7days'){ const d=new Date(now); d.setDate(d.getDate()-6); return {start:localDateStr(d), end:today}; }
  if(preset==='30days'){ const d=new Date(now); d.setDate(d.getDate()-29); return {start:localDateStr(d), end:today}; }
  if(preset==='thisWeek'){ const d=new Date(now); const day=d.getDay(); const diffToMon=(day===0?6:day-1); const mon=new Date(d); mon.setDate(d.getDate()-diffToMon); return {start:localDateStr(mon), end:today}; }
  return {start:today, end:today}; // 'today' / default
}

/* Shared HTML→PDF builder for the PLH and Upstream Impact reports.
v92 fixes (found from a real iPhone export):
 1. Blank space above the header + content cut mid-card: html2canvas captures relative to the page's CURRENT scroll position, so exporting after scrolling down (the Export button sits at the bottom of a long view) shifted the whole report down the page and threw off the page breaks. Fix: scroll to the top first and pass scrollX/scrollY 0, then restore the user's scroll.
 2. White strip down the right side: a Letter page is 816px wide in html2pdf's layout, but the reports were 720px — so they never filled the page. Fix: the report is widened to the page width.
 3. Content touching the paper edge on page 2+: a 20pt top/bottom page margin on every page. */
const PDF_PAGE_WIDTH_PX = 816;
async function buildHtmlReportPDF(html, filename){
  const savedScroll = window.scrollY;
  window.scrollTo(0, 0);
  const backdrop = document.createElement('div');
  backdrop.style.cssText = 'position:fixed;inset:0;z-index:99997;background:#111;display:block;overflow:auto;padding:30px 0;'; // v93: report pinned to the LEFT edge (was centred). On a wide screen (MacBook) centring put it ~300px from the left, but html2canvas re-draws the page at the report's own 816px width (where it sits at x=0) while still cropping from the original ~300px offset, so the PDF came out shifted left with a blank strip on the right. Phones never showed it because their screen is narrower than the report, so it already started at x=0.
  const banner = document.createElement('div');
  banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#1e3a5f;color:#fff;text-align:center;padding:10px;font-family:Arial;font-size:13px;';
  banner.textContent = 'Building your PDF report…';
  const container = document.createElement('div');
  container.innerHTML = html;
  const reportEl = container.firstElementChild;
  reportEl.style.width = PDF_PAGE_WIDTH_PX + 'px';
  reportEl.style.boxSizing = 'border-box';
  backdrop.appendChild(container);
  document.body.appendChild(backdrop);
  document.body.appendChild(banner);
  toast('Building PDF…');
  try{
    const pdfBlob = await html2pdf().set({
      margin: [20, 0, 20, 0],
      filename,
      html2canvas: {scale:2, useCORS:true, scrollX:0, scrollY:0, windowWidth: Math.max(window.innerWidth, PDF_PAGE_WIDTH_PX)}, // v94: html2pdf centres its own capture box in the window (margin:auto). On a wide screen (MacBook) that box sits ~300px from the left; forcing the snapshot window to 816px moved it to 0 while the crop still started at ~300px, so the PDF came out shifted left. The snapshot window must match the real window when it's wider than the page; phones (narrower) still use 816px, which already worked.
      jsPDF: {unit:'pt', format:'letter', orientation:'portrait'},
      pagebreak: {mode:['css','avoid-all']}
    }).from(reportEl).outputPdf('blob');
    showPLHReportPreview(pdfBlob, filename);
  }catch(e){
    console.error('PDF export failed', e);
    toast('PDF export failed');
  }finally{
    backdrop.remove(); banner.remove();
    window.scrollTo(0, savedScroll);
  }
}

/* Safari (iOS and macOS alike) is unreliable at rendering a PDF purely from an in-memory blob: URL, whether embedded in an iframe or opened directly in a new tab — confirmed blank on both approaches, on both devices, even with pop-ups explicitly allowed. The one thing that's always been reliable is a real file: triggering an actual download, so Preview.app / the Files app / the iOS share sheet are handling a genuine saved PDF rather than a transient in-browser reference. */
function showPLHReportPreview(blob, filename){

  a.click();
  document.body.removeChild(a);

}

function exportPLHLogCSV(){

  const rowFor = r=>{

  };

  const machineOrder = [...MACHINES, ...[...new Set(recs.map(r=>r.machine))].filter(m=>!MACHINES.includes(m)).sort()];
  const lines = [headers.join(',')];

async function resumeAllLineStop(gid){
  if(allLineBusy) return;
  const g = openAllLineStops().find(x=>x.id===gid);
  if(!g) return;
  allLineBusy = true;
  try{
    const now = nowHHMM();
    let resumed = 0, ended = 0, restored = 0;
    for(const m of g.machines){
      const live = Store.liveRuns[m];
      const plannedDt = live.downtimeSegments[live.downtimeSegments.length-1];
      if(plannedDt.resumeTo){
        // Line was stopped for another reason before the event — go back to that same reason, still stopped
        plannedDt.end = now;
        live.downtimeSegments.push({start: now, end:null, ...plannedDt.resumeTo, notes:''});
        restored++;
      } else if(live.segments.length){
        // Line was producing before the event — close the planned segment and carry on producing
        const lastDt = live.downtimeSegments[live.downtimeSegments.length-1];
        lastDt.end = now;
        const lastSeg = live.segments[live.segments.length-1];
        const emp = (live.pendingEmployees!=null) ? live.pendingEmployees : lastSeg.employees;
        live.segments.push({start: now, end:null, employees: emp});
        delete live.pendingEmployees;
        live.status = 'RUNNING';
        resumed++;
      } else {
        // Line had no production run (idle before the event) — save the planned stop to History and clear the line
        const result = await closeOutLiveRun(m, {});
        if(!result){ toast('Save failed — check connection'); return; }
        delete Store.liveRuns[m];
        ended++;
      }
    }
    const ok = await Store.saveLiveRuns();
    if(!ok){ toast('Save failed — check connection'); return; }
    toast(`${g.reason} ended — ${resumed} resumed${restored?`, ${restored} back to previous reason`:''}${ended?`, ${ended} saved`:''}`);
    render();
  } finally { allLineBusy = false; }
}

async function confirmAddProduct(){
  const p = liveProductPicker;
  const name = (p.newName||'').trim();
  if(!name){ toast('Enter a product description'); return; }
  const id = (p.newId||'').trim();
  const targetPLH = parseFloat(p.newTargetPLH)||null;
  if(p.editIndex!=null){
    Store.productLibrary[p.editIndex] = {id, name, category:'', targetPLH};
    await Store.saveProductLibrary();
    liveProductPicker = null;
    toast('Product updated');
    render();
    return;
  }
  const exactMatch = Store.productLibrary.find(item=> (item.name||'').trim().toLowerCase()===name.toLowerCase() && (item.id||'').trim().toLowerCase()===id.toLowerCase());
  if(exactMatch){
    // Already exists exactly as typed — just use it, no need to add a redundant copy
    if(p.target==='library'){ liveProductPicker=null; toast('That product is already in your library'); render(); return; }
    applyPickedProduct(exactMatch.id ? `${exactMatch.id} ${exactMatch.name}` : exactMatch.name, exactMatch.id);
    return;
  }
  const nearDupe = Store.productLibrary.find(item=>
    (id && (item.id||'').trim().toLowerCase()===id.toLowerCase()) ||
    (item.name||'').trim().toLowerCase()===name.toLowerCase()
  );
  if(nearDupe){
    const matchedOn = (id && (nearDupe.id||'').trim().toLowerCase()===id.toLowerCase()) ? 'ID' : 'name';
    if(!confirm(`A product with the same ${matchedOn} already exists in your library:\n\n"${nearDupe.name}"${nearDupe.id?` (ID ${nearDupe.id})`:''}\n\nAdd this as a separate entry anyway?`)){
      return;
    }
  }
  Store.productLibrary.push({id, name, category:'', targetPLH});
  await Store.saveProductLibrary();
  if(p.target==='library'){ liveProductPicker=null; toast('Product added'); render(); return; }
  applyPickedProduct(id ? `${id} ${name}` : name, id);

async function applyPickedProduct(display, id){

    liveSetup.productId = id||'';

    Store.liveRuns[p.machine].product = display;
    Store.liveRuns[p.machine].productId = id||'';
    await Store.saveLiveRuns();
  } else if(p.target==='addPLHData'){
    await Store.refreshRecords();
    const idx = Store.records.findIndex(rec=>rec.id===p.machine);
    if(idx>-1){
      const rec = {...Store.records[idx], product: display};
      rec.plh = {...(rec.plh||{}), product: display, productId: id||''};
      Store.records[idx] = rec;
      await Store.saveRecords();

  }
  liveProductPicker = null;
  render();

/* Scans the whole library for entries that share the same ID or the same name (trimmed, case-insensitive) — catches the common real-world case of a product saved twice with slightly different capitalization or spacing that an exact-match check would miss */
function findDuplicateProductGroups(){
  const byId = {}; const byName = {};
  Store.productLibrary.forEach((item,i)=>{
    const idKey = (item.id||'').trim().toLowerCase();
    const nameKey = (item.name||'').trim().toLowerCase();
    if(idKey){ (byId[idKey]=byId[idKey]||[]).push(i); }
    if(nameKey){ (byName[nameKey]=byName[nameKey]||[]).push(i); }
  });
  const dupeIdxSet = new Set();
  const groups = [];
  Object.values(byId).forEach(idxs=>{ if(idxs.length>1){ groups.push({type:'Same ID', idxs}); idxs.forEach(i=>dupeIdxSet.add(i)); } });
  Object.values(byName).forEach(idxs=>{ if(idxs.length>1){ groups.push({type:'Same Name', idxs}); idxs.forEach(i=>dupeIdxSet.add(i)); } });
  return {groups, dupeIdxSet};
}

      </div></div>
    </div>`).join('') : '<div class="empty">No products yet — tap + Add Product to start building your library, anytime you have a spare moment.</div>'}
  `;

async function confirmStartRun(){

  if(existing && existing.segments.length===0){
    // Machine was logging a standalone downtime (started idle, no production yet) — close that downtime out right as production begins, keep it on record, and start the first running segment without losing anything already logged

      downtimeSegments: []
    };

function isStaleLive(live){ return !!(live && live.date && live.date!==todayStr()); }
function staleLatestStart(live){
  const starts = [...(live.segments||[]).map(sg=>sg.start), ...(live.downtimeSegments||[]).map(d=>d.start)].filter(Boolean);
  return starts.reduce((a,b)=> toMin(b)>toMin(a)?b:a, starts[0]||'08:00');
}

async function closeStaleRun(m){
  const live = Store.liveRuns[m]; if(!live) return;
  const el = document.getElementById('staleEnd-'+machineIdSafe(m));
  const t = el && el.value;
  if(!t){ toast('Set the finish time'); return; }
  const latest = staleLatestStart(live);
  if(toMin(t) < toMin(latest)){ toast(`Finish can't be before ${fmtTime12(latest)}`); return; }
  const result = await closeOutLiveRun(m, {endAt: t});
  if(!result){ toast('Save failed — check connection'); return; }
  delete Store.liveRuns[m];
  const okL = await Store.saveLiveRuns();
  if(!okL){ toast('Save failed — check connection'); return; }
  toast(`${m} closed at ${fmtTime12(t)} on ${fmtDate(live.date)}`);
  render();
}

async function confirmDowntime(){

  if(s.status==='PLANNED'){ reasonCategory = 'Planned Stop'; reason = s.plannedReason==='Other' ? (s.plannedReasonOther||'Other') : (s.plannedReason||PLANNED_REASONS[0]); }
  if(s.status==='WAITING'){ reasonCategory = s.waitCategory; reason = s.waitReason==='Other' ? (s.waitReasonOther||'Other') : (s.waitReason||reasonsForMachine(s.waitCategory, s.machine)[0]); classification = reasonClassification(s.waitCategory); }

    // Machine was IDLE — start a standalone downtime session, no production running yet
    live = Store.liveRuns[s.machine] = {
      machine: s.machine, status:'DOWNTIME', product:'', productId:'', date: todayStr(),
      startedAt: now, employees: 0, segments: [], downtimeSegments: []

  } else if(live.status==='RUNNING'){
    // Was actively producing — close out the running segment, downtime begins now
    const lastSeg = live.segments[live.segments.length-1];
    if(lastSeg && !lastSeg.end) lastSeg.end = now;

    const lastDt = live.downtimeSegments[live.downtimeSegments.length-1];
    if(lastDt && !lastDt.end) lastDt.end = now;
  }
  let dtNotes = s.notes||'';

}
async function resumeRun(m){
  const live = Store.liveRuns[m];
  const now = nowHHMM();
  const lastDt = live.downtimeSegments[live.downtimeSegments.length-1];
  if(lastDt) lastDt.end = now;
  if(lastDt && lastDt.resumeTo){
    // v100: a planned stop (e.g. Metal Detector Test) taken while the line was already stopped — go back to that earlier reason, not to running
    live.downtimeSegments.push({start: now, end:null, ...lastDt.resumeTo, notes:''});
    const okR = await Store.saveLiveRuns();
    if(!okR) return;
    toast(`${m} — back to ${lastDt.resumeTo.reason||'previous status'}`);
    render();
    return;
  }
  const lastSeg = live.segments[live.segments.length-1];
  const nextEmployees = (live.pendingEmployees!=null) ? live.pendingEmployees : lastSeg.employees;
  live.segments.push({start: now, end:null, employees: nextEmployees});
  delete live.pendingEmployees;
  live.status = 'RUNNING';
  const ok = await Store.saveLiveRuns();
  if(!ok) return;
  toast(`${m} — resumed`);
  render();
}

function overlapMinutes(aStart,aEnd,bStart,bEnd){
  let s1=toMin(aStart), e1=toMin(aEnd||nowHHMM()); if(e1<s1) e1=s1;
  let s2=toMin(bStart), e2=toMin(bEnd||nowHHMM()); if(e2<s2) e2=s2;

/* Closes out the current run's segments/downtime and saves them to History — shared by Finish Product (which stops there) and Switch Product (which immediately starts a new run right after). Quantity/weight/notes are optional; when skipped, the run still saves with full timing/staffing data and can be completed later from History, same as Finish Product's own "add later" path. */
/* v116: labour for a run. Net = running minutes × staff on each segment. Gross = net + stop minutes (except No Work) × the staff on the line at the moment the stop began (the latest segment that started before it; a stop before the first segment uses the first segment's headcount). */
function runLabourMinutes(segments, downtimeSegments){
  const segs = (segments||[]).filter(sg=>sg.start).slice().sort((a,b)=>toMin(a.start)-toMin(b.start));
  const empAt = t=>{ const tm=toMin(t); let best=null; segs.forEach(sg=>{ if(toMin(sg.start)<=tm) best=sg; }); const sg = best || segs[0]; return sg ? (Number(sg.employees)||0) : 1; };
  let net=0, gross=0;
  segs.forEach(sg=>{ net += duration(sg.start, sg.end) * (Number(sg.employees)||0); });
  gross = net;
  (downtimeSegments||[]).forEach(d=>{ if(d.status==='NO_WORK') return; gross += duration(d.start, d.end) * empAt(d.start); });
  return {net, gross};
}
/* Same text block the run notes have always carried (Qty · Weight · Labour · PLH · vs Target) */
function plhNoteExtras(p){
  const extras = [];
  if(p.quantity) extras.push(`Qty: ${p.quantity}`);
  if(p.weightLbs) extras.push(`Weight: ${p.weightLbs} lbs`);
  if(p.grossPLH!=null){
    extras.push(`Labour: ${p.grossLaborHours.toFixed(1)}h gross / ${p.netLaborHours.toFixed(1)}h net`);
    extras.push(`PLH: ${p.grossPLH.toFixed(0)} gross${p.netPLH!=null?' / '+p.netPLH.toFixed(0)+' net':''}`);
    if(p.targetPLH){ const v=p.grossPLH-p.targetPLH, pct=v/p.targetPLH*100; extras.push(`vs Target ${p.targetPLH}: ${v>=0?'+':''}${v.toFixed(0)} PLH (${pct>=0?'+':''}${pct.toFixed(0)}%)`); }
  } else extras.push('Qty/Weight not entered yet — add later from History');
  return extras;
}
function stripPlhNote(notes){
  let n = (notes||'').replace('Qty/Weight not entered yet — add later from History', '');
  return n.replace(/\s*·?\s*(Qty:|Weight:|Labour:).*$/s, '').replace(/ · $/,'').replace(/^ · /,'').trim();
