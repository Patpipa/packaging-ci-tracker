/* v116: re-works a saved Live Floor run after its start/finish was edited in History — segments and stops are trimmed (or the first/last segment stretched) to the new window, then running minutes, labour and PLH are recalculated */
function recalcLiveRunRecord(rec, newStart, newEnd){
  const p = {...rec.plh};
  const ns=toMin(newStart), ne=toMin(newEnd);
  let segs = (p.segments||[]).map(sg=>({...sg})).sort((a,b)=>toMin(a.start)-toMin(b.start));
  if(segs.length){
    if(ns < toMin(segs[0].start)) segs[0].start = newStart;
    const last = segs[segs.length-1]; if(ne > toMin(last.end)) last.end = newEnd;
  }
  const clip = x=>{ const a=Math.max(toMin(x.start),ns), b=Math.min(toMin(x.end),ne); if(b<=a) return null; const hh=v=>String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0'); return {...x, start:hh(a), end:hh(b)}; };
  segs = segs.map(clip).filter(Boolean);
  const dts = (p.downtimeSegments||[]).map(clip).filter(Boolean);
  const lab = runLabourMinutes(segs, dts);
  p.segments = segs; p.downtimeSegments = dts;
  p.netLaborHours = lab.net/60; p.grossLaborHours = lab.gross/60;
  p.grossPLH = p.weightLbs>0 && p.grossLaborHours>0 ? p.weightLbs/p.grossLaborHours : null;
  p.netPLH = p.weightLbs>0 && p.netLaborHours>0 ? p.weightLbs/p.netLaborHours : null;
  const durationMin = segs.reduce((a,sg)=>a+duration(sg.start,sg.end),0);
  return {plh:p, durationMin, startTime: segs.length? segs[0].start : newStart, endTime: segs.length? segs[segs.length-1].end : newEnd};
}
async function closeOutLiveRun(m, opts){
  opts = opts || {};
  const live = Store.liveRuns[m];
  if(!live) return null;
  // v116: a run still open from an earlier day closes at the finish time the user confirmed (opts.endAt), never "now" the next morning
  const now = opts.endAt || (live.date && live.date!==todayStr() ? '16:30' : nowHHMM());
  const lastSeg = live.segments.length ? live.segments[live.segments.length-1] : null;
  if(lastSeg && !lastSeg.end) lastSeg.end = now;
  const lastDt = live.downtimeSegments[live.downtimeSegments.length-1];
  if(lastDt && !lastDt.end) lastDt.end = now;

  const lab = runLabourMinutes(live.segments, live.downtimeSegments);
  const netLaborMin = lab.net, grossLaborMin = lab.gross;
  const grossLaborHours = grossLaborMin/60, netLaborHours = netLaborMin/60;
  const weightNum = parseFloat(opts.weight)||0;
  const grossPLH = weightNum>0 && grossLaborHours>0 ? weightNum/grossLaborHours : null;
  const netPLH = weightNum>0 && netLaborHours>0 ? weightNum/netLaborHours : null;
  const target = live.productId ? Store.productLibrary.find(p=>p.id===live.productId) : null;

  const extras = [];
  if(opts.quantity) extras.push(`Qty: ${opts.quantity}`);
  if(opts.weight) extras.push(`Weight: ${opts.weight} lbs`);
  if(grossPLH!=null){
    extras.push(`Labour: ${grossLaborHours.toFixed(1)}h gross / ${netLaborHours.toFixed(1)}h net`);
    extras.push(`PLH: ${grossPLH.toFixed(0)} gross${netPLH!=null?' / '+netPLH.toFixed(0)+' net':''}`);
    if(target && target.targetPLH){
      const variance = grossPLH - target.targetPLH;
      const pct = variance/target.targetPLH*100;
      extras.push(`vs Target ${target.targetPLH}: ${variance>=0?'+':''}${variance.toFixed(0)} PLH (${pct>=0?'+':''}${pct.toFixed(0)}%)`);
    }
  } else {
    extras.push('Qty/Weight not entered yet — add later from History');
  }
  if(opts.notes) extras.push(opts.notes);
  const extraNote = extras.join(' · ');
  const plhData = {
    weightLbs: weightNum, quantity: parseFloat(opts.quantity)||0,
    grossLaborHours, netLaborHours, grossPLH, netPLH,
    targetPLH: (target && target.targetPLH) ? target.targetPLH : null,
    productId: live.productId||'', product: live.product||'',
    machine: m, segments: live.segments.map(seg=>({start:seg.start, end:seg.end, employees:seg.employees})),
    downtimeSegments: (live.downtimeSegments||[]).filter(d=>d.status!=='NO_WORK').map(d=>({start:d.start, end:d.end, status:d.status, reason:d.reason}))
  };

  const toSave = [];
  const validSegments = live.segments.filter(seg=>duration(seg.start, seg.end)>0);
  if(validSegments.length){
    const totalSegMin = validSegments.reduce((a,seg)=>a+duration(seg.start,seg.end),0);
    const empCounts = [...new Set(validSegments.map(s=>s.employees))];
    const empNote = empCounts.length===1 ? `${empCounts[0]} employee${empCounts[0]===1?'':'s'} on station` : `${Math.min(...empCounts)}–${Math.max(...empCounts)} employees on station (staff changed)`;
    const baseNote = `${empNote} (Live Entry)`;
    const rec = {id:uid(), date:live.date, machine:m, product:live.product, startTime:validSegments[0].start, endTime:validSegments[validSegments.length-1].end, durationMin:totalSegMin, status:'RUNNING', reasonCategory:'', reason:'', classification:'', notes: extraNote ? `${baseNote} · ${extraNote}` : baseNote, createdAt:Date.now(), plh: plhData};
    toSave.push(rec);
  }
  (live.downtimeSegments||[]).forEach(d=>{
    const dur = duration(d.start, d.end);
    if(dur<=0) return;
    toSave.push({id:uid(), date:live.date, machine:m, product:live.product, startTime:d.start, endTime:d.end, durationMin:dur, status:d.status, reasonCategory:d.reasonCategory, reason:d.reason, classification:d.classification, notes:d.notes||'', createdAt:Date.now()});
  });

  if(toSave.length===0) return {count:0, grossPLH:null};

  await Store.refreshRecords();
  Store.records = Store.records.concat(toSave);
  const okR = await Store.saveRecords();
  if(!okR) return null;
  return {count: toSave.length, grossPLH};
}

/* Breaks are always 30 minutes — auto-fill End Time from Start Time so it doesn't need to be scrolled separately. Doesn't touch other statuses since their durations vary. */
function onStartTimeChanged(){
  if(draft.status!=='BREAK' || !draft.startTime) return;
  let mins = toMin(draft.startTime) + 30;
  if(mins>=1440) mins -= 1440;
  const h = String(Math.floor(mins/60)).padStart(2,'0');
  const m = String(mins%60).padStart(2,'0');
  draft.endTime = `${h}:${m}`;

function rangesOverlap(aStart,aEnd,bStart,bEnd){ return aStart < bEnd && bStart < aEnd; }
/* Warns if a record about to be saved overlaps an existing entry for the same machine/date — catches accidental double-logging before it skews a report. Returns true to proceed, false to cancel. */
/* v116: a Live Floor run only occupies its running segments — its own stops sit in the gaps, so they are not overlaps */
function busySpans(r){
  if(r.status==='RUNNING' && r.plh && Array.isArray(r.plh.segments) && r.plh.segments.length) return r.plh.segments.map(sg=>[toMin(sg.start), toMin(sg.end)]);
  return [[toMin(r.startTime), toMin(r.endTime)]];
}
function confirmNoOverlap(newRecords, excludeId){
  const conflicts = [];
  newRecords.forEach(nr=>{
    Store.records.filter(r=>r.machine===nr.machine && r.date===nr.date && r.id!==excludeId).forEach(r=>{
      if(busySpans(nr).some(([a,b])=>busySpans(r).some(([c,d])=>rangesOverlap(a,b,c,d)))){
        conflicts.push(`${nr.machine}: ${fmtTime12(nr.startTime)}–${fmtTime12(nr.endTime)} overlaps existing ${statusInfo(r.status).label} (${fmtTime12(r.startTime)}–${fmtTime12(r.endTime)})`);
      }
    });
  });
  if(!conflicts.length) return true;
  return confirm(`This overlaps with an existing entry:\n\n${conflicts.join('\n')}\n\nSave anyway?`);
}
let isSaving = false;
/* Re-reads the actual on-screen time values right before saving — some desktop browsers don't reliably fire the input event per keystroke on segmented time fields, so trusting only the stored draft can miss a value that's visibly filled in */
function syncTimeFieldsFromDOM(){
  const startEl = document.getElementById('startTimeInput');
  const endEl = document.getElementById('endTimeInput');
  if(startEl && startEl.value) draft.startTime = startEl.value;
  if(endEl && endEl.value) draft.endTime = endEl.value;

async function saveRecord(){

async function _saveRecordInner(){
  const dur = duration(draft.startTime, draft.endTime);
  const base = {
    date: draft.date || todayStr(), startTime: draft.startTime, endTime: draft.endTime, durationMin: dur,
    status: draft.status, notes: draft.notes||'', createdAt: Date.now()
  };
  let toSave = [];
  if(draft.status==='BREAK'){
    const machines = draft.breakMachines;
    machines.forEach(m=>{ toSave.push({...base, id:uid(), machine:m, product:'', reasonCategory:'', reason:'', classification:''}); });
  } else {
    const product = draft.product==='Other' ? (draft.productOther||'Other') : draft.product;
    let reasonCategory='', reason='', classification='';
    if(draft.status==='CHANGEOVER'){ reason = draft.changeReason==='Other' ? (draft.changeReasonOther||'Other') : draft.changeReason; }
    if(draft.status==='PLANNED'){ reasonCategory = 'Planned Stop'; reason = draft.plannedReason==='Other' ? (draft.plannedReasonOther||'Other') : draft.plannedReason; }
    if(draft.status==='WAITING'){ reasonCategory = draft.waitCategory; const wr = draft.waitReason || reasonsForMachine(draft.waitCategory, draft.machine)[0]; reason = wr==='Other' ? (draft.waitReasonOther||'Other') : wr; classification = reasonClassification(draft.waitCategory); }
    toSave.push({...base, id:uid(), machine:draft.machine, product, reasonCategory, reason, classification});
  }
  if(!confirmNoOverlap(toSave)) return;
  await Store.refreshRecords();
  Store.records = Store.records.concat(toSave);
  const ok = await Store.saveRecords();
  if(!ok){ toast('Save failed — storage unavailable'); return; }
  const savedDate = base.date;
  const isToday = savedDate===todayStr();
  lastEndTime = draft.endTime;
  toast(isToday ? 'Record Saved' : `Record Saved to ${fmtDate(savedDate)}`);
  draft = freshDraft();
  if(isToday){
    Router.go('dashboard');
  } else {
    histFilters = {date: savedDate, machine:'', product:'', status:'', category:''};
    Router.go('history');
  }
}

async function confirmAddPLHData(){

  const qtyNum = parseFloat(document.getElementById('plhQtyInput').value)||0;
  if(weightNum<=0){ toast('Enter a weight to compute PLH'); return; }
  await Store.refreshRecords();
  const idx = Store.records.findIndex(r=>r.id===plhDataFormId);
  if(idx===-1){ toast('Record not found — it may have been deleted'); Router.go('history'); return; }
  const r = Store.records[idx];
  let p = r.plh;
  if(!p || p.grossLaborHours==null){
    // No staffing/segment data exists yet (a manual/backdated entry, not from Live Floor) — build it from this record's own duration and the employee count just entered
    const laborHours = (r.durationMin/60) * plhFormEmployees;
    p = {
      weightLbs: 0, quantity: 0, grossLaborHours: laborHours, netLaborHours: laborHours,
      grossPLH: null, netPLH: null, targetPLH: (p && p.targetPLH) || null,
      productId: (p && p.productId) || '', product: r.product || '',
      machine: r.machine, segments: [{start:r.startTime, end:r.endTime, employees:plhFormEmployees}], downtimeSegments: []
    };
  }
  const grossPLH = p.grossLaborHours>0 ? weightNum/p.grossLaborHours : null;
  const netPLH = p.netLaborHours>0 ? weightNum/p.netLaborHours : null;
  const updatedPLH = {...p, weightLbs: weightNum, quantity: qtyNum, grossPLH, netPLH};
  // Strip any previously-generated summary (the placeholder text, or a prior real Qty/Weight/Labour/PLH block from an earlier edit) so correcting a value replaces it cleanly instead of stacking a second, conflicting summary alongside the old one
  let notes = (r.notes||'').replace('Qty/Weight not entered yet — add later from History', '');
  notes = notes.replace(/\s*·?\s*Qty:.*$/s, '').replace(/ · $/,'').replace(/^ · /,'').trim();
  const extras = [`Qty: ${qtyNum}`, `Weight: ${weightNum} lbs`, `Labour: ${p.grossLaborHours.toFixed(1)}h gross / ${p.netLaborHours.toFixed(1)}h net`, `PLH: ${grossPLH.toFixed(0)} gross${netPLH!=null?' / '+netPLH.toFixed(0)+' net':''}`];
  if(updatedPLH.targetPLH){
    const variance = grossPLH - updatedPLH.targetPLH;
    const pct = variance/updatedPLH.targetPLH*100;
    extras.push(`vs Target ${updatedPLH.targetPLH}: ${variance>=0?'+':''}${variance.toFixed(0)} PLH (${pct>=0?'+':''}${pct.toFixed(0)}%)`);
  }
  notes = notes ? `${notes} · ${extras.join(' · ')}` : extras.join(' · ');
  Store.records[idx] = {...r, plh: updatedPLH, notes};
  const ok = await Store.saveRecords();
  if(!ok) return;
  plhDataFormId = null;
  toast(`PLH saved — ${grossPLH.toFixed(0)} PLH`);
  Router.go('history');
}

        const old = Store.records[idx];
        let upd = {...old, date: draft.date||todayStr(), machine:draft.machine, product, startTime:draft.startTime, endTime:draft.endTime, durationMin:dur, status:draft.status, reasonCategory, reason, classification, notes:draft.notes};
        const isLiveRun = old.status==='RUNNING' && old.plh && Array.isArray(old.plh.segments) && old.plh.segments.length;
        if(isLiveRun && draft.status==='RUNNING'){
          // v116: a Live Floor run keeps its real running minutes (its stops are separate records). If its start/finish changed, trim/stretch its segments and recalculate labour + PLH.
          const timesChanged = draft.startTime!==old.startTime || draft.endTime!==old.endTime;
          const plh = {...old.plh};
          if(product!==old.product){ plh.product = product; plh.productId = ''; plh.targetPLH = null; }
          upd.plh = plh; upd.durationMin = old.durationMin;

            upd = {...upd, plh: rc.plh, durationMin: rc.durationMin, startTime: rc.startTime, endTime: rc.endTime};
            const base = stripPlhNote(upd.notes);

          }

    }

  const dayTrend = Object.keys(dayMap).sort().map(d=>({date:d, waiting:dayMap[d].WAITING, running:dayMap[d].RUNNING}));
  const daysWithData = Object.keys(dayMap).length;
  let observation = 'No production data recorded in this date range.';
  if(bn.length){
    const top = bn[0];
    observation = `Across ${daysWithData} day${daysWithData===1?'':'s'}, the largest recurring source of lost time was ${top[0].toLowerCase()}, totaling ${fmtDur(top[1])}${bottleneckMeta[top[0]]==='Upstream / Product'?' of upstream delay':''}.`;
    if(mmw.minutes>0) observation += ` ${mmw.machine} accumulated the most waiting time overall at ${fmtDur(mmw.minutes)}.`;
    const worstDay = dayTrend.slice().sort((a,b)=>b.waiting-a.waiting)[0];
    if(worstDay && worstDay.waiting>0) observation += ` ${fmtDate(worstDay.date)} was the worst single day for waiting time, at ${fmtDur(worstDay.waiting)}.`;

/* Weekly version of the suggestion engine — factors in the upstream/internal split and secondary bottleneck across the whole range, not just one day's top reason */
function craftWeeklySuggestions(rep){
  if(!rep.bottlenecks.length){
    return ['No bottleneck data recorded in this range yet — log entries daily so patterns can surface here.'];
  }
  const ideas = [];
  const [topName, topMin] = rep.bottlenecks[0];
  const topCategory = (rep.bottleneckMeta && rep.bottleneckMeta[topName]) || categoryForReason(topName);
  ideas.push(`Run a root-cause (5-Whys) session on "${topName}" — it was the biggest single driver this period at ${fmtDur(topMin)} across ${rep.daysWithData} day(s) with data.`);

  const t = rep.totals;
  const totalDelay = t.upstream + t.internal;
  if(totalDelay>0){
    const upstreamShare = t.upstream/totalDelay;
    if(upstreamShare >= 0.6){
      ideas.push(`Upstream delays are driving most of this period's downtime (${Math.round(upstreamShare*100)}%) — consider a small in-process buffer or batch-sequencing with the upstream station so packaging isn't stalled directly by its switchovers.`);
    } else if(upstreamShare <= 0.4){
      ideas.push(topCategory && CATEGORY_ACTIONS[topCategory] ? CATEGORY_ACTIONS[topCategory] : 'Standardize the top recurring task with a visual checklist so deviations are caught immediately rather than after the fact.');
    } else {
      ideas.push('Delay is fairly evenly split between upstream and packaging this period — worth reviewing both sides together rather than assuming one is the sole cause.');
    }
  }

  if(rep.bottlenecks.length>1){
    const [name2,min2] = rep.bottlenecks[1];
    ideas.push(`"${name2}" was the second-largest driver at ${fmtDur(min2)} — track whether it's a separate issue or connected to the top one before committing resources to just one fix.`);
  } else if(rep.machineMostAffected.machine && rep.machineMostAffected.minutes>0){
    ideas.push(`${rep.machineMostAffected.machine} carried the most downtime this period (${fmtDur(rep.machineMostAffected.minutes)}) — review its staffing and scheduling pattern for recurring gaps.`);
  }
  return ideas.slice(0,3);
}

/* Renders a simple SVG bar chart of daily Waiting minutes so a trend (e.g. a fix taking effect) is visible at a glance instead of scanning numbers */
function renderTrendChart(dayTrend){
  if(!dayTrend.length) return '<div class="empty">No data in this range yet.</div>';
  const W = 340, H = 130, padL = 4, padR = 4, padB = 22, padT = 10;
  const chartW = W - padL - padR, chartH = H - padT - padB;
  const maxVal = Math.max(1, ...dayTrend.map(d=>d.waiting));
  const n = dayTrend.length;
  const barGap = 4;
  const barW = Math.max(3, (chartW - barGap*(n-1)) / n);
  let bars = '';
  let labels = '';
  const labelEvery = n>14 ? Math.ceil(n/7) : (n>7 ? 2 : 1);
  dayTrend.forEach((d,i)=>{
    const x = padL + i*(barW+barGap);
    const h = (d.waiting/maxVal)*chartH;
    const y = padT + (chartH-h);
    const color = d.waiting===maxVal && maxVal>0 ? 'var(--wait)' : 'var(--amber)';
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(1,h).toFixed(1)}" rx="2" fill="${color}"><title>${fmtDate(d.date)}: ${fmtDur(d.waiting)}</title></rect>`;
    if(i % labelEvery === 0 || i===n-1){
      const dLabel = new Date(d.date+'T00:00:00').toLocaleDateString('en-US',{month:'numeric',day:'numeric'});
      labels += `<text x="${(x+barW/2).toFixed(1)}" y="${H-6}" font-size="8" fill="var(--muted2)" text-anchor="middle" font-family="IBM Plex Mono">${dLabel}</text>`;
    }
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;">
    <line x1="${padL}" y1="${padT+chartH}" x2="${W-padR}" y2="${padT+chartH}" stroke="var(--line)" stroke-width="1"/>
    ${bars}${labels}
  </svg>
  <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px;"><span>Daily Waiting/Downtime (min)</span><span>Peak: ${fmtDur(maxVal)}</span></div>`;
}

async function deleteRangeRecords(){
  const count = recordsInRange(weeklyRange.start, weeklyRange.end).length;
  const dayKeys = Object.keys(Store.dayLog||{}).filter(d=>d>=weeklyRange.start && d<=weeklyRange.end);
  if(count===0 && !dayKeys.length){ toast('No records in this range to delete'); return; }
  const label = weeklyRange.start===weeklyRange.end ? fmtDate(weeklyRange.start) : `${fmtDate(weeklyRange.start)} – ${fmtDate(weeklyRange.end)}`;
  if(!confirm(`Delete all ${count} record(s) from ${label}? This also removes any saved Daily Reports${dayKeys.length?` and Crew Board entries (crew, MAREL, side machines, lead hand / yield) for ${dayKeys.length} day${dayKeys.length===1?'':'s'}`:''} in that range. This cannot be undone.`)) return;
  if(!confirm('Are you sure? This is permanent.')) return;
  await Store.refreshRecords();
  Store.records = Store.records.filter(r=> !(r.date>=weeklyRange.start && r.date<=weeklyRange.end));
  Store.dailyReports = Store.dailyReports.filter(r=> !(r.date>=weeklyRange.start && r.date<=weeklyRange.end));

  if(dayKeys.length){ dayKeys.forEach(k=>delete Store.dayLog[k]); await Store.saveDayLog(); }
  toast(`Deleted ${count} record(s)${dayKeys.length?` + Crew Board entries for ${dayKeys.length} day${dayKeys.length===1?'':'s'}`:''}`);
  render();
}

async function updateCiAction(date, val){

const CATEGORY_ACTIONS = {
  'Upstream / Product': 'Set up a short daily sync between packaging and the trim/cutting/grinding stations to align production timing before the shift starts.',
  'Materials / Warehouse': 'Set a par-level check for boxes, film, and labels each morning so material shortages are caught before they stop the line.',
  'Machine / Equipment': 'Schedule a preventive-maintenance review for the affected machine and log recurring fault codes to spot a pattern.',
  'Labour / Operational': 'Cross-train a backup operator for this station and review shift staffing coverage during peak changeover windows.',
  'Cleaning / Sanitation': 'Standardize the cleaning changeover sequence with a visual checklist to shorten the changeover-to-clean transition.',
  'QA / Pre-Op': 'Align QA inspection timing with the production start so approvals happen in parallel rather than blocking the line.',
  'Changeover': 'Apply a SMED-style review to the changeover sequence to identify prep steps that can happen before the line actually stops.'
};
function categoryForReason(reasonName){
  if(CHANGEOVER_REASONS.includes(reasonName)) return 'Changeover';
  for(const [cat, info] of Object.entries(WAITING_CATEGORIES)){ if(info.reasons.includes(reasonName)) return cat; }
  return null;
}
function craftSuggestions(rep){
  if(!rep.bottlenecks.length){
    return ['No bottleneck data recorded yet — log waiting and changeover reasons on the floor tomorrow so patterns can surface here.'];
  }
  const [reasonName, minutes] = rep.bottlenecks[0];
  const category = (rep.bottleneckMeta && rep.bottleneckMeta[reasonName]) || categoryForReason(reasonName);
  const cls = reasonClassification(category);
  const ideas = [];
  ideas.push(`Run a 5-Whys session on "${reasonName}" with the ${cls==='upstream' && category!=='Changeover' ? 'upstream production' : 'packaging'} team to find the root cause behind today's ${fmtDur(minutes)}.`);
  ideas.push(category && CATEGORY_ACTIONS[category] ? CATEGORY_ACTIONS[category] : 'Document the standard sequence for this task and confirm the operator followed it — deviations often hide the real cause.');
  if(rep.machineMostAffected.machine && rep.machineMostAffected.minutes>0){
    ideas.push(`Review ${rep.machineMostAffected.machine}'s schedule and staffing for tomorrow's shift — it accounted for ${fmtDur(rep.machineMostAffected.minutes)} of today's waiting time.`);
  } else {
    ideas.push('Post today\'s top bottleneck on the floor visual board so the team can flag it in real time if it recurs tomorrow.');
  }
  return ideas.slice(0,3);
}
const suggestionCache = {};
function renderSuggestionChips(date){
  const ideas = suggestionCache[date];
  if(!ideas) return '';
  return `<div style="margin-top:12px;display:flex;flex-direction:column;gap:8px;">` + ideas.map((idea,i)=>`
    <div style="background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.4;">
      <div style="margin-bottom:8px;">${escapeHtml(idea)}</div>
      <button class="btn btn-ghost" style="width:auto;padding:6px 12px;font-size:11px;" onclick="useSuggestion('${date}', ${i})">Use This</button>
    </div>`).join('') + `</div>`;
}
async function useSuggestion(date, i){
  const idea = suggestionCache[date][i];
  const box = document.getElementById('ciActionBox');
  const existing = box.value.trim();
  box.value = existing ? existing + '\n' + idea : idea;
  await updateCiAction(date, box.value);
  toast('Added to Action for Tomorrow');
}
function generateSuggestions(date){
  const rep = getReportForView(date);
  suggestionCache[date] = craftSuggestions(rep);
  const el = document.getElementById('suggestChips');
  if(el) el.innerHTML = renderSuggestionChips(date);
}

/* v101: the daily summary report carries only a one-line PLH headline — the full PLH breakdown lives in the separate PLH PDF that's attached alongside it. (Weekly Summary keeps its full PLH section + trend chart.) */
function plhHeadline(date){
  const x = computePLHSummary(plhRecordsInRange(date, date));
  if(!x.runCount) return {main:'PLH today: no finished runs with weight recorded.', note:''};
  return {
    main: `PLH today: ${x.grossPLH.toFixed(1)} lbs/hr gross · ${x.netPLH.toFixed(1)} net · ${Math.round(x.totalWeight).toLocaleString('en-US')} lbs · ${x.runCount} job${x.runCount===1?'':'s'}.`,
    note: 'Full breakdown in the attached PLH report.'
  };
}
function summaryText(date){
  const rep = getReportForView(date);
  const t = rep.totals;
  const plhH = plhHeadline(rep.date);
  const dl = sectionsText(dayLogSections(rep.date));
  const plhBlock = `
${dl?dl+'\n\n':''}${plhH.main}${plhH.note?' '+plhH.note:''}
`;
  return `PACKAGING CI DAILY REPORT
Date: ${fmtDate(rep.date)}

Total Waiting/Downtime: ${fmtDur(t.WAITING)}
Upstream Delay: ${fmtDur(t.upstream)}
Packaging/Internal Delay: ${fmtDur(t.internal)}

Top Bottleneck:
${rep.bottlenecks.length ? rep.bottlenecks[0][0]+' — '+fmtDur(rep.bottlenecks[0][1]) : 'None'}

Machine with Most Downtime:
${rep.machineMostAffected.machine||'--'} — ${fmtDur(rep.machineMostAffected.minutes||0)}
${plhBlock}
Main Observation:
${rep.observation}`;
}
async function copySummary(date){
  const text = summaryText(date);
  try{ await navigator.clipboard.writeText(text); toast('Summary copied'); }
  catch(e){ toast('Copy failed'); }
}
async function shareReport(date){
  const text = summaryText(date);
  if(navigator.share){
    try{ await navigator.share({title:'Packaging CI Daily Report', text}); return; }
    catch(e){ if(e && e.name==='AbortError') return; }
  }
  toast('Share not available here — try after hosting, or use Copy Summary');
  copySummary(date);
}
function exportReportPDF(date){
  const rep = getReportForView(date);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'letter'});
  doc.setFillColor(...PDF_COLOR.amber); doc.rect(0,0,612,6,'F');
  let y = 50;
  doc.setTextColor(...PDF_COLOR.amber); doc.setFont('helvetica','bold'); doc.setFontSize(11);
  doc.text('PACKAGING CONTINUOUS IMPROVEMENT', 40, y); y+=18;
  doc.setTextColor(0); doc.setFontSize(16);
  doc.text('DAILY PRODUCTION & BOTTLENECK REPORT', 40, y); y+=24;
  doc.setFont('helvetica','normal'); doc.setFontSize(11);
  doc.text(`Date: ${fmtDate(rep.date)}    Shift Start: ${fmtTime12(rep.shiftStart)}    Shift End: ${fmtTime12(rep.shiftEnd)}`, 40, y); y+=26;

  function section(title){ doc.setTextColor(0); doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.text(title, 40, y); y+=6; doc.setDrawColor(...PDF_COLOR.amber); doc.setLineWidth(1.3); doc.line(40,y,570,y); doc.setLineWidth(0.5); y+=16; doc.setFont('helvetica','normal'); doc.setFontSize(10.5); }
  function row(label, val){ doc.setTextColor(0); doc.text(label, 46, y); doc.text(String(val), 400, y); y+=15; }
  function rowC(label, val, rgb){ doc.setTextColor(0); doc.text(label, 46, y); doc.setTextColor(...rgb); doc.text(String(val), 400, y); doc.setTextColor(0); y+=15; }
  function ensure(space){ if(y+space>760){ doc.addPage(); y=50; } }

  section('MACHINE SUMMARY');
  MACHINES.forEach(m=>{
    ensure(90);
    doc.setFont('helvetica','bold'); doc.setTextColor(0); doc.text(m,46,y); y+=15; doc.setFont('helvetica','normal');
    const mt = rep.perMachine[m]||{};
    rowC('Running Time', fmtDur(mt.RUNNING||0), PDF_COLOR.run);
    rowC('Waiting/Downtime', fmtDur(mt.WAITING||0), PDF_COLOR.wait);
    rowC('Changeover Time', fmtDur(mt.CHANGEOVER||0), PDF_COLOR.change);
    rowC('Break Time', fmtDur(mt.BREAK||0), PDF_COLOR.brk);
    rowC('Planned Stops', fmtDur(mt.PLANNED||0), PDF_COLOR.planned);
    rowC('No Work Scheduled', fmtDur(mt.NO_WORK||0), PDF_COLOR.nowork);
    y+=6;
  });

  ensure(120); section('TOTAL SHIFT SUMMARY');
  const t = rep.totals;
  rowC('Total Running Time', fmtDur(t.RUNNING), PDF_COLOR.run);
  rowC('Total Waiting/Downtime', fmtDur(t.WAITING), PDF_COLOR.wait);
  rowC('Total Changeover', fmtDur(t.CHANGEOVER), PDF_COLOR.change);
  rowC('Total Break Time', fmtDur(t.BREAK), PDF_COLOR.brk);
  rowC('Total Planned Stops', fmtDur(t.PLANNED||0), PDF_COLOR.planned);
  rowC('Total No Work Scheduled', fmtDur(t.NO_WORK), PDF_COLOR.nowork);

  ensure(120); y+=6; section('DOWNTIME ANALYSIS');
  const tot = t.upstream+t.internal;
  const upPct = tot? t.upstream/tot*100 : 0, intPct = 100-upPct;
  rowC('Total Upstream Delay', fmtDur(t.upstream), PDF_COLOR.upstream);
  rowC('Total Packaging/Internal Delay', fmtDur(t.internal), PDF_COLOR.internal);
  if(tot>0){
    const barW=300;
    doc.setFillColor(...PDF_COLOR.upstream); doc.rect(46,y,barW*upPct/100,10,'F');
    doc.setFillColor(...PDF_COLOR.internal); doc.rect(46+barW*upPct/100,y,barW*intPct/100,10,'F');
    y+=14;
    doc.setFontSize(9); doc.setTextColor(...PDF_COLOR.upstream); doc.text(`Upstream ${Math.round(upPct)}%`,46,y);
    doc.setTextColor(...PDF_COLOR.internal); doc.text(`Internal ${Math.round(intPct)}%`,46+barW-80,y);
    doc.setTextColor(0); doc.setFontSize(10.5); y+=16;
  }

  ensure(140); y+=6; section('TOP BOTTLENECKS');
  if(rep.bottlenecks.length){
    const maxMin = rep.bottlenecks[0][1]||1;
    rep.bottlenecks.forEach(([name,min],i)=>{
      ensure(46);
      row(`${i+1}. ${name}`, fmtDur(min));
      doc.setFillColor(...PDF_COLOR.amber); doc.rect(46, y-11, 300*(min/maxMin), 3, 'F'); y+=4;
      const notes = (rep.bottleneckNotes && rep.bottleneckNotes[name]) || [];
      if(notes.length){
        doc.setFontSize(9); doc.setTextColor(120);
        notes.forEach(n=>{ ensure(20); const lines = doc.splitTextToSize(`— ${n}`, 480); doc.text(lines, 56, y); y += lines.length*12; });
        doc.setFontSize(10.5); doc.setTextColor(0);
      }
    });
  }
  else { doc.text('No bottlenecks recorded.',46,y); y+=15; }

  ensure(60); y+=6; section('MACHINE WITH MOST DOWNTIME');
  doc.text(`${rep.machineMostAffected.machine||'--'} — ${fmtDur(rep.machineMostAffected.minutes||0)}`, 46, y); y+=20;

  ensure(90); section('CONTINUOUS IMPROVEMENT OBSERVATION');
  const obsLines = doc.splitTextToSize(rep.observation, 520);
  doc.text(obsLines, 46, y); y += obsLines.length*14+10;

  {
    const secs = dayLogSections(rep.date);
    if(secs.length){ ensure(80); y+=6; section('CREW · MAREL · SIDE MACHINES');
      secs.forEach(sec=>{ ensure(36); doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(120); doc.text(sec.title, 46, y); y+=13; doc.setFontSize(10.5); doc.setTextColor(0);
        sec.rows.forEach(r=>{ const kl = doc.splitTextToSize(r.k, 160), vl = doc.splitTextToSize(String(r.v).replace(/→/g,'->'), 340), h = 13*Math.max(kl.length, vl.length); ensure(h+4);
          doc.setFont('helvetica','normal'); doc.setTextColor(95); doc.text(kl, 46, y); doc.setTextColor(0); if(r.red){ doc.setTextColor(192,57,43); doc.setFont('helvetica','bold'); } doc.text(vl, 220, y); doc.setTextColor(0); doc.setFont('helvetica','normal'); y += h+3; });
        y+=5; });
    }
    const h = plhHeadline(rep.date);
    ensure(60); y+=6; section('PLH');
    doc.setFont('helvetica','bold'); const ln = doc.splitTextToSize(h.main, 520); doc.text(ln, 46, y); y += ln.length*14;
    if(h.note){ doc.setFont('helvetica','italic'); doc.setTextColor(110); doc.text(h.note, 46, y); y+=14; doc.setTextColor(0); }
    doc.setFont('helvetica','normal'); y+=6;
  }

  ensure(90); section('CI ACTION / FOLLOW-UP');
  const actLines = doc.splitTextToSize(rep.ciAction || '(none entered)', 520);
  doc.text(actLines, 46, y); y += actLines.length*14+10;

  try{
    doc.save(`Packaging_CI_Report_${rep.date}.pdf`);
    toast('PDF exported');
  }catch(e){
    console.error('PDF save failed, trying fallback', e);
    try{
      const url = doc.output('bloburl');
      window.open(url, '_blank');
      toast('PDF opened in new tab — use Share/Save from there');
    }catch(e2){
      console.error('PDF fallback failed', e2);
      toast('PDF export not available here — try after hosting on a real website');
    }
  }
}

async function importData(evt){
  const file = evt.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    const incoming = data.records || [];
    const existingIds = new Set(Store.records.map(r=>r.id));
    const newOnes = incoming.filter(r=>!existingIds.has(r.id));
    if(!confirm(`${incoming.length} records found (${newOnes.length} new). Merge with existing data?`)) return;
    await Store.refreshRecords();
    const freshIds = new Set(Store.records.map(r=>r.id));
    const trulyNew = incoming.filter(r=>!freshIds.has(r.id));
    Store.records = Store.records.concat(trulyNew);
    if(data.dailyReports){
      data.dailyReports.forEach(rep=>{ if(!Store.dailyReports.find(r=>r.date===rep.date)) Store.dailyReports.push(rep); });
    }
    await Store.saveRecords(); await Store.saveDailyReports();
    toast('Data merged'); render();
  }catch(e){ toast('Invalid backup file'); }
  evt.target.value='';
}

/* ============ UPSTREAM IMPACT SUMMARY ============
One-page summary of packaging WAITING time caused by upstream departments, for cross-department meetings. Packaging measures; the owning department decides the fix — so the page states measured facts only. (Agreed Actions table removed in v96: planning is handled by the manager/supervisor with the departments involved.)
Department mapping is fixed here. Any upstream reason not listed (incl. future new reasons) falls into "Others" so it's never silently dropped. Matching uses the renamed label (REASON_RENAMES) so old records map correctly too. */
const UPSTREAM_DEPARTMENTS = [
  {name:'MAREL', match:r=>/^MAREL - /.test(r)},
  {name:'Trimmers', reasons:['Waiting for Trimmer to Start','Waiting for Trimmed Meat','Waiting for Chicken Muscle (Trimmer Cutting by Hand)','Waiting for Byproduct','Waiting for Tenderloin Byproduct','Waiting for End Cut']},
  {name:'Band Saw', reasons:['Waiting for Band Saw Product','Waiting for Band Saw Cut Meat (for Slicer)']},
  {name:'Burger Room', reasons:['Waiting for Burger Room Product']},
  {name:'Side Machines', reasons:['Waiting for Fajita','Waiting for Cutlet','Waiting for Slicer']}, // v107: Fajita/Cutlet/Slicer are run by packaging staff — grouped so the report ties to the side-machine labour section
  {name:'Warehouse', reasons:['Waiting for Warehouse to Scan In Product']},
  {name:'Production Planning', reasons:['Product Not Thawed/Ready','Production Department Behind Schedule','Product Shortage']}
];
const UPSTREAM_OTHERS = 'Others';
function upstreamDeptFor(reason){
  const r = REASON_RENAMES[reason] || reason || '';
  const d = UPSTREAM_DEPARTMENTS.find(d=> d.match ? d.match(r) : d.reasons.includes(r));
  return d ? d.name : UPSTREAM_OTHERS;
}
function upstreamRecordsInRange(start, end){
  return Store.records.filter(r=>r.date>=start && r.date<=end && r.status==='WAITING' && r.classification==='upstream');
}
function previousPeriod(start, end){
  const s = new Date(start+'T00:00:00'), e = new Date(end+'T00:00:00');
  const days = Math.round((e-s)/86400000)+1;
  const pe = new Date(s); pe.setDate(pe.getDate()-1);
  const ps = new Date(pe); ps.setDate(ps.getDate()-(days-1));
  return {start:localDateStr(ps), end:localDateStr(pe), days};
}
function computeUpstreamImpact(start, end){
  const recs = upstreamRecordsInRange(start, end);
  const allDown = Store.records.filter(r=>r.date>=start && r.date<=end && (r.status==='WAITING'||r.status==='CHANGEOVER'));
  const allDownMin = allDown.reduce((a,r)=>a+(r.durationMin||0),0);
  const prev = previousPeriod(start, end);
  const prevByDept = {};
  upstreamRecordsInRange(prev.start, prev.end).forEach(r=>{ const d=upstreamDeptFor(r.reason); prevByDept[d]=(prevByDept[d]||0)+(r.durationMin||0); });
  const prevHasData = Store.records.some(r=>r.date>=prev.start && r.date<=prev.end);
  const depts = {};
  recs.forEach(r=>{
    const name = upstreamDeptFor(r.reason);
    const g = depts[name] || (depts[name] = {name, totalMin:0, count:0, reasons:{}, machines:{}});
    const min = r.durationMin||0;
    g.totalMin += min; g.count++;
    const label = effectiveReasonLabel(r) || 'Waiting';
    const rg = g.reasons[label] || (g.reasons[label] = {label, totalMin:0, count:0});
    rg.totalMin += min; rg.count++;
    g.machines[r.machine] = (g.machines[r.machine]||0) + min;
  });
  const totalMin = recs.reduce((a,r)=>a+(r.durationMin||0),0);
  const list = Object.values(depts).map(g=>({
    ...g,
    share: totalMin>0 ? g.totalMin/totalMin*100 : 0,
    reasons: Object.values(g.reasons).sort((a,b)=>b.totalMin-a.totalMin),
    machines: Object.entries(g.machines).sort((a,b)=>b[1]-a[1]),
    prevMin: prevByDept[g.name]||0
  })).sort((a,b)=> (a.name===UPSTREAM_OTHERS) - (b.name===UPSTREAM_OTHERS) || b.totalMin-a.totalMin);
  const prevTotal = Object.values(prevByDept).reduce((a,b)=>a+b,0);
  return {list, totalMin, count:recs.length, allDownMin, sharePct: allDownMin>0 ? Math.round(totalMin/allDownMin*100) : 0, prev, prevTotal, prevHasData, days:new Set(recs.map(r=>r.date)).size};
}
/* Change vs the previous period of the same length. More waiting = red (worse), less = green. */
function upstreamTrend(cur, prev, hasPrev, forPdf){
  if(!hasPrev) return {text:'no earlier data', color: forPdf?'#999':'var(--muted)'};
  const diff = Math.round(cur - prev);
  if(prev<=0 && cur>0) return {text:'new this period', color: forPdf?'#c0392b':'var(--wait)'};
  if(diff===0) return {text:'no change', color: forPdf?'#999':'var(--muted)'};
  const pct = prev>0 ? Math.round(Math.abs(diff)/prev*100) : 0;
  return diff>0
    ? {text:`▲ ${fmtDur(diff)} more (+${pct}%)`, color: forPdf?'#c0392b':'var(--wait)'}
    : {text:`▼ ${fmtDur(-diff)} less (−${pct}%)`, color: forPdf?'#2e8b57':'var(--run)'};
}

/* v102: Before vs after noon, per line (Variovac 1–3). Shows when each line actually produced across the shift (8:00–4:30, split at 12:00) — e.g. a line starved all morning then flooded after lunch. Only RUNNING time counts as production; a record crossing noon is split. Upstream waiting before noon uses the same Upstream tag as the rest of this report. */
const AMPM_LINES = ['Variovac 1','Variovac 2','Variovac 3'];
const NOON_MIN = 12*60;
function fmtShort(min){ min=Math.round(min); if(min<60) return min+'m'; const h=Math.floor(min/60), m=min%60; return h+'h'+(m?String(m).padStart(2,'0'):''); }
function splitSpanAtNoon(start, end){
  const s=toMin(start), e=toMin(end);
  if(s==null||e==null||e<=s) return [0,0];
  return [Math.max(0, Math.min(e,NOON_MIN)-s), Math.max(0, e-Math.max(s,NOON_MIN))];
}
/* v116: a Live Floor run is split using its actual running segments, so stops inside the run (waiting, breaks…) are no longer counted as running time */
function splitAtNoon(r){
  if(r.status==='RUNNING' && r.plh && Array.isArray(r.plh.segments) && r.plh.segments.length){
    return r.plh.segments.reduce((acc,seg)=>{ const [a,b]=splitSpanAtNoon(seg.start, seg.end); return [acc[0]+a, acc[1]+b]; }, [0,0]);
  }
  return splitSpanAtNoon(r.startTime, r.endTime);
}
function computeAmPm(start, end){
  const recs = Store.records.filter(r=>r.date>=start && r.date<=end && AMPM_LINES.includes(r.machine));
  const days = [...new Set(recs.map(r=>r.date))].sort();
  const blank = ()=>({am:0, pm:0, upAm:0});
  const byDay = {}, tot = {};
  AMPM_LINES.forEach(l=>tot[l]=blank());
  days.forEach(d=>{ byDay[d]={}; AMPM_LINES.forEach(l=>byDay[d][l]=blank()); });
  recs.forEach(r=>{
    const [a,b] = splitAtNoon(r);
    const c = byDay[r.date][r.machine], t = tot[r.machine];
    if(r.status==='RUNNING'){ c.am+=a; c.pm+=b; t.am+=a; t.pm+=b; }
    if(r.status==='WAITING' && r.classification==='upstream'){ c.upAm+=a; t.upAm+=a; }
  });
  // A "starved morning": a line ran under 1h before noon while another line ran 2h+ that same morning
  const flags = [];
  days.forEach(d=>{
    const best = AMPM_LINES.reduce((x,l)=> byDay[d][l].am > byDay[d][x].am ? l : x, AMPM_LINES[0]);
    AMPM_LINES.forEach(l=>{
      const c = byDay[d][l];
      if(l!==best && c.am<60 && byDay[d][best].am>=120 && (c.pm>0 || c.upAm>0)) flags.push({date:d, line:l, am:c.am, upAm:c.upAm, other:best, otherAm:byDay[d][best].am});
    });
  });
  const active = AMPM_LINES.filter(l=>tot[l].am+tot[l].pm>0);
  let headline = '';
  if(active.length>=2){
    const lo = active.reduce((x,l)=> tot[l].am < tot[x].am ? l : x, active[0]);
    const hi = active.reduce((x,l)=> tot[l].am > tot[x].am ? l : x, active[0]);
    if(lo!==hi) headline = `Before noon, ${lo} ran ${fmtDur(tot[lo].am)} in total, while ${hi} ran ${fmtDur(tot[hi].am)}.${tot[lo].upAm>0?` ${lo} waited ${fmtDur(tot[lo].upAm)} on upstream areas before noon.`:''}`;
  }
  return {days, byDay, tot, flags, headline, hasData: active.length>0};
}
function isFlagged(a, d, l){ return a.flags.some(f=>f.date===d && f.line===l); }

  return `<div class="card">

/* ============ APP TOUR ============
The illustrated tour lives in its own file (tour.html, next to index.html) so the same tour serves two places: the shareable "How it works" link for supervisors/managers/the director, and this in-app overlay. One file to update when the tour changes. Shown automatically once per device (after sign-in), and on demand from Settings. */
const TOUR_SEEN_KEY = 'pct_tour_seen_v1';
async function openTour(auto){
  if(document.getElementById('tourOverlay')) return;
  try{
    const res = await fetch('tour.html', {method:'HEAD', cache:'no-store'});
    if(!res.ok) throw new Error('tour.html not found');
  }catch(e){
    if(!auto) toast('Tour unavailable — check tour.html is uploaded and you are online');
    return; // auto: stay silent and try again next launch (seen flag is not set)
  }
  const ov = document.createElement('div');
  ov.id = 'tourOverlay';
  ov.style.cssText = 'position:fixed;inset:0;z-index:100000;background:var(--bg);box-sizing:border-box;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);'; // safe-area padding lives here: iOS doesn't pass notch/home-bar insets into an iframe
  ov.innerHTML = '<iframe src="tour.html?app=1" title="App tour" style="border:0;width:100%;height:100%;display:block;background:var(--bg);"></iframe>';
  document.body.appendChild(ov);
  document.body.style.overflow = 'hidden';
}
function closeTour(){
  const ov = document.getElementById('tourOverlay');
  if(ov) ov.remove();
  document.body.style.overflow = '';
  safeLocalSet(TOUR_SEEN_KEY, '1');
}
window.addEventListener('message', e=>{
  if(e.origin !== location.origin) return;
  if(e.data && e.data.type === 'ci-tour-done') closeTour();
});
function tourLink(){ return new URL('tour.html', location.href).href; }
async function copyTourLink(){
  const link = tourLink();
  try{ await navigator.clipboard.writeText(link); toast('Tour link copied — paste it in a text or email'); }
  catch(e){ prompt('Copy this link:', link); }
}
async function shareTourLink(){
  const link = tourLink();
  if(navigator.share){
    try{ await navigator.share({title:'Packaging CI Tracker — how it works', url:link}); }catch(e){ /* user cancelled the share sheet */ }
  } else { copyTourLink(); }
}

/* v116: repairs records saved before v116 that were left open overnight (finish earlier than start, e.g. No Work from 4:00 PM closed at 8:33 AM next day → counted 16+ h). The finish is set to the 4:30 PM shift end (or the start, if it began after 4:30). Safe to run on every load — fixed records no longer match. */
async function repairOvernightRecords(){
  try{
    if(!Store.ready) return;
    let n=0;
    Store.records.forEach((r,i)=>{
      const s=toMin(r.startTime), e=toMin(r.endTime);
      if(s==null||e==null||e>=s) return;
      const newEnd = pastOpenEnd(r.startTime);
      let fixed = {...r, endTime:newEnd, durationMin: duration(r.startTime,newEnd), notes: ((r.notes||'')+' [auto-fixed: left open overnight, finish set to '+fmtTime12(newEnd)+']').trim()};
      if(r.status==='RUNNING' && r.plh && Array.isArray(r.plh.segments)){
        const plh = {...r.plh, segments: r.plh.segments.map(sg=>toMin(sg.end)<toMin(sg.start)?{...sg,end:pastOpenEnd(sg.start)}:sg), downtimeSegments:(r.plh.downtimeSegments||[]).map(d=>toMin(d.end)<toMin(d.start)?{...d,end:pastOpenEnd(d.start)}:d)};
        const rc = recalcLiveRunRecord({...r, plh}, r.startTime, newEnd);
        fixed = {...fixed, plh: rc.plh, durationMin: rc.durationMin};
      }
      Store.records[i] = fixed; n++;
    });
    if(n){ await Store.saveRecords(); toast(`Fixed ${n} record${n===1?'':'s'} left open overnight`); }
  }catch(e){ console.error('overnight repair failed', e); }
}
async function startApp(){
  await Store.init();
  await migrateReasonLabels();
  await repairOvernightRecords();
  render();
  if(!safeLocalGet(TOUR_SEEN_KEY)) openTour(true);
  setInterval(updateClock, 30000);
  setInterval(()=>{ if(Router.current==='live'||Router.current==='dashboard') render(); }, 30000);

  /* Self-heal a stale Firestore connection or a stale local cache: iOS can tear down the connection while the tab is backgrounded (phone locked, app switched away, or the device hopped between wifi/cellular). Firestore's offline persistence can silently keep showing old cached data with no error at all when this happens — so on returning to the app, force a genuine server read (bypassing the local cache) for whatever's currently live, rather than trusting the ambient listener to have caught up on its own. This is what keeps two devices (e.g. iPad on the floor, phone during a break) from disagreeing about what's actually running after switching between them. */
  let wasHidden = false;
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='hidden'){ wasHidden = true; return; }
    if(document.visibilityState==='visible' && wasHidden && Store.db){
      wasHidden = false;
      Store.db.collection('tracker').doc('records').get().catch(e=>{
        const msg = String(e && e.message || e).toLowerCase();
        if(msg.includes('terminated') || msg.includes('client is offline')){
          toast('Reconnecting…');
          setTimeout(()=>location.reload(), 600);
          return;
        }
      });
      // Force a genuine from-server refresh of live run state specifically — this is the data most likely to have changed on another device while this tab was away, and the one where a stale view causes real confusion
      Store.db.collection('tracker').doc('liveRuns').get({source:'server'}).then(snap=>{
        if(snap.exists && snap.data().data){
          Store.liveRuns = JSON.parse(snap.data().data);
          safeLocalSet('pct_live_runs_backup', snap.data().data);
          if(Router.current==='live'||Router.current==='dashboard') render();
        }
      }).catch(()=>{ /* server unreachable right now — the visible listener will catch up once it can */ });
    }
  });
}
